plugins { id 'com.android.application' version '8.9.1' }
android {
    namespace 'ar.com.alertasapd.webclient'
    compileSdk 35
    defaultConfig {
        applicationId 'ar.com.alertasapd.webclient.lab'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0-lab'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'androidx.browser:browser:1.8.0' }
