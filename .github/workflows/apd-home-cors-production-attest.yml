name: APD home CORS production metadata audit (read-only)
on:
  pull_request:
    paths:
      - 'scripts/attest-apd-home-cors-live.mjs'
      - '.github/workflows/apd-home-cors-production-attest.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}_ID: CLOUDFLARE_ACCOUNT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify active immutable Worker SHA256, crons and bindings without retrieving user data
        run: |
          set -euo pipefail
          node --check scripts/attest-apd-home-cors-live.mjs
          node scripts/attest-apd-home-cors-live.mjs
