name: APD online PWA install candidate
on:
  pull_request:
    paths:
      - 'apd-app.webmanifest'
      - 'apd-pwa-install.js'
      - 'icons/apd-app-*.png'
      - 'index.html'
      - 'scripts/test-apd-pwa-install.mjs'
      - '.github/workflows/apd-pwa-install.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-apd-pwa-install.mjs
