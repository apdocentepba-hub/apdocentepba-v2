name: Verify email health gate runtime 2026-09-18

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-email-health-gate-runtime-20260918.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      WORKER_NAME: ancient-wildflower-cd37
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify scheduled health invocation reached Supabase
        shell: bash
        run: |
          set -euo pipefail
          sleep 65
          mkdir -p tmp
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts?per_page=50" > tmp/accounts.json
          A=$(jq -r '.result[0].id' tmp/accounts.json)
          FROM="2026-09-18T01:26:05Z"
          TO=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          QUERY='query Q($a:string,$f:string,$t:string,$s:string){viewer{accounts(filter:{accountTag:$a}){workersInvocationsAdaptive(limit:100,filter:{scriptName:$s,datetime_geq:$f,datetime_leq:$t}){sum{requests errors subrequests} dimensions{datetime scriptName status}}}}}'
          jq -n --arg q "$QUERY" --arg a "$A" --arg f "$FROM" --arg t "$TO" --arg s "$WORKER_NAME" '{query:$q,variables:{a:$a,f:$f,t:$t,s:$s}}' > tmp/q.json
          CODE=$(curl -sS -o tmp/r.json -w '%{http_code}' https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data @tmp/q.json)
          echo "graphql_http=$CODE"; test "$CODE" = "200"
          node - <<'NODE'
          const j=require('./tmp/r.json');
          if(j.errors?.length) throw new Error(JSON.stringify(j.errors));
          const rows=j.data?.viewer?.accounts?.[0]?.workersInvocationsAdaptive||[];
          const out=rows.map(x=>({datetime:x.dimensions?.datetime,status:x.dimensions?.status,requests:Number(x.sum?.requests||0),errors:Number(x.sum?.errors||0),subrequests:Number(x.sum?.subrequests||0)})).sort((a,b)=>String(a.datetime).localeCompare(String(b.datetime)));
          console.log(JSON.stringify(out,null,2));
          const candidates=out.filter(x=>x.datetime>='2026-09-18T01:27:00Z' && x.subrequests>0 && x.errors===0);
          if(!candidates.length) throw new Error('No post-deploy scheduled invocation with Supabase subrequests observed');
          console.log('HEALTH_GATE_RUNTIME_OBSERVED '+JSON.stringify(candidates[candidates.length-1]));
          NODE
