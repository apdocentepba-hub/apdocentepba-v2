name: Deploy verified email slot dedupe fix

on:
  push:
    branches:
      - fix/alertas-email-2026-09-15
    paths:
      - .github/workflows/deploy-email-slot-dedupe-fix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote candidate with automatic rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_NAME: ancient-wildflower-cd37
          WORKER_URL: https://ancient-wildflower-cd37.apdocentepba.workers.dev
          SITE_URL: https://alertasapd.com.ar
          CANDIDATE_VERSION_ID: aaf3e360-fad4-4445-aab3-c9977f4b0cb5
          EXPECTED_OLD_VERSION_ID: c671b9f2-0f8f-44ad-9dac-da3cba0ecf68
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=50" > out/accounts.json
          ACCOUNT_ID=$(node -e "const j=require('./out/accounts.json');if(!j.success||!j.result?.length)process.exit(2);process.stdout.write(j.result[0].id)")

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" > out/before.json
          ACTIVE_BEFORE=$(node -e "const j=require('./out/before.json');const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];if(!v?.version_id)process.exit(3);process.stdout.write(v.version_id)")
          test "$ACTIVE_BEFORE" = "$EXPECTED_OLD_VERSION_ID"

          rollback() {
            echo "Verification failed; rolling back to ${EXPECTED_OLD_VERSION_ID}"
            cat > out/rollback.json <<JSON
          {"strategy":"percentage","versions":[{"version_id":"${EXPECTED_OLD_VERSION_ID}","percentage":100}],"annotations":{"workers/message":"Automatic rollback after email slot dedupe verification failure"}}
          JSON
            curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data @out/rollback.json > out/rollback-response.json || true
          }
          trap rollback ERR

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${CANDIDATE_VERSION_ID}?include=modules" > out/candidate.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const j=JSON.parse(fs.readFileSync('out/candidate.json','utf8'));
          const r=j.result||j;
          if(r.id!==process.env.CANDIDATE_VERSION_ID) throw new Error('candidate id mismatch');
          if(r.main_module!=='worker_hotfix.js') throw new Error(`unexpected main ${r.main_module}`);
          const m=(r.modules||[]).find(x=>x.name==='worker_hotfix.js');
          if(!m) throw new Error('candidate worker_hotfix.js missing');
          fs.writeFileSync('out/candidate-worker_hotfix.js',Buffer.from(m.content_base64||'','base64'));
          NODE
          node scripts/test-email-slot-dedupe-live.mjs out/candidate-worker_hotfix.js

          cat > out/deploy.json <<JSON
          {"strategy":"percentage","versions":[{"version_id":"${CANDIDATE_VERSION_ID}","percentage":100}],"annotations":{"workers/message":"AlertasAPD reliability: mark slot user sent only after Brevo success"}}
          JSON
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @out/deploy.json > out/deploy-response.json

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" > out/after.json
          ACTIVE_AFTER=$(node -e "const j=require('./out/after.json');const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];if(!v?.version_id)process.exit(4);process.stdout.write(v.version_id)")
          test "$ACTIVE_AFTER" = "$CANDIDATE_VERSION_ID"

          VERSION_CODE=$(curl -sS -o out/version.json -w "%{http_code}" "${WORKER_URL}/api/version")
          test "$VERSION_CODE" = "200"
          node -e "const j=require('./out/version.json');if(j.ok!==true)throw new Error('api/version not ok')"

          DRY_CODE=$(curl -sS -o out/dry-run.json -w "%{http_code}" "${WORKER_URL}/test-email-sweep?dry_run=1&debug=1&limit=10")
          test "$DRY_CODE" = "200"
          node - <<'NODE'
          const j=require('./out/dry-run.json');
          if(j.ok!==true || j.dry_run!==true) throw new Error('email dry-run invalid');
          if(Number(j.processed_users||0)<1) throw new Error('email dry-run processed no users');
          if(Number(j.failed_count||0)!==0) throw new Error(`email dry-run failures: ${j.failed_count}`);
          console.log('Dry-run OK',JSON.stringify({processed_users:j.processed_users,send_attempts:j.send_attempts,failed_count:j.failed_count}));
          NODE

          SITE_CODE=$(curl -L -sS -o /dev/null -w "%{http_code}" "${SITE_URL}/")
          test "$SITE_CODE" = "200"

          trap - ERR
          node - <<'NODE'
          const fs=require('fs');
          const dry=JSON.parse(fs.readFileSync('out/dry-run.json','utf8'));
          fs.writeFileSync('out/summary.json',JSON.stringify({
            deployed:true,
            old_version_id:process.env.EXPECTED_OLD_VERSION_ID,
            active_version_id:process.env.CANDIDATE_VERSION_ID,
            contract_passed:true,
            api_version_ok:true,
            email_dry_run_ok:true,
            dry_run_processed_users:Number(dry.processed_users||0),
            dry_run_send_attempts:Number(dry.send_attempts||0),
            dry_run_failed_count:Number(dry.failed_count||0),
            public_site_ok:true,
            rollback_triggered:false
          },null,2));
          NODE

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-slot-dedupe-deploy
          path: |
            out/summary.json
            out/rollback-response.json
          if-no-files-found: ignore
