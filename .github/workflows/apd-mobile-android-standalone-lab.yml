name: APD standalone offline Android lab APK (debug-key signed)
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/apd-mobile-android-standalone-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-offline-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 37.0 from preinstalled command-line tools
        run: |
          SDK_BIN="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_BIN" ]; then SDK_BIN="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          test -x "$SDK_BIN"
          yes | "$SDK_BIN" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null || true
          "$SDK_BIN" --sdk_root="$ANDROID_SDK_ROOT" --install 'platforms;android-37.0' 'build-tools;37.0.0'
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
      - name: Install demo dependencies and verify no production or push
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm test
          node --test src/demo-security.test.cjs
      - name: Generate disposable native app without Expo services
        working-directory: mobile
        run: |
          npx expo prebuild --platform android --no-install --non-interactive
          test -f android/gradlew
      - name: Compile release-mode, **LAB ONLY**, signed with generated debug key
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          # Expo generates this wrapper only on a disposable CI runner.
          # Gradle 9.4.1 defaults to just 10 seconds for downloads.
          WRAPPER_PROPERTIES=gradle/wrapper/gradle-wrapper.properties
          test -f "$WRAPPER_PROPERTIES"
          if grep -q '^networkTimeout=' "$WRAPPER_PROPERTIES"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=60000/' "$WRAPPER_PROPERTIES"
          else
            printf '\nnetworkTimeout=60000\n' >> "$WRAPPER_PROPERTIES"
          fi
          # Expo's current wrapper is 9.4.1. Pin the independent official
          # Gradle SHA-256; fail closed if Expo changes the wrapper version.
          grep -Fq 'gradle-9.4.1-bin.zip' "$WRAPPER_PROPERTIES"
          EXPECTED_GRADLE_SHA=2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb
          if grep -q '^distributionSha256Sum=' "$WRAPPER_PROPERTIES"; then
            sed -i "s/^distributionSha256Sum=.*/distributionSha256Sum=$EXPECTED_GRADLE_SHA/" "$WRAPPER_PROPERTIES"
          else
            printf '\ndistributionSha256Sum=%s\n' "$EXPECTED_GRADLE_SHA" >> "$WRAPPER_PROPERTIES"
          fi
          # First try the exact Expo-generated Gradle release using the
          # primary official host, then fall back to Gradle's official CDN.
          # Both URLs retain the *same version* and mandatory checksum.
          GRADLE_READY=0
          for attempt in 1 2; do
            if ./gradlew --version; then GRADLE_READY=1; break; fi
            sleep 5
          done
          if [ "$GRADLE_READY" -eq 0 ]; then
            echo 'Primary Gradle host unavailable; trying official downloads.gradle.org'
            grep -Fq 'services.gradle.org/distributions/gradle-9.4.1-bin.zip' "$WRAPPER_PROPERTIES"
            sed -i 's#services.gradle.org/distributions/#downloads.gradle.org/distributions/#' "$WRAPPER_PROPERTIES"
            ./gradlew --version
          fi
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          echo 'Checking offline bundled JavaScript inside APK...'
          unzip -Z1 app/build/outputs/apk/release/app-release.apk | grep -Eq '^assets/index.android.bundle$'
          echo 'Verifying APK is signed (debug keystore, NOT store signing)...'
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
      - name: Upload expiring standalone LAB APK — no stores, no user installations
        uses: actions/upload-artifact@v4
        with:
          name: APDocentePBA-Android-Standalone-DEMO-debugkey
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error
      - name: Ensure main website and Worker unchanged
        run: |
          git diff --exit-code -- index.html app_v2.js worker.js auth_session_patch.js
