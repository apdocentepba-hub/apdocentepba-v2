name: APD Mercado Pago Cloudflare preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/check-mp-cloudflare-readiness.mjs'
      - 'scripts/test-mp-cloudflare-readiness.mjs'
      - '.github/workflows/mp-cloudflare-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/check-mp-cloudflare-readiness.mjs'
      - 'scripts/test-mp-cloudflare-readiness.mjs'
      - '.github/workflows/mp-cloudflare-preflight.yml'

permissions:
  contents: read

jobs:
  candidate-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-mp-cloudflare-readiness.mjs
  live-metadata-read:
    if: github.event_name != 'pull_request'
    needs: candidate-unit-tests
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read production Worker version and binding names only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/check-mp-cloudflare-readiness.mjs
