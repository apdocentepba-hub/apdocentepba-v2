name: APD account-home authorized production promotion
on:
  push:
    branches:
      - release/apd-account-home-20261112
    paths:
      - '.github/workflows/apd-account-home-production-20261112.yml'
permissions:
  contents: read
concurrency:
  group: apd-account-home-production-promotion
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APD_ACCOUNT_HOME_RELEASE: AUTHORIZED_GO_REAL_QA_PASS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify local pinned release procedure syntax
        run: |
          set -euo pipefail
          node --check scripts/promote-apd-home-verified-version.mjs
          node scripts/test-live-source-equivalence.mjs
      - name: Promote only the QA-approved 0-percent candidate, smoke and rollback on error
        run: node scripts/promote-apd-home-verified-version.mjs
