name: APD scoped checkout UI exact promotion
on:
  pull_request:
    paths:
      - 'scripts/apd-commercial-promote-scoped-ui.mjs'
      - 'scripts/test-apd-commercial-promote-scoped-ui.mjs'
      - '.github/workflows/apd-commercial-promote-scoped-ui.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/apd-commercial-promote-scoped-ui.yml'
      - 'scripts/apd-commercial-promote-scoped-ui.mjs'
permissions:
  contents: read
concurrency:
  group: apd-commercial-zero-traffic
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/apd-commercial-promote-scoped-ui.mjs && node --test scripts/test-apd-commercial-promote-scoped-ui.mjs
  promote:
    if: github.repository == 'apdocentepba-hub/apdocentepba-v2' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apd-commercial-promote-scoped-ui.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APD_SUPABASE_DB_URL: ${{ secrets.APD_SUPABASE_DB_URL }}
          APD_PROMOTE_SCOPED_UI: '1'
