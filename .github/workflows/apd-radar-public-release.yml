name: APD radar public release - verify before merge
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/test-apd-radar-live-release.mjs'
      - 'scripts/apd-radar-release-guard.mjs'
      - 'scripts/test-apd-radar-release-guard-unit.mjs'
      - 'candidates/radar_provincia_live_20261102.js'
      - '.github/workflows/apd-radar-public-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test both current v2 preservation and guarded version bump
        run: |
          node --check scripts/apd-radar-release-guard.mjs
          node --check scripts/test-apd-radar-live-release.mjs
          node --test scripts/test-apd-radar-release-guard-unit.mjs
      - name: Validate existing radar contract and require public asset proof only for a real release
        run: node --test scripts/test-apd-radar-live-release.mjs
      - name: Preserve Worker, users, payments and Supabase integration
        run: |
          git diff --exit-code origin/main -- worker-live/worker_hotfix.js worker.js app_v2.js radar_provincia_patch_semaforo.js candidates/radar_provincia_live_20261102.js
