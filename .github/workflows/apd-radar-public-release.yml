name: APD radar public release - verify before merge
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/test-apd-radar-live-release.mjs'
      - '.github/workflows/apd-radar-public-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate one-line release, existing panel and public candidate asset
        run: node --test scripts/test-apd-radar-live-release.mjs
      - name: Preserve Worker, users, payments and Supabase integration
        run: |
          git diff --exit-code origin/main -- worker-live/worker_hotfix.js worker.js radar_provincia_patch_semaforo.js
          # APD-008: permit only the reviewed preference/channel patch, not arbitrary app changes.
          if ! git diff --quiet origin/main -- app_v2.js; then
            test "$(git rev-parse origin/main:app_v2.js)" = "1ca9c6c02d7cb784716d2f7f654a292233e3c597"
            test "$(git rev-parse HEAD:app_v2.js)" = "2374f29f219b72367faf64ca14d9e64503595e06"
            test "$(git hash-object app_v2.js)" = "2374f29f219b72367faf64ca14d9e64503595e06"
          fi
          test -z "$(git status --porcelain -- app_v2.js)"
