name: Extend email sweep recovery window 2026-09-17

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/extend-email-sweep-recovery-window-20260917.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extend:
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: ancient-wildflower-cd37
      EXPECTED_VERSION: a6eade87-0174-4490-9798-56af3d98095a
      OLD_TEMP_CRON: "* 10 17 9 *"
      TODAY_RECOVERY_CRON: "* * 17 9 *"
    steps:
      - name: Replace temporary trigger without increasing trigger count
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p tmp
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts?per_page=50" > tmp/accounts.json
          ACCOUNT_ID=$(node -e "const j=require('./tmp/accounts.json');process.stdout.write(j.result[0].id)")
          DEPLOYMENTS_URL="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments"
          SCHEDULES_URL="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/schedules"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$DEPLOYMENTS_URL" > tmp/deployments.json
          ACTIVE=$(node -e "const j=require('./tmp/deployments.json');const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];process.stdout.write(v?.version_id||'')")
          test "$ACTIVE" = "$EXPECTED_VERSION"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$SCHEDULES_URL" > tmp/before.json
          node <<'NODE'
          const fs=require('fs'); const j=require('./tmp/before.json');
          const before=(j.result?.schedules||j.result||[]).map(x=>x.cron).filter(Boolean);
          if(before.length!==4) throw new Error(`expected 4 schedules, got ${before.length}`);
          if(!before.includes(process.env.OLD_TEMP_CRON)) throw new Error('old recovery cron missing');
          const after=before.map(x=>x===process.env.OLD_TEMP_CRON?process.env.TODAY_RECOVERY_CRON:x);
          if(new Set(after).size!==4) throw new Error('schedule collision');
          fs.writeFileSync('tmp/update.json',JSON.stringify(after.map(cron=>({cron}))));
          console.log('before=',before.join(' | '));
          console.log('after=',after.join(' | '));
          NODE
          code=$(curl -sS -o tmp/update-response.json -w "%{http_code}" -X PUT "$SCHEDULES_URL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data @tmp/update.json)
          echo "schedules_http=${code}"
          if [ "$code" != "200" ]; then cat tmp/update-response.json; exit 1; fi
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$SCHEDULES_URL" > tmp/after.json
          node -e "const j=require('./tmp/after.json');const a=(j.result?.schedules||j.result||[]).map(x=>x.cron);if(a.length!==4||!a.includes(process.env.TODAY_RECOVERY_CRON)||a.includes(process.env.OLD_TEMP_CRON))process.exit(1);console.log('RECOVERY_WINDOW_OK',a.join(' | '))"
