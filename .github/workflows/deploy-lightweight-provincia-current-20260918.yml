name: Deploy lightweight provincial current scanner 2026-09-18

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-lightweight-provincia-current-20260918.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WORKER_NAME: ancient-wildflower-cd37
      EXPECTED_ACTIVE_VERSION: 82d74184-8e22-4e86-9a91-87c2e5385d36
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch test deploy and run one controlled scanner step
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts?per_page=50" > tmp/accounts.json
          A=$(jq -r '.result[0].id' tmp/accounts.json)
          DURL="https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${WORKER_NAME}/deployments"
          SURL="https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${WORKER_NAME}/schedules"

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$DURL" > tmp/deployments.json
          ACTIVE=$(node -e "const j=require('./tmp/deployments.json');const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];process.stdout.write(v?.version_id||'')")
          echo "active_before=$ACTIVE"
          test "$ACTIVE" = "$EXPECTED_ACTIVE_VERSION"

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${WORKER_NAME}/versions/${ACTIVE}?include=modules" > tmp/version.json
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$SURL" > tmp/schedules-before.json

          node - <<'NODE'
          const fs=require('fs');
          const r=require('./tmp/version.json').result;
          const m=(r.modules||[]).find(x=>x.name==='worker_hotfix.js');
          if(!m) throw new Error('worker_hotfix.js missing');
          const s=Buffer.from(m.content_base64||'','base64').toString('utf8');
          fs.writeFileSync('tmp/before.js',s);
          fs.writeFileSync('tmp/shape.json',JSON.stringify((r.bindings||[]).map(b=>`${b.name}:${b.type}`).sort()));
          const md={
            main_module:r.main_module,
            compatibility_date:r.compatibility_date,
            annotations:{
              'workers/message':'APDocentePBA: lightweight provincial published-current scanner',
              'workers/tag':'provincia-current-light-20260918'
            },
            bindings:(r.bindings||[]).map(b=>({name:b.name,type:'inherit',version_id:'latest'}))
          };
          if(Array.isArray(r.compatibility_flags)&&r.compatibility_flags.length) md.compatibility_flags=r.compatibility_flags;
          fs.writeFileSync('tmp/metadata.json',JSON.stringify(md));
          NODE

          # RED: active production still has snapshot-writing provincial scanner.
          node - <<'NODE'
          const s=require('fs').readFileSync('tmp/before.js','utf8');
          const a=s.indexOf('async function runProvinciaBackfillStep');
          const b=s.indexOf('__name(runProvinciaBackfillStep',a);
          if(a<0||b<0) throw new Error('runProvinciaBackfillStep missing');
          const block=s.slice(a,b);
          if(!block.includes('"apd_ofertas_global_snapshots"')) throw new Error('RED unexpectedly passed: snapshots already absent');
          console.log('RED confirmed: old scanner writes snapshots');
          NODE

          node - <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('tmp/before.js','utf8');

          function replaceFunction(src,name,newCode){
            const start=src.indexOf('async function '+name+'(');
            if(start<0) throw new Error(name+' start missing');
            const end=src.indexOf('__name('+name, start);
            if(end<0) throw new Error(name+' end missing');
            return src.slice(0,start)+newCode+'\n'+src.slice(end);
          }

          const fetchFn=`async function fetchAPDDistrictBatch(distritoAPD, startPage, pagesToRead, rowsPerPage) {
            const docs = [];
            let pagesRead = 0;
            let hasMore = false;
            let totalFound = 0;
            for (let offset = 0; offset < pagesToRead; offset += 1) {
              const pageIndex = startPage + offset;
              const start = pageIndex * rowsPerPage;
              const q = 'descdistrito:"' + escaparSolr(distritoAPD) + '" AND estado:"Publicada"';
              const url = 'https://servicios3.abc.gob.ar/valoracion.docente/api/apd.oferta.encabezado/select?q=' + encodeURIComponent(q) + '&rows=' + rowsPerPage + '&start=' + start + '&wt=json&sort=ult_movimiento%20desc';
              const res = await fetch(url);
              if (!res.ok) {
                const txt = await res.text();
                throw new Error('APD publicada respondio ' + res.status + ': ' + txt);
              }
              const buffer = await res.arrayBuffer();
              const rawText = new TextDecoder("iso-8859-1").decode(buffer);
              const data = JSON.parse(rawText || "{}");
              const pageDocs = Array.isArray(data?.response?.docs) ? data.response.docs : [];
              totalFound = Number(data?.response?.numFound ?? totalFound ?? 0);
              const filtered = pageDocs.filter((doc) =>
                norm(doc?.descdistrito || "") === norm(distritoAPD) &&
                estadoOfertaEsPublicada(doc) &&
                ofertaVigente(doc)
              );
              docs.push(...filtered);
              pagesRead += 1;
              hasMore = start + pageDocs.length < totalFound;
              if (!hasMore || pageDocs.length < rowsPerPage) break;
            }
            return { docs, pagesRead, hasMore, totalFound };
          }
          `;
          s=replaceFunction(s,'fetchAPDDistrictBatch',fetchFn);

          const runFn=`async function runProvinciaBackfillStep(env, options = {}) {
            let state = await obtenerScanState(env);
            const scanDate = String(options?.scan_date || "").trim();
            const mode = String(state?.notes?.scanner_mode || "").trim();
            const completedScanDate = String(state?.notes?.completed_scan_date || "").trim();
            const needsModeReset = mode !== "current_published";
            const needsDailyRestart = state.status === "finished" && scanDate && completedScanDate !== scanDate;

            if (needsModeReset || needsDailyRestart) {
              state = {
                scope: PROVINCIA_SCOPE,
                status: "idle",
                mode: "current_published",
                district_index: 0,
                district_name: null,
                next_page: 0,
                pages_processed: 0,
                districts_completed: 0,
                offers_processed: 0,
                last_batch_count: 0,
                total_districts: 0,
                started_at: null,
                finished_at: null,
                last_run_at: null,
                notes: {
                  ...(state?.notes || {}),
                  scanner_mode: "current_published",
                  snapshot_writes: false,
                  manual_only: false,
                  auto_window: "00:00-05:59 America/Argentina/Buenos_Aires",
                  scan_date: scanDate || null,
                  completed_scan_date: needsDailyRestart ? null : completedScanDate || null,
                  district_scan_started_at: null,
                  pruned_current_rows: 0,
                  migrated_at: needsModeReset ? new Date().toISOString() : state?.notes?.migrated_at || null,
                  last_error: null,
                  retryable: false,
                  failed_page: 0
                }
              };
              await saveScanState(env, state);
            }

            const staleRunning = isStaleProvinciaBackfill(state);
            if (state.status === "running" && options.force !== true && !staleRunning) {
              return { ok: true, skipped: true, reason: "already_running", mode: "current_published" };
            }

            const catalogRows = await obtenerDistritosProvincia(env);
            const distritos = unique(catalogRows.map((row) => norm(row.apd_nombre || row.nombre || "")).filter(Boolean));
            if (!distritos.length) throw new Error("No hay catalogo de distritos para el scanner provincial");

            let districtIndex = clampInt(state.district_index, 0, Math.max(distritos.length - 1, 0), 0);
            let nextPage = clampInt(state.next_page, 0, 999999, 0);
            let pagesProcessed = Number(state.pages_processed || 0);
            let districtsCompleted = Number(state.districts_completed || 0);
            let offersProcessed = Number(state.offers_processed || 0);
            let prunedTotal = Number(state?.notes?.pruned_current_rows || 0);
            const startedAt = state.started_at || new Date().toISOString();
            const districtName = distritos[districtIndex];
            const districtScanStartedAt = nextPage > 0 && state?.notes?.district_scan_started_at
              ? String(state.notes.district_scan_started_at)
              : new Date().toISOString();

            await saveScanState(env, {
              ...state,
              scope: PROVINCIA_SCOPE,
              status: "running",
              mode: "current_published",
              district_index: districtIndex,
              district_name: districtName,
              next_page: nextPage,
              total_districts: distritos.length,
              started_at: startedAt,
              finished_at: null,
              last_run_at: new Date().toISOString(),
              notes: {
                ...(state.notes || {}),
                scanner_mode: "current_published",
                snapshot_writes: false,
                manual_only: false,
                auto_window: "00:00-05:59 America/Argentina/Buenos_Aires",
                scan_date: scanDate || state?.notes?.scan_date || null,
                district_scan_started_at: districtScanStartedAt,
                retryable: false,
                last_error: null,
                failed_page: 0
              }
            });

            try {
              const batchInfo = await fetchAPDDistrictBatch(
                districtName,
                nextPage,
                PROVINCIA_STEP_PAGES,
                PROVINCIA_CAPTURE_ROWS_PER_PAGE
              );
              const capturedAt = new Date().toISOString();
              const shapedRows = batchInfo.docs.map((doc) => buildGlobalSnapshotRow(doc, capturedAt));
              const currentMap = await loadCurrentRowsMap(env, shapedRows.map((row) => row.source_offer_key));
              const currentRows = shapedRows.map((row) => buildGlobalCurrentRow(row, currentMap.get(row.source_offer_key), capturedAt));

              for (let i = 0; i < currentRows.length; i += HISTORICO_INSERT_BATCH) {
                await supabaseUpsert(
                  env,
                  "apd_ofertas_global_current",
                  currentRows.slice(i, i + HISTORICO_INSERT_BATCH),
                  "source_offer_key"
                );
              }

              pagesProcessed += batchInfo.pagesRead;
              offersProcessed += currentRows.length;
              let prunedThisStep = 0;

              if (batchInfo.hasMore) {
                nextPage += batchInfo.pagesRead;
              } else {
                const deletePath =
                  'apd_ofertas_global_current?distrito=eq.' + encodeURIComponent(norm(districtName)) +
                  '&last_seen_at=lt.' + encodeURIComponent(districtScanStartedAt);
                const deleted = await supabaseRequest(env, deletePath, {
                  method: "DELETE",
                  headers: { Prefer: "return=representation" }
                }).catch((err) => {
                  throw new Error("No se pudo podar current de " + districtName + ": " + String(err?.message || err));
                });
                prunedThisStep = Array.isArray(deleted) ? deleted.length : 0;
                prunedTotal += prunedThisStep;
                districtIndex += 1;
                districtsCompleted += 1;
                nextPage = 0;
              }

              const finished = districtIndex >= distritos.length;
              const nextNotes = {
                ...(state.notes || {}),
                scanner_mode: "current_published",
                snapshot_writes: false,
                manual_only: false,
                auto_window: "00:00-05:59 America/Argentina/Buenos_Aires",
                scan_date: scanDate || state?.notes?.scan_date || null,
                completed_scan_date: finished ? (scanDate || state?.notes?.scan_date || new Date().toISOString().slice(0,10)) : state?.notes?.completed_scan_date || null,
                district_scan_started_at: batchInfo.hasMore ? districtScanStartedAt : null,
                pruned_current_rows: prunedTotal,
                last_pruned_rows: prunedThisStep,
                last_source_num_found: Number(batchInfo.totalFound || 0),
                retryable: false,
                last_error: null,
                failed_page: 0,
                initial_backfill_completed: finished
              };

              await saveScanState(env, {
                ...state,
                scope: PROVINCIA_SCOPE,
                status: finished ? "finished" : "idle",
                mode: "current_published",
                district_index: finished ? distritos.length : districtIndex,
                district_name: finished ? null : distritos[districtIndex] || null,
                next_page: nextPage,
                pages_processed: pagesProcessed,
                districts_completed: districtsCompleted,
                offers_processed: offersProcessed,
                last_batch_count: currentRows.length,
                total_districts: distritos.length,
                started_at: startedAt,
                finished_at: finished ? new Date().toISOString() : null,
                last_run_at: new Date().toISOString(),
                notes: nextNotes
              });

              return {
                ok: true,
                mode: "current_published",
                snapshot_writes: false,
                finished,
                district_name: districtName,
                next_district_name: finished ? null : distritos[districtIndex] || null,
                next_page: nextPage,
                pages_processed: pagesProcessed,
                districts_completed: districtsCompleted,
                offers_processed: offersProcessed,
                last_batch_count: currentRows.length,
                source_num_found: Number(batchInfo.totalFound || 0),
                pruned_current_rows: prunedThisStep,
                pruned_current_rows_total: prunedTotal,
                total_districts: distritos.length
              };
            } catch (err) {
              await saveScanState(env, {
                ...state,
                scope: PROVINCIA_SCOPE,
                status: "error",
                mode: "current_published",
                district_index: districtIndex,
                district_name: districtName,
                next_page: nextPage,
                pages_processed: pagesProcessed,
                districts_completed: districtsCompleted,
                offers_processed: offersProcessed,
                last_batch_count: 0,
                total_districts: distritos.length,
                started_at: startedAt,
                finished_at: null,
                last_run_at: new Date().toISOString(),
                notes: {
                  ...(state.notes || {}),
                  scanner_mode: "current_published",
                  snapshot_writes: false,
                  manual_only: false,
                  scan_date: scanDate || state?.notes?.scan_date || null,
                  district_scan_started_at: districtScanStartedAt,
                  retryable: true,
                  last_error: err?.message || "Error en scanner provincial current",
                  failed_page: nextPage
                }
              });
              throw err;
            }
          }
          `;
          s=replaceFunction(s,'runProvinciaBackfillStep',runFn);

          const scannerHelpers=`
          function shouldRunProvinciaCurrentAuto(slot) {
            const hour = Number(slot?.hour ?? -1);
            return hour >= 0 && hour <= 5;
          }
          __name(shouldRunProvinciaCurrentAuto, "shouldRunProvinciaCurrentAuto");
          __name2(shouldRunProvinciaCurrentAuto, "shouldRunProvinciaCurrentAuto");

          async function maybeRunProvinciaCurrentCron(env, slot) {
            if (!shouldRunProvinciaCurrentAuto(slot)) {
              return { ok: true, skipped: true, reason: "outside_auto_window" };
            }
            const state = await obtenerScanState(env);
            const scanDate = String(slot?.slot_date || "").trim();
            const completed = String(state?.notes?.completed_scan_date || "").trim();
            if (state.status === "finished" && completed === scanDate && state?.notes?.scanner_mode === "current_published") {
              return { ok: true, skipped: true, reason: "scan_already_completed_today", scan_date: scanDate };
            }
            const staleRunning = isStaleProvinciaBackfill(state);
            const force = staleRunning || state.status === "error";
            try {
              const result = await runProvinciaBackfillStep(env, {
                source: "cron_current_published",
                scan_date: scanDate,
                force
              });
              console.log("PROVINCIA CURRENT SCAN", JSON.stringify(result || {}));
              return result;
            } catch (err) {
              await safeInsertSystemError(env, "provincia_current_scanner", err, {
                scan_date: scanDate,
                status: state?.status || null,
                district_index: state?.district_index ?? null,
                next_page: state?.next_page ?? null
              });
              throw err;
            }
          }
          __name(maybeRunProvinciaCurrentCron, "maybeRunProvinciaCurrentCron");
          __name2(maybeRunProvinciaCurrentCron, "maybeRunProvinciaCurrentCron");
          `;
          const scannerInsert='async function runProvinciaBackfillStep(env, options = {}) {';
          if(!s.includes(scannerInsert)) throw new Error('scanner insertion marker missing');
          s=s.replace(scannerInsert,scannerHelpers+scannerInsert);

          const idleStart=s.indexOf('    if (isContinuationCron && !activeSlotKey) {');
          const idleEnd=s.indexOf('    let bypassFinishedForRecovery = false;', idleStart);
          if(idleStart<0 || idleEnd<0 || idleEnd<=idleStart) throw new Error('scheduled idle block markers missing');
          const newIdle=`    if (isContinuationCron && !activeSlotKey) {
              const backgroundTasks = [];
              if (slot.slot_key && slot.minute >= 13) {
                backgroundTasks.push(checkEmailCronSlotHealth(env, kv, slot.slot_key).catch((err) => {
                  console.error("EMAIL CRON HEALTH CHECK FAILED", String(err?.message || err || ""));
                }));
              }
              if (shouldRunProvinciaCurrentAuto(slot)) {
                backgroundTasks.push(maybeRunProvinciaCurrentCron(env, slot).catch((err) => {
                  console.error("PROVINCIA CURRENT CRON FAILED", String(err?.message || err || ""));
                }));
              }
              if (backgroundTasks.length) ctx.waitUntil(Promise.allSettled(backgroundTasks));
              return;
            }
`;
          s=s.slice(0,idleStart)+newIdle+s.slice(idleEnd);

          fs.writeFileSync('tmp/worker_hotfix.js',s);
          NODE

          node --check tmp/worker_hotfix.js

          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const s=fs.readFileSync('tmp/worker_hotfix.js','utf8');
          const a=s.indexOf('async function runProvinciaBackfillStep');
          const b=s.indexOf('__name(runProvinciaBackfillStep',a);
          const block=s.slice(a,b);
          assert(!block.includes('"apd_ofertas_global_snapshots"'));
          assert(block.includes('"apd_ofertas_global_current"'));
          assert(block.includes('method: "DELETE"'));
          assert(s.includes('AND estado:"Publicada"'));
          assert(s.includes('estadoOfertaEsPublicada(doc)'));
          assert(s.includes('ofertaVigente(doc)'));
          assert(s.includes('async function maybeRunProvinciaCurrentCron'));
          assert(s.includes('hour >= 0 && hour <= 5'));
          assert(s.includes('Promise.allSettled(backgroundTasks)'));
          console.log('GREEN static scanner checks passed');
          NODE

          CODE=$(curl -sS -o tmp/upload.json -w '%{http_code}' -X POST             "https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${WORKER_NAME}/versions?bindings_inherit=strict"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -F "metadata=<tmp/metadata.json;type=application/json"             -F "worker_hotfix.js=@tmp/worker_hotfix.js;filename=worker_hotfix.js;type=application/javascript+module")
          echo "upload_http=$CODE"; test "$CODE" = "200"
          C=$(jq -r '.result.id' tmp/upload.json)
          test -n "$C" -a "$C" != "null"
          echo "candidate=$C"

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${WORKER_NAME}/versions/${C}?include=modules" > tmp/candidate.json
          node - <<'NODE'
          const exp=require('./tmp/shape.json'),r=require('./tmp/candidate.json').result;
          const act=(r.bindings||[]).map(b=>`${b.name}:${b.type}`).sort();
          if(JSON.stringify(exp)!==JSON.stringify(act)) throw new Error('binding drift');
          const m=(r.modules||[]).find(x=>x.name==='worker_hotfix.js');
          const s=Buffer.from(m.content_base64,'base64').toString('utf8');
          for(const x of ['AND estado:"Publicada"','snapshot_writes: false','maybeRunProvinciaCurrentCron','Promise.allSettled(backgroundTasks)']) {
            if(!s.includes(x)) throw new Error('candidate missing '+x);
          }
          console.log('candidate verified bindings='+act.length);
          NODE

          rollback(){
            printf '{"strategy":"percentage","versions":[{"version_id":"%s","percentage":100}]}' "$ACTIVE" > tmp/rollback.json
            curl -sS -X POST "$DURL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data @tmp/rollback.json >/dev/null || true
            curl -sS -X PUT "$SURL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data @tmp/schedules-before.json >/dev/null || true
          }
          trap rollback ERR

          printf '{"strategy":"percentage","versions":[{"version_id":"%s","percentage":100}]}' "$C" > tmp/deploy.json
          CODE=$(curl -sS -o tmp/deploy-result.json -w '%{http_code}' -X POST "$DURL"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data @tmp/deploy.json)
          echo "deploy_http=$CODE"; test "$CODE" = "200"
          sleep 3

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$DURL" > tmp/final-deployments.json
          FINAL=$(node -e "const j=require('./tmp/final-deployments.json');const d=j.result.deployments[0];process.stdout.write((d.versions.find(x=>Number(x.percentage)===100)||d.versions[0]).version_id)")
          echo "active_after=$FINAL"
          test "$FINAL" = "$C"

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$SURL" > tmp/schedules-after.json
          node - <<'NODE'
          function ls(j){return (j.result?.schedules||j.result||[]).map(x=>x.cron).filter(Boolean).sort()}
          const a=ls(require('./tmp/schedules-before.json')),b=ls(require('./tmp/schedules-after.json'));
          if(JSON.stringify(a)!==JSON.stringify(b)) throw new Error('schedule drift '+JSON.stringify({a,b}));
          console.log('schedules unchanged '+a.join(' | '));
          NODE

          # Exactly one controlled real scanner step.
          STEP_URL="https://ancient-wildflower-cd37.apdocentepba.workers.dev/api/provincia/backfill-step"
          CODE=$(curl --max-time 90 -sS -o tmp/step.json -w '%{http_code}' -X POST "$STEP_URL"             -H 'Content-Type: application/json' --data '{"force":true}')
          echo "step_http=$CODE"; cat tmp/step.json
          test "$CODE" = "200"
          node - <<'NODE'
          const j=require('./tmp/step.json');
          if(j.ok!==true) throw new Error('scanner step failed '+JSON.stringify(j));
          if(j.mode!=='current_published') throw new Error('wrong mode '+JSON.stringify(j));
          if(j.snapshot_writes!==false) throw new Error('snapshot writes not disabled');
          if(String(j.district_name||'')!=='25 DE MAYO') throw new Error('unexpected first district '+JSON.stringify(j));
          console.log('LIVE_SCANNER_STEP_OK '+JSON.stringify({
            district:j.district_name,
            source_num_found:j.source_num_found,
            active_rows:j.last_batch_count,
            pruned:j.pruned_current_rows,
            next_district:j.next_district_name,
            next_page:j.next_page
          }));
          NODE

          cp tmp/worker_hotfix.js worker-live/worker_hotfix.js
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),r=require('./tmp/candidate.json').result;
          const p=JSON.parse(fs.readFileSync('worker-live/manifest.json','utf8'));
          const buf=fs.readFileSync('worker-live/worker_hotfix.js');
          p.version_id=r.id;
          p.version_number=r.number??null;
          p.main_module=r.main_module;
          p.compatibility_date=r.compatibility_date||null;
          p.captured_at=new Date().toISOString();
          p.modules=[{name:'worker_hotfix.js',sha256:crypto.createHash('sha256').update(buf).digest('hex'),bytes:buf.length}];
          fs.writeFileSync('worker-live/manifest.json',JSON.stringify(p,null,2)+'\n');
          NODE

          git config user.name "apdocentepba-hub"
          git config user.email "apdocentepba@gmail.com"
          git add worker-live/worker_hotfix.js worker-live/manifest.json
          git commit -m "feat: replace provincial scanner with lightweight current scan"
          git push origin HEAD:main

          trap - ERR
          echo "LIGHTWEIGHT_SCANNER_OK version=$FINAL"
