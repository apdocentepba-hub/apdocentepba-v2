name: APD optimizer and reminder policy - offline candidate
on:
  pull_request:
    paths:
      - 'scripts/apd-week-optimizer.mjs'
      - 'scripts/apd-week-optimizer-ui.mjs'
      - 'apd_comparador_panel.mjs'
      - 'scripts/test-apd-comparador-browser.mjs'
      - 'scripts/apd-favorite-reminder-policy.mjs'
      - 'scripts/test-apd-optimizer-reminders.mjs'
      - '.github/workflows/apd-optimizer-reminder-candidate.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-apd-optimizer-reminders.mjs
      - run: node --check scripts/apd-week-optimizer-ui.mjs
      - run: node scripts/test-apd-comparador-browser.mjs
