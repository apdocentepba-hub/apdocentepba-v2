name: Capture verified APDocente production Worker

on:
  pull_request:
    paths:
      - 'scripts/capture-verified-live-worker.mjs'
      - 'scripts/test-capture-verified-live-worker.mjs'
      - '.github/workflows/capture-verified-live-worker.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/capture-verified-live-worker.mjs'
      - 'scripts/test-capture-verified-live-worker.mjs'
      - '.github/workflows/capture-verified-live-worker.yml'

permissions:
  contents: write

concurrency:
  group: apd-canonical-worker-baseline
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/capture-verified-live-worker.mjs
      - run: node --test scripts/test-capture-verified-live-worker.mjs
      - run: node scripts/test-live-source-equivalence.mjs
  capture:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical snapshot before trusted read
        run: node scripts/test-live-source-equivalence.mjs
      - name: Read and verify active source without accessing variable values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/capture-verified-live-worker.mjs
      - name: Commit source and metadata snapshot only
        run: |
          node scripts/test-live-source-equivalence.mjs
          git diff --exit-code -- . ':!worker-live/worker_hotfix.js' ':!worker-live/manifest.json'
          if ! git diff --quiet -- worker-live/worker_hotfix.js worker-live/manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- worker-live/worker_hotfix.js worker-live/manifest.json
            git commit -m "chore: capture verified active Worker after messaging privacy release"
            git push origin HEAD:main
          fi
