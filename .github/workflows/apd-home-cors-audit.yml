name: APD home CORS live preflight (read-only)
on:
  pull_request:
    paths:
      - 'scripts/audit-apd-home-cors.mjs'
      - '.github/workflows/apd-home-cors-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live OPTIONS and anonymous GET without writes or secrets
        run: |
          node --check scripts/audit-apd-home-cors.mjs
          node scripts/audit-apd-home-cors.mjs
