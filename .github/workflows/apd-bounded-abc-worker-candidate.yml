name: APD ABC bounded Worker optimization - candidate only
on:
  pull_request:
    paths:
      - 'worker-live/worker_hotfix.js'
      - 'scripts/build-apd-bounded-abc-worker-release.mjs'
      - 'scripts/test-apd-bounded-abc-worker-release.mjs'
      - 'scripts/benchmark-apd-bounded-abc-synthetic.mjs'
      - 'scripts/test-apd-worker-to-carousel-contract.mjs'
      - 'scripts/probe-apd-abc-two-districts-live-readonly.mjs'
      - 'scripts/attest-apd-worker-candidate.mjs'
      - 'scripts/check-apd-worker-live-version-readonly.mjs'
      - 'scripts/test-apd-worker-live-version-readonly.mjs'
      - 'scripts/check-apd-worker-anonymous-http-readonly.mjs'
      - 'scripts/build-apd-worker-zero-traffic-config.mjs'
      - 'scripts/test-apd-worker-zero-traffic-config.mjs'
      - 'scripts/upload-apd-worker-zero-traffic-once.mjs'
      - 'scripts/test-apd-worker-anonymous-http-readonly.mjs'
      - '.github/workflows/apd-bounded-abc-worker-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate isolated Worker candidate from the immutable production snapshot
        run: |
          node --check scripts/build-apd-bounded-abc-worker-release.mjs
          node scripts/build-apd-bounded-abc-worker-release.mjs
          node --check tmp/apd-bounded-abc-worker-release/worker_hotfix.js
          node --check scripts/test-apd-bounded-abc-worker-release.mjs
      - name: Check only two functions changed and ABC parity under errors and concurrency
        run: |
          node --test scripts/test-apd-bounded-abc-worker-release.mjs
      - name: Benchmark six synthetic district reads against unchanged production Worker routine
        run: |
          node --check scripts/benchmark-apd-bounded-abc-synthetic.mjs
          node scripts/benchmark-apd-bounded-abc-synthetic.mjs
      - name: Test actual Worker matched offers through API JSON to production carousel
        run: |
          node --check scripts/test-apd-worker-to-carousel-contract.mjs
          node --test scripts/test-apd-worker-to-carousel-contract.mjs
      - name: Bundle candidate with pinned Wrangler in dry-run mode; no Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        run: |
          set -euo pipefail
          npx --yes wrangler@4.20.3 deploy tmp/apd-bounded-abc-worker-release/worker_hotfix.js --dry-run --outdir tmp/apd-bounded-abc-wrangler-dryrun --name apd-abc-bounded-candidate-check --compatibility-date 2026-04-01
          test -d tmp/apd-bounded-abc-wrangler-dryrun
          BUNDLE=$(find tmp/apd-bounded-abc-wrangler-dryrun -type f \( -name '*.js' -o -name '*.mjs' \) -print -quit)
          test -n "$BUNDLE"
          node --check "$BUNDLE"
      - name: Validate zero-traffic upload configuration against all four canonical crons
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        run: |
          node --check scripts/build-apd-worker-zero-traffic-config.mjs
          node --check scripts/upload-apd-worker-zero-traffic-once.mjs
          node --test scripts/test-apd-worker-zero-traffic-config.mjs
          node scripts/build-apd-worker-zero-traffic-config.mjs
          npx --yes wrangler@4.20.3 deploy tmp/apd-bounded-abc-worker-release/worker_hotfix.js --config tmp/apd-bounded-abc-worker-release/wrangler.zero-traffic.toml --dry-run --outdir tmp/apd-bounded-abc-upload-config-dryrun
      - name: Verify canonical snapshot and attest candidate SHA-256 + rollback prerequisites
        run: |
          node --check scripts/attest-apd-worker-candidate.mjs
          node scripts/test-live-source-equivalence.mjs
          node scripts/attest-apd-worker-candidate.mjs
      - name: Verify live Cloudflare 100-percent Worker version + bindings using read-only GETs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --check scripts/check-apd-worker-live-version-readonly.mjs
          node --test scripts/test-apd-worker-live-version-readonly.mjs
          node scripts/check-apd-worker-live-version-readonly.mjs
      - name: Check live Worker anonymous 401/200 HTTP contracts using GET and OPTIONS only
        run: |
          node --check scripts/check-apd-worker-anonymous-http-readonly.mjs
          node --test scripts/test-apd-worker-anonymous-http-readonly.mjs
          node scripts/check-apd-worker-anonymous-http-readonly.mjs
      - name: Measure two live ABC district GETs sequential vs parallel (4 GETs only, no user data)
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        run: |
          node --check scripts/probe-apd-abc-two-districts-live-readonly.mjs
          node scripts/probe-apd-abc-two-districts-live-readonly.mjs
      - name: Preserve Worker source, frontend, login, plans, and database exactly
        run: |
          git diff --exit-code origin/main -- worker-live worker.js app_v2.js index.html auth_session_patch.js supabase sql
          test -z "$(git status --porcelain -- worker-live worker.js app_v2.js index.html auth_session_patch.js supabase sql)"
      - name: Verify release has no direct deployment or additional secrets
        run: |
          node -e "const p=require('./package.json');if(!String(p.scripts['deploy:worker']).includes('direct repository deploy disabled'))process.exit(1)"
      - name: Archive candidate code for later independent, authorized deploy review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apd-abc-bounded-worker-release-candidate
          path: |
            tmp/apd-bounded-abc-worker-release/worker_hotfix.js
            tmp/apd-bounded-abc-worker-release/attestation.json
          if-no-files-found: error
          retention-days: 7
