name: Materialize PBKDF2 format fix

on:
  push:
    branches:
      - fix/account-security-session-api-2026-09-16
    paths:
      - .github/workflows/materialize-pbkdf2-format-fix.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/account-security-session-api-2026-09-16
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix PBKDF2 serialization and manifest hash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          worker_path = Path('worker-live/worker_hotfix.js')
          manifest_path = Path('worker-live/manifest.json')
          text = worker_path.read_text()
          old = 'return `pbkdf2_sha256${ACCOUNT_PBKDF2_ITERATIONS_V1}${salt}${hash}`;'
          new = 'return `pbkdf2_sha256$${ACCOUNT_PBKDF2_ITERATIONS_V1}$${salt}$${hash}`;'
          assert text.count(old) == 1, f'expected exactly one broken PBKDF2 encoder, found {text.count(old)}'
          text = text.replace(old, new)
          worker_path.write_text(text)
          manifest = json.loads(manifest_path.read_text())
          entry = next((m for m in manifest.get('modules', []) if m.get('name') == 'worker_hotfix.js'), None)
          assert entry is not None, 'worker_hotfix.js missing from manifest'
          entry['module_sha256'] = hashlib.sha256(text.encode()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          print(entry['module_sha256'])
          PY
          node --check worker-live/worker_hotfix.js
          grep -F 'return `pbkdf2_sha256$${ACCOUNT_PBKDF2_ITERATIONS_V1}$${salt}$${hash}`;' worker-live/worker_hotfix.js
      - name: Commit exact PBKDF2 fix and remove materializer
        run: |
          set -euo pipefail
          git config user.name 'apdocentepba-hub'
          git config user.email 'apdocentepba@gmail.com'
          git rm .github/workflows/materialize-pbkdf2-format-fix.yml
          git add worker-live/worker_hotfix.js worker-live/manifest.json
          git diff --cached --check
          git commit -m 'Fix PBKDF2 password serialization'
          git push origin HEAD:fix/account-security-session-api-2026-09-16
