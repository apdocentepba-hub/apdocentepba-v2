name: APD private API schema: scanner-only HTTP RPC with 24-column offers (PG17)
on:
  pull_request:
    paths:
      - 'tests/sql/apd_private_rpc_gateway_pg17.sql'
      - 'scripts/test-apd-private-rpc-real-http.mjs'
      - '.github/workflows/apd-private-rpc-security-invoker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scanner-only-private-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: apd_ci
          POSTGRES_PASSWORD: disposable_ci_pilot_only
          POSTGRES_DB: apd_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apd_ci -d apd_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: apd_ci
      PGUSER: apd_ci
      PGPASSWORD: disposable_ci_pilot_only
      APD_CI_FAKE_JWT_SECRET: "CI-only-disposable-SHA256-jwt-test-0123456789-very-long"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create private PG17 staging, full 24-field table and restricted API schema
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          fi
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/apd_atomic_district_pilot_pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/apd_atomic_stage_pages_pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/apd_atomic_full_24col_pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/apd_private_rpc_gateway_pg17.sql
      - name: Insert synthetic existing records for historical preservation and no-prune tests
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO apd_scanner_pilot.current_offers
            (source_offer_key,distrito,estado,first_seen_at,last_seen_at,times_seen)
          VALUES ('D_1','MATANZA','Anulada','2026-01-01','2026-10-01',4),
                 ('D_STALE','MATANZA','Publicada','2026-01-01','2026-10-01',1),
                 ('D_OTHER','AVELLANEDA','Publicada','2026-01-01','2026-10-01',2);
          INSERT INTO apd_scanner_pilot.current_offers_full
            (source_offer_key,distrito,estado,first_seen_at,last_seen_at,
             last_state_change_at,times_seen,state_changes,raw)
          VALUES ('D_1','MATANZA','Anulada','2026-01-01','2026-10-01','2026-10-01',4,2,'{"old":true}'),
                 ('D_STALE','MATANZA','Publicada','2026-01-01','2026-10-01','2026-10-01',1,0,'{"old":true}'),
                 ('D_OTHER','AVELLANEDA','Publicada','2026-01-01','2026-10-01','2026-10-01',2,0,'{"other":true}');
          SQL
      - name: Start PostgREST with ONLY public API schema (private staging not exposed)
        run: |
          docker run -d --rm --name apd-private-rpc --network host \
            -e PGRST_DB_URI="postgres://apd_ci:disposable_ci_pilot_only@127.0.0.1:5432/apd_ci" \
            -e PGRST_DB_SCHEMAS="apd_scanner_api" \
            -e PGRST_DB_ANON_ROLE="apd_api_anon" \
            -e PGRST_JWT_SECRET="$APD_CI_FAKE_JWT_SECRET" \
            -e PGRST_SERVER_PORT="3300" \
            postgrest/postgrest:v16.3
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3300/ >/dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:3300/ >/dev/null
      - name: Exercise real HTTP roles and full 650-offer capture through scanner-only RPC
        run: |
          node --check scripts/test-apd-private-rpc-real-http.mjs
          node scripts/test-apd-private-rpc-real-http.mjs
      - name: Check private tables, transition history, no pruning, and exact replays
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM apd_scanner_pilot.current_offers_full)<>652 OR
               (SELECT count(*) FROM apd_scanner_pilot.current_offers)<>652 OR
               (SELECT count(*) FROM apd_scanner_pilot.staged_pages)<>5 OR
               (SELECT count(*) FROM apd_scanner_pilot.full_staged_payloads)<>650 THEN
              RAISE EXCEPTION 'Captured pages or full rows incorrect';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM apd_scanner_pilot.current_offers_full
              WHERE source_offer_key='D_1' AND distrito='MATANZA'
                AND first_seen_at='2026-01-01'::timestamptz
                AND estado='Publicada' AND state_changes=3 AND times_seen=5
                AND raw->'nested'->>'n'='1'
            ) THEN RAISE EXCEPTION 'First observation/state changes/raw not preserved'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM apd_scanner_pilot.current_offers_full
              WHERE source_offer_key='D_STALE' AND distrito='MATANZA'
            ) OR NOT EXISTS (
              SELECT 1 FROM apd_scanner_pilot.current_offers_full
              WHERE source_offer_key='D_OTHER' AND distrito='AVELLANEDA'
            ) THEN RAISE EXCEPTION 'Default capture pruned unrelated or stale data'; END IF;
            IF (SELECT status FROM apd_scanner_pilot.runs
                WHERE run_id='00000000-0000-0000-0000-000000000925')<>'finalized' THEN
              RAISE EXCEPTION 'Capture was not finalized';
            END IF;
          END$$;
          SELECT 'PASS: 650 full offers, 5 stages, historical fields, no delete and scanner-only API' AS result;
          SQL
      - name: Guard real Worker, frontend and production database sources
        run: git diff --exit-code origin/main -- worker-live/worker_hotfix.js index.html app_v2.js sql supabase
      - name: Destroy disposable PostgREST
        if: always()
        run: docker rm -f apd-private-rpc || true
