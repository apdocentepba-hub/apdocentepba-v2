name: Reconcile production Mercado Pago secret-only baseline

on:
  pull_request:
    paths:
      - 'scripts/reconcile-mp-secret-baseline.mjs'
      - 'scripts/test-reconcile-mp-secret-baseline.mjs'
      - '.github/workflows/reconcile-mp-secret-baseline.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/reconcile-mp-secret-baseline.mjs'
      - 'scripts/test-reconcile-mp-secret-baseline.mjs'
      - '.github/workflows/reconcile-mp-secret-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apd-canonical-worker-baseline
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/reconcile-mp-secret-baseline.mjs
      - run: node --test scripts/test-reconcile-mp-secret-baseline.mjs
  reconcile:
    needs: contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify snapshot source
        run: node scripts/test-live-source-equivalence.mjs
      - name: Read active Cloudflare metadata and smoke Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/reconcile-mp-secret-baseline.mjs
      - name: Commit verified version metadata only
        run: |
          if ! git diff --quiet -- worker-live/manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add worker-live/manifest.json
            git commit -m "chore: reconcile secret-only Cloudflare Worker version"
            git push origin HEAD:main
          fi
          git diff --exit-code -- worker-live/worker_hotfix.js
