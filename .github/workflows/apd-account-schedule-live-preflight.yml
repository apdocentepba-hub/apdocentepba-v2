name: APD account schedule live preflight - read only
on:
  pull_request:
    paths:
      - '.github/workflows/apd-account-schedule-live-preflight.yml'
      - 'scripts/inspect-account-schedule-live.mjs'
      - 'scripts/build-account-schedule-worker-candidate.mjs'
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/insigne-career-planner-phase1-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture exact live Worker without logging source or changing traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/inspect-account-schedule-live.mjs
      - name: Prove isolated insertion on actual active source
        run: |
          APD_ACCOUNT_SCHEDULE_LIVE_SOURCE=tmp/apd-account-schedule/active-worker.mjs node scripts/build-account-schedule-worker-candidate.mjs
          node --check tmp/apd-account-schedule/worker-schedule-candidate.mjs
      - name: Remove transient source
        if: always()
        run: rm -rf tmp/apd-account-schedule
