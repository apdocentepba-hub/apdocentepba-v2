name: APD account home candidate - security (no deploy)
on:
  pull_request:
    paths:
      - 'docs/sql/APD_ACCOUNT_HOME_REFERENCE_CANDIDATE_20261112.sql'
      - 'scripts/apd-account-home-core.mjs'
      - 'scripts/build-account-home-worker-candidate.mjs'
      - 'scripts/test-apd-account-home.mjs'
      - 'scripts/test-apd-account-home-frontend.mjs'
      - 'scripts/apd-account-home-write-policy.mjs'
      - 'scripts/test-apd-account-home-write-policy.mjs'
      - 'scripts/test-apd-account-home-panel-dom.mjs'
      - 'scripts/apd-mi-jornada-ui.mjs'
      - 'account_home_reference_patch.js'
      - 'index.html'
      - '.github/workflows/apd-account-home-candidate.yml'
permissions:
  contents: read
jobs:
  candidate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax - local secure frontend and account model
        run: |
          node --check account_home_reference_patch.js
          node --check scripts/apd-account-home-core.mjs
          node --check scripts/build-account-home-worker-candidate.mjs
          node --check scripts/apd-mi-jornada-ui.mjs
          node --check apd_comparador_panel.mjs
      - name: Account model and Worker sandbox regression (no network)
        run: node --test scripts/test-apd-account-home.mjs scripts/test-apd-account-home-frontend.mjs scripts/test-apd-account-home-panel-dom.mjs scripts/test-apd-account-home-write-policy.mjs
      - name: Guard that no production artifacts changed
        run: |
          if git diff --name-only origin/main...HEAD | grep -E '^(worker-live/|worker\.js$|wrangler\.toml$|\.github/workflows/deploy-worker)'; then
            echo 'Refusing candidate: production Worker or deployment config modified' >&2
            exit 1
          fi
          echo 'Candidate source only; no database migration or Worker deployment'
