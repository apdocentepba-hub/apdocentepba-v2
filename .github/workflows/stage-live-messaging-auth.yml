name: Stage live-based messaging authorization preview

on:
  pull_request:
    paths:
      - 'scripts/stage-live-messaging-auth.mjs'
      - 'scripts/test-stage-live-messaging-auth.mjs'
      - '.github/workflows/stage-live-messaging-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apd-live-messaging-staging
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/stage-live-messaging-auth.mjs
      # Retired stage-builder tests target an intentionally absent vulnerable source.
      # Test the current privacy contract and syntax without running the old builder.
      - run: node --check scripts/stage-live-messaging-auth.mjs
      # Canonical Worker already carries the privacy fix; do not construct obsolete patch.
      - run: node --test scripts/test-live-messaging-status-auth-current.mjs
  stage-undeployed:
    needs: unit
    # Disabled: old uploader expects push events and can create Cloudflare versions.
    # A new reviewed, explicitly approved staging workflow is required.
    if: false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Upload isolated version from LIVE source; no production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/stage-live-messaging-auth.mjs
