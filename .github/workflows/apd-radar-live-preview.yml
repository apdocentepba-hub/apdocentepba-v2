name: APD radar provincial live candidate - offline contracts
on:
  pull_request:
    paths:
      - 'candidates/radar_provincia_live_20261102.js'
      - 'scripts/test-apd-radar-live-candidate.mjs'
      - 'scripts/test-apd-radar-live-release.mjs'
      - 'index.html'
      - '.github/workflows/apd-radar-live-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate browser script syntax
        run: node --check candidates/radar_provincia_live_20261102.js
      - name: Validate real scan state, stale data and failed requests with no network
        run: node --test scripts/test-apd-radar-live-candidate.mjs
      - name: Preserve legacy radar and production Worker
        run: git diff --exit-code origin/main -- radar_provincia_patch_semaforo.js worker-live/worker_hotfix.js
      - name: If index changed, verify exact version-only release and rollback
        run: |
          if git diff --name-only origin/main -- index.html | grep -Fxq 'index.html'; then
            node --test scripts/test-apd-radar-live-release.mjs
          fi
