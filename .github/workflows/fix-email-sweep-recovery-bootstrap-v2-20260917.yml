name: Fix email sweep recovery bootstrap v2 2026-09-17

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-email-sweep-recovery-bootstrap-v2-20260917.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: ancient-wildflower-cd37
      EXPECTED_ACTIVE_VERSION: a6eade87-0174-4490-9798-56af3d98095a
    steps:
      - name: Patch, test, upload and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p tmp
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts?per_page=50" > tmp/accounts.json
          ACCOUNT_ID=$(node -e "const j=require('./tmp/accounts.json');if(!j.success||!j.result?.length)process.exit(2);process.stdout.write(j.result[0].id)")
          DEPLOYMENTS_URL="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$DEPLOYMENTS_URL" > tmp/deployments.json
          ACTIVE=$(node -e "const j=require('./tmp/deployments.json');const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];process.stdout.write(v?.version_id||'')")
          echo "active=${ACTIVE}"
          test "$ACTIVE" = "$EXPECTED_ACTIVE_VERSION"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${ACTIVE}?include=modules" > tmp/active.json

          node <<'NODE'
          const fs=require('fs');
          const j=require('./tmp/active.json'); const r=j.result;
          if(!j.success||!r?.id) throw new Error('active detail missing');
          if((r.bindings||[]).length!==27) throw new Error(`binding drift ${(r.bindings||[]).length}`);
          const main=(r.modules||[]).find(m=>m.name==='worker_hotfix.js');
          let s=Buffer.from(main?.content_base64||'','base64').toString('utf8');
          if(!s.includes('const DEFAULT_BATCH_SIZE = 2;')) throw new Error('batch=2 missing');
          if(s.includes('CRON EMAIL SLOT RECOVERY START')) throw new Error('bootstrap already present');

          const helper=`function getMostRecentArgentinaDigestSlotInfo(input = Date.now()) {
            const current = getArgentinaDigestSlotInfo(input);
            let year = Number(current.year || 0);
            let month = Number(current.month || 0);
            let day = Number(current.day || 0);
            const hour = Number(current.hour || 0);
            let slotHour = 22;
            if (hour >= 22) slotHour = 22;
            else if (hour >= 18) slotHour = 18;
            else if (hour >= 14) slotHour = 14;
            else {
              const previous = new Date(Date.UTC(year, month - 1, day - 1, 12, 0, 0));
              year = previous.getUTCFullYear();
              month = previous.getUTCMonth() + 1;
              day = previous.getUTCDate();
              slotHour = 22;
            }
            const yyyy = String(year).padStart(4, "0");
            const mm = String(month).padStart(2, "0");
            const dd = String(day).padStart(2, "0");
            return { year: yyyy, month: mm, day: dd, slot_hour: slotHour, slot_key: `${yyyy}-${mm}-${dd}_${String(slotHour).padStart(2, "0")}` };
          }
          `;
          const helperMarker='function getArgentinaDigestSlotInfo(input = Date.now()) {';
          if((s.split(helperMarker).length-1)!==1) throw new Error('helper marker drift');
          s=s.replace(helperMarker,helper+helperMarker);

          const re=/\n\s*if \(!activeSlotKey\) \{\s*return;\s*\}\s*const activeFinishedKey = `email:slot:\$\{activeSlotKey\}:finished`;/;
          const m=s.match(re);
          if(!m) throw new Error('scheduled inactive-slot block not found');
          const replacement=`
            if (!activeSlotKey) {
              const recoverySlot = getMostRecentArgentinaDigestSlotInfo(event?.scheduledTime || Date.now());
              if (recoverySlot?.slot_key) {
                const recoveryFinishedKey = `email:slot:${recoverySlot.slot_key}:finished`;
                const recoveryFinished = await kv.get(recoveryFinishedKey).catch(() => null);
                if (!recoveryFinished) {
                  activeSlotKey = recoverySlot.slot_key;
                  await kv.put(ACTIVE_SLOT_KEY, activeSlotKey, { expirationTtl: 60 * 60 * 36 }).catch(() => null);
                  await kv.put(`email:slot:${activeSlotKey}:started_at`, (/* @__PURE__ */ new Date()).toISOString(), { expirationTtl: 60 * 60 * 36 }).catch(() => null);
                  console.log("CRON EMAIL SLOT RECOVERY START", activeSlotKey);
                }
              }
              if (!activeSlotKey) return;
            }
            const activeFinishedKey = `email:slot:${activeSlotKey}:finished`;`;
          s=s.replace(re,replacement);
          fs.writeFileSync('tmp/worker_hotfix.js',s);
          fs.writeFileSync('tmp/helper.js',helper);
          fs.writeFileSync('tmp/binding-shape.json',JSON.stringify((r.bindings||[]).map(b=>`${b.name}:${b.type}`).sort()));
          const metadata={main_module:r.main_module,compatibility_date:r.compatibility_date,annotations:{'workers/message':'APDocentePBA: bootstrap latest missed email slot','workers/tag':'email-sweep-recovery-bootstrap-v2-20260917'},bindings:(r.bindings||[]).map(b=>({name:b.name,type:'inherit',version_id:'latest'}))};
          if(Array.isArray(r.compatibility_flags)&&r.compatibility_flags.length) metadata.compatibility_flags=r.compatibility_flags;
          fs.writeFileSync('tmp/metadata.json',JSON.stringify(metadata));
          NODE

          node --check tmp/worker_hotfix.js
          node <<'NODE'
          const fs=require('fs'); const vm=require('vm'); const assert=require('assert');
          const helper=fs.readFileSync('tmp/helper.js','utf8');
          const cases={m:{year:'2026',month:'09',day:'17',hour:9},a:{year:'2026',month:'09',day:'17',hour:14},e:{year:'2026',month:'09',day:'17',hour:18},n:{year:'2026',month:'09',day:'17',hour:22}};
          const ctx={getArgentinaDigestSlotInfo:x=>cases[x],Date}; vm.createContext(ctx); vm.runInContext(helper,ctx);
          assert.equal(ctx.getMostRecentArgentinaDigestSlotInfo('m').slot_key,'2026-09-16_22');
          assert.equal(ctx.getMostRecentArgentinaDigestSlotInfo('a').slot_key,'2026-09-17_14');
          assert.equal(ctx.getMostRecentArgentinaDigestSlotInfo('e').slot_key,'2026-09-17_18');
          assert.equal(ctx.getMostRecentArgentinaDigestSlotInfo('n').slot_key,'2026-09-17_22');
          const code=fs.readFileSync('tmp/worker_hotfix.js','utf8');
          for(const marker of ['CRON EMAIL SLOT RECOVERY START','getMostRecentArgentinaDigestSlotInfo','const DEFAULT_BATCH_SIZE = 2;','reserved_before_brevo_send']) assert(code.includes(marker),`missing ${marker}`);
          console.log('GREEN tests passed');
          NODE

          code=$(curl -sS -o tmp/upload.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/versions?bindings_inherit=strict" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F "metadata=<tmp/metadata.json;type=application/json" \
            -F "worker_hotfix.js=@tmp/worker_hotfix.js;filename=worker_hotfix.js;type=application/javascript+module")
          echo "upload_http=${code}"
          CANDIDATE=$(node -e "const j=require('./tmp/upload.json');if(!j.success||!j.result?.id){console.error(JSON.stringify(j.errors||j));process.exit(1)};process.stdout.write(j.result.id)")
          echo "candidate=${CANDIDATE}"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${CANDIDATE}?include=modules" > tmp/candidate.json
          node <<'NODE'
          const fs=require('fs'); const expected=require('./tmp/binding-shape.json'); const r=require('./tmp/candidate.json').result;
          const actual=(r.bindings||[]).map(b=>`${b.name}:${b.type}`).sort();
          if(JSON.stringify(expected)!==JSON.stringify(actual)) throw new Error('binding shape changed');
          const main=(r.modules||[]).find(m=>m.name==='worker_hotfix.js'); const code=Buffer.from(main?.content_base64||'','base64').toString('utf8');
          if(!code.includes('CRON EMAIL SLOT RECOVERY START')) throw new Error('candidate bootstrap missing');
          console.log(`verified candidate=${r.id} bindings=${actual.length}`);
          NODE

          printf '{"strategy":"percentage","versions":[{"version_id":"%s","percentage":100}],"annotations":{"workers/message":"Bootstrap latest missed email slot"}}' "$CANDIDATE" > tmp/deploy.json
          code=$(curl -sS -o tmp/deploy-response.json -w "%{http_code}" -X POST "$DEPLOYMENTS_URL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data @tmp/deploy.json)
          echo "deploy_http=${code}"
          test "$code" = "200"
          sleep 3
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$DEPLOYMENTS_URL" > tmp/final.json
          FINAL=$(node -e "const j=require('./tmp/final.json');const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];process.stdout.write(v?.version_id||'')")
          echo "final=${FINAL}"
          test "$FINAL" = "$CANDIDATE"
