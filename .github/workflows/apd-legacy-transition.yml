name: APD legacy transition courtesy (offline only)
on:
  pull_request:
    paths:
      - 'docs/sql/APD_LEGACY_CATALOG_HIDE_CANDIDATE_20261127.sql'
      - 'docs/sql/APD_LEGACY_CATALOG_EMERGENCY_REVERT_20261127.sql'
      - 'docs/sql/APD_LEGACY_TRANSITION_CANDIDATE_20261127.sql'
      - 'tests/sql/apd_legacy_transition_pg17.sql'
      - 'scripts/apd-commercial-access-core.mjs'
      - 'scripts/test-apd-commercial-access.mjs'
      - '.github/workflows/apd-legacy-transition.yml'
  push:
    branches: ['fix/apd-legacy-complete-transition-20261127']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-apd-commercial-access.mjs
      - name: Disposable PostgreSQL only
        env:
          PGPASSWORD: fixture-only
        run: psql -h localhost -U postgres -d fixture -X -v ON_ERROR_STOP=1 -f tests/sql/apd_legacy_transition_pg17.sql
