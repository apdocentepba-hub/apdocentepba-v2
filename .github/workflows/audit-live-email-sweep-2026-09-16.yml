name: Audit active email sweep final return

on:
  push:
    branches:
      - audit/live-offer-identity-2026-09-15
    paths:
      - .github/workflows/audit-live-email-sweep-2026-09-16.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: ancient-wildflower-cd37
    steps:
      - uses: actions/checkout@v4
      - name: Read final sweep return from active bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p tmp/live-email-audit
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=50" > tmp/live-email-audit/accounts.json
          ACCOUNT_ID=$(node -e "const j=require('./tmp/live-email-audit/accounts.json');process.stdout.write(j.result[0].id)")
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" > tmp/live-email-audit/deployments.json
          ACTIVE=$(node -e "const j=require('./tmp/live-email-audit/deployments.json');const d=j.result.deployments[0];const v=d.versions.find(x=>Number(x.percentage)===100)||d.versions[0];process.stdout.write(v.version_id)")
          echo "ACTIVE_VERSION=${ACTIVE}"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${ACTIVE}?include=modules" > tmp/live-email-audit/active.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const j=JSON.parse(fs.readFileSync('tmp/live-email-audit/active.json','utf8'));
          const mod=(j.result.modules||[]).find(m=>m.name==='worker_hotfix.js');
          if(!mod) throw new Error('worker_hotfix.js missing');
          const src=Buffer.from(mod.content_base64||'','base64').toString('utf8');
          fs.writeFileSync('tmp/live-email-audit/worker_hotfix.js',src);
          const start=src.indexOf('async function runEmailAlertsSweep(');
          const marker=src.indexOf('__name(runEmailAlertsSweep,',start);
          if(start<0||marker<0) throw new Error('sweep markers missing');
          const block=src.slice(start,marker);
          const lines=block.split('\n');
          console.log(lines.slice(Math.max(0,lines.length-260)).join('\n'));
          NODE
