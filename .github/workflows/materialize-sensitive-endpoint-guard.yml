name: Materialize sensitive endpoint guard

on:
  push:
    branches:
      - fix/protect-sensitive-test-endpoints-2026-09-16
    paths:
      - .github/workflows/materialize-sensitive-endpoint-guard.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/protect-sensitive-test-endpoints-2026-09-16
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add fail-closed ADMIN_TEST_SECRET gate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          worker_path = Path('worker-live/worker_hotfix.js')
          manifest_path = Path('worker-live/manifest.json')
          text = worker_path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              assert count == 1, f'{label}: expected one occurrence, found {count}'
              text = text.replace(old, new, 1)

          replace_once(
              'var SENSITIVE_TEST_PATHS = new Set(["/test-mail", "/test-email-sweep", "/test-digest", "/api/provincia/backfill-kick"]);',
              'var SENSITIVE_TEST_PATHS = new Set(["/test-mail", "/test-email-sweep", "/test-digest", "/api/test-db", "/api/whatsapp/test-send", "/api/debug-lomas-pr", "/api/provincia/backfill-kick"]);',
              'sensitive test path set'
          )

          marker = 'async function requireSecureAdmin(env, request) {'
          helper = '''function requireAdminTestSecret(env, request) {
            const configured = String(env.ADMIN_TEST_SECRET || "").trim();
            if (!configured) {
              return adminJson({ ok: false, error: "Test endpoints disabled" }, 503);
            }
            const provided = String(request.headers.get("X-Admin-Test-Secret") || "").trim();
            if (!provided || provided !== configured) {
              return adminJson({ ok: false, error: "No autorizado" }, 401);
            }
            return null;
          }
          __name(requireAdminTestSecret, "requireAdminTestSecret");
          '''
          assert text.count(marker) == 1, f'requireSecureAdmin marker count={text.count(marker)}'
          text = text.replace(marker, helper + marker, 1)

          replace_once(
              '    if (SENSITIVE_TEST_PATHS.has(path)) {\n      const denied = await requireSecureAdmin(env, request);\n      if (denied) return denied;\n    }',
              '    if (SENSITIVE_TEST_PATHS.has(path)) {\n      const denied = requireAdminTestSecret(env, request);\n      if (denied) return denied;\n    }',
              'sensitive route gate'
          )

          worker_path.write_text(text)
          manifest = json.loads(manifest_path.read_text())
          entry = next((m for m in manifest.get('modules', []) if m.get('name') == 'worker_hotfix.js'), None)
          assert entry is not None, 'worker_hotfix.js missing from manifest'
          entry['module_sha256'] = hashlib.sha256(text.encode()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          print(entry['module_sha256'])
          PY
          node --check worker-live/worker_hotfix.js
          node scripts/test-sensitive-test-endpoints.mjs
          node scripts/test-account-security-contract.mjs
          node scripts/test-live-email-cron-isolation.mjs worker-live/worker_hotfix.js
          node scripts/test-live-email-observability.mjs worker-live/worker_hotfix.js
          node scripts/test-live-manual-email-dedupe.mjs worker-live/worker_hotfix.js
          node scripts/test-live-offer-identity-bundle.mjs worker-live/worker_hotfix.js
      - name: Commit endpoint guard and remove materializer
        run: |
          set -euo pipefail
          git config user.name 'apdocentepba-hub'
          git config user.email 'apdocentepba@gmail.com'
          git rm .github/workflows/materialize-sensitive-endpoint-guard.yml
          git add worker-live/worker_hotfix.js worker-live/manifest.json
          git diff --cached --check
          git commit -m 'Protect sensitive test endpoints with admin secret'
          git push origin HEAD:fix/protect-sensitive-test-endpoints-2026-09-16
