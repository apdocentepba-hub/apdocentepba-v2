name: APD comparador de ofertas candidate

on:
  pull_request:
    paths:
      - 'scripts/apd-comparador-criterios.mjs'
      - 'scripts/test-apd-comparador-criterios.mjs'
      - '.github/workflows/apd-comparador-criterios.yml'

permissions:
  contents: read

jobs:
  comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax and deterministic local comparisons only
        run: |
          node --check scripts/apd-comparador-criterios.mjs
          node --check scripts/test-apd-comparador-criterios.mjs
          node --test scripts/test-apd-comparador-criterios.mjs
