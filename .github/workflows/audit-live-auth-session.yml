name: Audit live auth session gate

on:
  push:
    branches:
      - audit/live-auth-worker-2026-09-15
    paths:
      - .github/workflows/audit-live-auth-session.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-live-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect active Worker without changing traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_NAME: ancient-wildflower-cd37
        run: |
          set -euo pipefail
          mkdir -p tmp/live-auth

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=50" > tmp/live-auth/accounts.json
          ACCOUNT_ID=$(node -e "const j=require('./tmp/live-auth/accounts.json');if(!j.success||!j.result?.length)process.exit(2);process.stdout.write(j.result[0].id)")

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" > tmp/live-auth/deployments.json
          ACTIVE_VERSION_ID=$(node -e "const j=require('./tmp/live-auth/deployments.json');const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];if(!v?.version_id)process.exit(3);process.stdout.write(v.version_id)")

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${ACTIVE_VERSION_ID}?include=modules" > tmp/live-auth/active.json

          ACTIVE_VERSION_ID="${ACTIVE_VERSION_ID}" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const j = JSON.parse(fs.readFileSync('tmp/live-auth/active.json','utf8'));
          const r = j.result;
          if (!j.success || !r?.id) throw new Error('Active Worker version detail missing');
          const modules = Array.isArray(r.modules) ? r.modules : [];
          const target = modules.find(m => m.name === 'worker_hotfix.js');
          if (!target?.content_base64) throw new Error('worker_hotfix.js module missing from active version');
          const source = Buffer.from(target.content_base64, 'base64').toString('utf8');
          fs.writeFileSync('tmp/live-auth/worker_hotfix.live.js', source);
          const sha256 = crypto.createHash('sha256').update(source).digest('hex');
          const gateStart = source.indexOf('if (REWRITE_GET_PATHS.has(path) || REWRITE_POST_PATHS.has(path)) {');
          const gateEnd = source.indexOf('return await originalWorker.fetch(request, env, ctx);', gateStart);
          const gate = gateStart >= 0 && gateEnd > gateStart ? source.slice(gateStart, gateEnd) : '';
          const resolverStart = source.indexOf('async function resolveAuthUser(env, request) {');
          const resolverEnd = source.indexOf('async function rewriteRequestWithUserId', resolverStart);
          const resolver = resolverStart >= 0 && resolverEnd > resolverStart ? source.slice(resolverStart, resolverEnd) : '';
          const needles = ['/mis-alertas', 'Usuario no encontrado', 'No autenticado', 'Authorization', 'Bearer ', 'user_id'];
          const snippets = {};
          for (const needle of needles) {
            const positions = [];
            let from = 0;
            while (positions.length < 4) {
              const i = source.indexOf(needle, from);
              if (i < 0) break;
              positions.push({ index: i, snippet: source.slice(Math.max(0, i - 350), Math.min(source.length, i + needle.length + 650)) });
              from = i + needle.length;
            }
            snippets[needle] = positions;
          }
          const summary = {
            ok: true,
            active_version_id: process.env.ACTIVE_VERSION_ID,
            main_module: r.main_module,
            module_names: modules.map(m => m.name).sort(),
            binding_shape: (r.bindings || []).map(b => `${b.name}:${b.type}`).sort(),
            worker_hotfix_sha256: sha256,
            worker_hotfix_bytes: Buffer.byteLength(source),
            protected_gate_found: Boolean(gate),
            optional_bearer_gate_present: /if \(bearer\)/.test(gate),
            legacy_uuid_bearer_fallback_present: /legacyUser|legacy_user_id|getUserById\(env, bearer\)/.test(resolver),
            session_resolver_present: /resolveAuthUser\(env, request\)/.test(gate),
            needle_counts: Object.fromEntries(Object.entries(snippets).map(([k,v]) => [k, v.length]))
          };
          fs.writeFileSync('tmp/live-auth/summary.json', JSON.stringify(summary, null, 2));
          fs.writeFileSync('tmp/live-auth/snippets.json', JSON.stringify(snippets, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          console.log('--- AUTH SOURCE SNIPPETS ---');
          for (const [needle, rows] of Object.entries(snippets)) {
            console.log(`\n### ${needle}`);
            for (const row of rows) console.log(row.snippet.replace(/\s+/g, ' ').slice(0, 1100));
          }
          NODE

      - name: Probe current public unauthenticated behavior
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o tmp/live-auth/public-response.json -w "%{http_code}" \
            "https://ancient-wildflower-cd37.apdocentepba.workers.dev/api/mis-alertas?user_id=00000000-0000-4000-8000-000000000000")
          echo "public_unauth_status=${CODE}"
          cat tmp/live-auth/public-response.json

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-auth-session-audit
          path: tmp/live-auth/
          if-no-files-found: error
