name: Test email cron stale slot
on:
  push:
    branches:
      - fix/email-cron-stale-slot-20260916
  pull_request:
    paths:
      - worker-live/worker_hotfix.js
      - scripts/test-email-cron-stale-slot.mjs
      - .github/workflows/test-email-cron-stale-slot.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/test-email-cron-stale-slot.mjs
