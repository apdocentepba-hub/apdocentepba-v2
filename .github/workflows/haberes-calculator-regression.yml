name: Haberes calculator regression

on:
  pull_request:
    paths:
      - assets/js/calculadora-haberes-pba.js
      - haberes-docentes.html
      - scripts/test-haberes-calculator-active.mjs
      - .github/workflows/haberes-calculator-regression.yml
  push:
    branches: [main]
    paths:
      - assets/js/calculadora-haberes-pba.js
      - haberes-docentes.html
      - scripts/test-haberes-calculator-active.mjs
      - .github/workflows/haberes-calculator-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify active haberes calculator contract
        run: node scripts/test-haberes-calculator-active.mjs
