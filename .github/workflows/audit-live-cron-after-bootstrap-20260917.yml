name: Audit live cron after bootstrap 2026-09-17

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-live-cron-after-bootstrap-20260917.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: ancient-wildflower-cd37
    steps:
      - name: Audit active deployment and schedules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p tmp
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts?per_page=50" > tmp/accounts.json
          ACCOUNT_ID=$(node -e "const j=require('./tmp/accounts.json');process.stdout.write(j.result[0].id)")
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" > tmp/deployments.json
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/schedules" > tmp/schedules.json
          ACTIVE=$(node -e "const j=require('./tmp/deployments.json');const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];process.stdout.write(v?.version_id||'')")
          echo "active=${ACTIVE}"
          node -e "const j=require('./tmp/schedules.json'); console.log('schedules='+JSON.stringify(j.result?.schedules||j.result||[]))"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${ACTIVE}?include=modules" > tmp/version.json
          node <<'NODE'
          const j=require('./tmp/version.json'); const r=j.result;
          const main=(r.modules||[]).find(m=>m.name==='worker_hotfix.js');
          const code=Buffer.from(main?.content_base64||'','base64').toString('utf8');
          console.log('scheduled_handler='+code.includes('async scheduled(event, env, ctx)'));
          console.log('recovery_bootstrap='+code.includes('CRON EMAIL SLOT RECOVERY START'));
          console.log('batch2='+code.includes('const DEFAULT_BATCH_SIZE = 2;'));
          console.log('bindings='+(r.bindings||[]).length);
          NODE
