name: Growth landing and Instagram routing regression

on:
  pull_request:
    paths:
      - 'empezar.html'
      - 'instagram_entry_patch.js'
      - 'index.html'
      - 'scripts/test-growth-landing.mjs'
      - 'scripts/test-growth-activation.mjs'
      - 'scripts/test-growth-registration.mjs'
      - 'scripts/test-growth-preferences-roundtrip.mjs'
      - 'scripts/test-growth-worker-preferences.mjs'
      - 'scripts/test-growth-plan-parity.mjs'
      - 'scripts/test-growth-plan-fallback.mjs'
      - 'insigne_rules_lab.js'
      - 'scripts/previews/insigne-laboratorio.html'
      - 'scripts/test-insigne-rules-lab.mjs'
      - 'scripts/test-growth-browser.mjs'
      - 'scripts/build-growth-preview.mjs'
      - 'scripts/test-growth-preview.mjs'
      - 'app_v2.js'
      - 'worker-live/worker_hotfix.js'
      - 'growth_activation_guide.js'
      - '.github/workflows/growth-landing-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landing-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate landing and campaign entry routing
        run: node --test scripts/test-growth-landing.mjs scripts/test-growth-activation.mjs scripts/test-growth-registration.mjs scripts/test-growth-preferences-roundtrip.mjs scripts/test-growth-worker-preferences.mjs scripts/test-growth-plan-parity.mjs scripts/test-growth-plan-fallback.mjs scripts/test-insigne-rules-lab.mjs
      - name: Verificar construcción aislada sin backend ni contraseñas
        run: node --test scripts/test-growth-preview.mjs
      - name: Smoke en navegador Chrome real (sin backend)
        run: node scripts/test-growth-browser.mjs
      - name: Adjuntar informe de paridad de planes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd-growth-plan-parity
          path: tmp/growth-audit/plan-parity.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Adjuntar capturas de revisión visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd-growth-landing-browser
          path: tmp/growth-browser/*.png
          if-no-files-found: ignore
          retention-days: 7
