name: Apply canonical offer identity fix

on:
  push:
    branches:
      - fix/canonical-offer-identity-2026-09-15
    paths:
      - 'scripts/apply-canonical-offer-identity-fix.mjs'
      - 'scripts/test-offer-identity-regression.mjs'
      - '.github/workflows/apply-canonical-offer-identity-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-offer-identity-2026-09-15
      - name: Apply deterministic patch
        run: node scripts/apply-canonical-offer-identity-fix.mjs
      - name: Verify regression locally
        run: node scripts/test-offer-identity-regression.mjs
      - name: Commit worker change
        run: |
          set -euo pipefail
          git config user.name 'apdocentepba-hub'
          git config user.email 'apdocentepba@gmail.com'
          git add worker.js
          git diff --cached --quiet && exit 0
          git commit -m 'Canonicalize APD offer identity in worker sync'
          git push origin HEAD:fix/canonical-offer-identity-2026-09-15
