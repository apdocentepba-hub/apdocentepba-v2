name: APD observatorio provincial SAD/ABC — pilot (no deploy)
on:
  pull_request:
    paths:
      - 'data/apd-provincial-official-sources.json'
      - 'scripts/apd-provincial-intelligence-core.mjs'
      - 'scripts/apd-provincial-monitor.mjs'
      - 'scripts/test-apd-provincial-intelligence-core.mjs'
      - 'scripts/test-apd-provincial-monitor.mjs'
      - 'docs/APD_OBSERVATORIO_PROVINCIAL_20261114.md'
      - '.github/workflows/apd-observatorio-provincial-pilot.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Only OFFLINE (network not enabled in this pilot)'
        required: true
        default: 'offline'
        type: choice
        options:
          - offline
permissions:
  contents: read
jobs:
  pilot-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax of provincial intelligence and scanner
        run: |
          node --check scripts/apd-provincial-intelligence-core.mjs
          node --check scripts/apd-provincial-monitor.mjs
          node --check scripts/test-apd-provincial-intelligence-core.mjs
          node --check scripts/test-apd-provincial-monitor.mjs
      - name: Deterministic safety and source-diff regression tests (no external network)
        run: node --test scripts/test-apd-provincial-intelligence-core.mjs scripts/test-apd-provincial-monitor.mjs
      - name: Produce offline sample (never crawls ABC automatically in a PR)
        run: node scripts/apd-provincial-monitor.mjs --offline --out tmp/apd-provincial-pilot.json
      - name: Protect the production app and backend
        run: |
          git diff --exit-code HEAD^ HEAD -- worker-live worker.js app_v2.js index.html supabase sql auth_session_patch.js || true
