name: Force email slot recovery once 2026-09-17

on:
  push:
    paths:
      - '.github/workflows/force-email-slot-recovery-once-20260917.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: ancient-wildflower-cd37
      EXPECTED_ACTIVE_VERSION: 19484163-d044-4e7e-a321-cc84bbf3ffb6
      RECOVERY_SLOT: 2026-09-16_22
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: RED, patch, GREEN, deploy one-shot recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts?per_page=50" > tmp/accounts.json
          ACCOUNT_ID=$(jq -r '.result[0].id' tmp/accounts.json)
          DEPLOYMENTS_URL="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$DEPLOYMENTS_URL" > tmp/deployments.json
          ACTIVE=$(node -e "const j=require('./tmp/deployments.json');const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];process.stdout.write(v?.version_id||'')")
          echo "active=${ACTIVE}"
          test "$ACTIVE" = "$EXPECTED_ACTIVE_VERSION"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${ACTIVE}?include=modules" > tmp/active.json

          node - <<'NODE'
          const fs=require('fs');
          const j=require('./tmp/active.json'); const r=j.result;
          if(!j.success||!r?.id) throw new Error('active detail missing');
          const main=(r.modules||[]).find(m=>m.name==='worker_hotfix.js');
          const s=Buffer.from(main?.content_base64||'','base64').toString('utf8');
          fs.writeFileSync('tmp/worker-before.js',s);
          fs.writeFileSync('tmp/binding-shape.json',JSON.stringify((r.bindings||[]).map(b=>`${b.name}:${b.type}`).sort()));
          const metadata={main_module:r.main_module,compatibility_date:r.compatibility_date,annotations:{'workers/message':'APDocentePBA: one-shot recover 2026-09-16_22','workers/tag':'email-recovery-once-20260917'},bindings:(r.bindings||[]).map(b=>({name:b.name,type:'inherit',version_id:'latest'}))};
          if(Array.isArray(r.compatibility_flags)&&r.compatibility_flags.length) metadata.compatibility_flags=r.compatibility_flags;
          fs.writeFileSync('tmp/metadata.json',JSON.stringify(metadata));
          NODE

          # RED: live code currently trusts the stale finished flag and has no one-shot override.
          if node -e "const s=require('fs').readFileSync('tmp/worker-before.js','utf8'); if(!s.includes('EMAIL RECOVERY FORCE ONCE')) process.exit(1)"; then
            echo 'RED test unexpectedly passed'; exit 1
          else
            echo 'RED confirmed: live code lacks one-shot recovery override'
          fi

          node - <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('tmp/worker-before.js','utf8');
          const old=[
            '    if (!activeSlotKey) {',
            '      const recoverySlot = getMostRecentArgentinaDigestSlotInfo(event?.scheduledTime || Date.now());',
            '      if (recoverySlot?.slot_key) {',
            '        const recoveryFinishedKey = "email:slot:" + recoverySlot.slot_key + ":finished";',
            '        const recoveryFinished = await kv.get(recoveryFinishedKey).catch(() => null);',
            '        if (!recoveryFinished) {',
            '          activeSlotKey = recoverySlot.slot_key;',
            '          await kv.put(ACTIVE_SLOT_KEY, activeSlotKey, { expirationTtl: 60 * 60 * 36 }).catch(() => null);',
            '          await kv.put("email:slot:" + activeSlotKey + ":started_at", (/* @__PURE__ */ new Date()).toISOString(), { expirationTtl: 60 * 60 * 36 }).catch(() => null);',
            '          console.log("CRON EMAIL SLOT RECOVERY START", activeSlotKey);',
            '        }',
            '      }',
            '      if (!activeSlotKey) return;',
            '    }'
          ].join('\n');
          const replacement=[
            '    if (!activeSlotKey) {',
            '      const recoverySlot = getMostRecentArgentinaDigestSlotInfo(event?.scheduledTime || Date.now());',
            '      if (recoverySlot?.slot_key) {',
            '        const recoveryFinishedKey = "email:slot:" + recoverySlot.slot_key + ":finished";',
            '        const recoveryFinished = await kv.get(recoveryFinishedKey).catch(() => null);',
            '        const recoveryForceKey = "email:slot:" + recoverySlot.slot_key + ":recovery_force_once_v1";',
            '        const recoveryForced = await kv.get(recoveryForceKey).catch(() => null);',
            '        const forceRecoveryOnce = recoverySlot.slot_key === "2026-09-16_22" && !recoveryForced;',
            '        if (!recoveryFinished || forceRecoveryOnce) {',
            '          if (forceRecoveryOnce) {',
            '            await kv.put(recoveryForceKey, (/* @__PURE__ */ new Date()).toISOString(), { expirationTtl: 60 * 60 * 48 });',
            '            console.log("EMAIL RECOVERY FORCE ONCE", recoverySlot.slot_key);',
            '          }',
            '          activeSlotKey = recoverySlot.slot_key;',
            '          await kv.put(ACTIVE_SLOT_KEY, activeSlotKey, { expirationTtl: 60 * 60 * 36 }).catch(() => null);',
            '          await kv.put("email:slot:" + activeSlotKey + ":started_at", (/* @__PURE__ */ new Date()).toISOString(), { expirationTtl: 60 * 60 * 36 }).catch(() => null);',
            '          console.log("CRON EMAIL SLOT RECOVERY START", activeSlotKey);',
            '        }',
            '      }',
            '      if (!activeSlotKey) return;',
            '    }'
          ].join('\n');
          const count=s.split(old).length-1;
          if(count!==1) throw new Error(`recovery block drift count=${count}`);
          s=s.replace(old,replacement);
          fs.writeFileSync('tmp/worker_hotfix.js',s);
          NODE

          node --check tmp/worker_hotfix.js
          node - <<'NODE'
          const fs=require('fs'); const assert=require('assert');
          const s=fs.readFileSync('tmp/worker_hotfix.js','utf8');
          for(const marker of [
            'EMAIL RECOVERY FORCE ONCE',
            'recovery_force_once_v1',
            'recoverySlot.slot_key === "2026-09-16_22" && !recoveryForced',
            'if (!recoveryFinished || forceRecoveryOnce)',
            'const DEFAULT_BATCH_SIZE = 2;',
            'reserved_before_brevo_send',
            'cursor_user_id'
          ]) assert(s.includes(marker),`missing ${marker}`);
          assert.equal((s.match(/EMAIL RECOVERY FORCE ONCE/g)||[]).length,1);
          console.log('GREEN one-shot recovery contract passed');
          NODE

          CODE=$(curl -sS -o tmp/upload.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/versions?bindings_inherit=strict" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F "metadata=<tmp/metadata.json;type=application/json" \
            -F "worker_hotfix.js=@tmp/worker_hotfix.js;filename=worker_hotfix.js;type=application/javascript+module")
          echo "upload_http=${CODE}"
          test "$CODE" = "200"
          CANDIDATE=$(jq -r '.result.id' tmp/upload.json)
          test -n "$CANDIDATE" -a "$CANDIDATE" != "null"
          echo "candidate=${CANDIDATE}"

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${CANDIDATE}?include=modules" > tmp/candidate.json
          node - <<'NODE'
          const expected=require('./tmp/binding-shape.json'); const r=require('./tmp/candidate.json').result;
          const actual=(r.bindings||[]).map(b=>`${b.name}:${b.type}`).sort();
          if(JSON.stringify(expected)!==JSON.stringify(actual)) throw new Error('binding shape changed');
          const m=(r.modules||[]).find(x=>x.name==='worker_hotfix.js'); const s=Buffer.from(m?.content_base64||'','base64').toString('utf8');
          if(!s.includes('EMAIL RECOVERY FORCE ONCE')) throw new Error('candidate recovery marker missing');
          console.log(`candidate verified ${r.id}; bindings=${actual.length}`);
          NODE

          rollback() {
            echo 'ROLLBACK'
            printf '{"strategy":"percentage","versions":[{"version_id":"%s","percentage":100}]}' "$ACTIVE" > tmp/rollback.json
            curl -sS -X POST "$DEPLOYMENTS_URL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data @tmp/rollback.json >/dev/null || true
          }
          trap rollback ERR
          printf '{"strategy":"percentage","versions":[{"version_id":"%s","percentage":100}],"annotations":{"workers/message":"One-shot recover 2026-09-16_22"}}' "$CANDIDATE" > tmp/deploy.json
          CODE=$(curl -sS -o tmp/deploy-response.json -w "%{http_code}" -X POST "$DEPLOYMENTS_URL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data @tmp/deploy.json)
          echo "deploy_http=${CODE}"
          test "$CODE" = "200"
          sleep 3
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$DEPLOYMENTS_URL" > tmp/final.json
          FINAL=$(node -e "const j=require('./tmp/final.json');const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];process.stdout.write(v?.version_id||'')")
          echo "final=${FINAL}"
          test "$FINAL" = "$CANDIDATE"
          trap - ERR
          echo "ONE_SHOT_RECOVERY_DEPLOYED=${FINAL}"
