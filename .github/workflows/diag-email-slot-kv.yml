name: Diagnose email cron slot KV
on:
  push:
    branches:
      - ops/promote-login-pbkdf2-fix-20260916
    paths:
      - .github/workflows/diag-email-slot-kv.yml
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: ancient-wildflower-cd37
      KV_NAMESPACE_ID: 1f2f957e8fb44b76a09a53d63979633c
    steps:
      - name: Read Cloudflare cron and KV state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts?per_page=50" > accounts.json
          ACCOUNT_ID=$(node -e "const j=require('./accounts.json');const a=Array.isArray(j.result)?j.result:[];if(!j.success||a.length!==1)process.exit(2);process.stdout.write(a[0].id)")
          echo "== schedules =="
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/schedules" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(JSON.stringify({success:j.success,result:j.result},null,2))})"
          echo "== deployments =="
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const d=j.result?.deployments?.[0]||{};console.log(JSON.stringify({success:j.success,id:d.id,created_on:d.created_on,versions:d.versions},null,2))})"
          readkv() {
            key="$1"
            code=$(curl -sS -o kv.txt -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/storage/kv/namespaces/${KV_NAMESPACE_ID}/values/$(node -p "encodeURIComponent(process.argv[1])" "$key")")
            val=$(cat kv.txt)
            echo "KV ${key} HTTP=${code} VALUE=${val}"
          }
          readkv 'email:active_slot_key'
          readkv 'email:slot:2026-09-16_14:started_at'
          readkv 'email:slot:2026-09-16_14:finished'
          readkv 'email:slot:2026-09-16_18:started_at'
          readkv 'email:slot:2026-09-16_18:finished'
          readkv 'email:slot:2026-09-16_22:started_at'
          readkv 'email:slot:2026-09-16_22:finished'
          readkv 'cursor'
