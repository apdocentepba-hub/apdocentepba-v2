name: Audit email sweep KV state 2026-09-17

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-email-kv-state-20260917.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: ancient-wildflower-cd37
    steps:
      - name: Read active Worker KV bindings and email state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p tmp
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=50" > tmp/accounts.json
          ACCOUNT_ID=$(node -e "const j=require('./tmp/accounts.json');process.stdout.write(j.result[0].id)")
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" > tmp/deployments.json
          ACTIVE=$(node -e "const j=require('./tmp/deployments.json');const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];process.stdout.write(v?.version_id||'')")
          echo "active=${ACTIVE}"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${ACTIVE}?include=modules" > tmp/version.json

          node <<'NODE'
          const fs=require('fs');
          const j=require('./tmp/version.json'); const r=j.result||{};
          const kv=(r.bindings||[]).filter(b=>String(b.type||'').includes('kv')).map(b=>({name:b.name,type:b.type,namespace_id:b.namespace_id||b.namespaceId||b.id||null}));
          console.log('kv_bindings='+JSON.stringify(kv));
          fs.writeFileSync('tmp/kv.json',JSON.stringify(kv));
          const main=(r.modules||[]).find(m=>m.name==='worker_hotfix.js');
          const code=Buffer.from(main?.content_base64||'','base64').toString('utf8');
          const idx=code.indexOf('function getChannelStateStore');
          if(idx>=0) console.log('source_excerpt='+code.slice(idx, idx+1000).replace(/\n/g,' '));
          NODE

          node -e "for(const x of require('./tmp/kv.json')) if(x.namespace_id) console.log([x.name,x.namespace_id].join('\t'))" > tmp/kv.tsv
          while IFS=$'\t' read -r name ns; do
            [ -z "$ns" ] && continue
            echo "--- kv ${name} ${ns} ---"
            code=$(curl -sS -o tmp/value.txt -w "%{http_code}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/storage/kv/namespaces/${ns}/values/email%3Aactive_slot_key" || true)
            echo "active_slot_http=${code} value=$(cat tmp/value.txt 2>/dev/null || true)"
            code=$(curl -sS -o tmp/keys.json -w "%{http_code}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/storage/kv/namespaces/${ns}/keys?prefix=email%3A&limit=1000" || true)
            echo "keys_http=${code}"
            if [ "$code" = "200" ]; then node -e "const j=require('./tmp/keys.json');console.log((j.result||[]).map(x=>x.name).join('\n'))"; else cat tmp/keys.json; fi
          done < tmp/kv.tsv
