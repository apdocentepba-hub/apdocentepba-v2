name: Materialize Mercado Pago status fix

on:
  push:
    branches:
      - fix/mercadopago-status-contract-2026-09-16
    paths:
      - .github/workflows/materialize-mercadopago-status-fix.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mercadopago-status-contract-2026-09-16
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Make Mercado Pago cancellation and expiry explicit
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          worker_path = Path('worker-live/worker_hotfix.js')
          manifest_path = Path('worker-live/manifest.json')
          text = worker_path.read_text()

          old_sub = '  if (key === "REFUNDED" || key === "CHARGED_BACK" || key === "CANCELLED" || key === "REJECTED") return "CANCELLED";\n  return key || "PENDING";'
          new_sub = '  if (key === "REFUNDED" || key === "CHARGED_BACK" || key === "CANCELLED" || key === "REJECTED") return "CANCELLED";\n  if (key === "EXPIRED") return "EXPIRED";\n  return key || "PENDING";'
          assert text.count(old_sub) == 1, f'subscription mapping occurrence count={text.count(old_sub)}'
          text = text.replace(old_sub, new_sub, 1)

          old_checkout = '  if (key === "REJECTED" || key === "CANCELLED") return "rejected";\n  if (key === "REFUNDED" || key === "CHARGED_BACK") return "refunded";\n  return key.toLowerCase() || "pending";'
          new_checkout = '  if (key === "REJECTED") return "rejected";\n  if (key === "CANCELLED") return "cancelled";\n  if (key === "EXPIRED") return "expired";\n  if (key === "REFUNDED" || key === "CHARGED_BACK") return "refunded";\n  return key.toLowerCase() || "pending";'
          assert text.count(old_checkout) == 1, f'checkout mapping occurrence count={text.count(old_checkout)}'
          text = text.replace(old_checkout, new_checkout, 1)

          worker_path.write_text(text)
          manifest = json.loads(manifest_path.read_text())
          entry = next((m for m in manifest.get('modules', []) if m.get('name') == 'worker_hotfix.js'), None)
          assert entry is not None, 'worker_hotfix.js missing from manifest'
          entry['module_sha256'] = hashlib.sha256(text.encode()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          print(entry['module_sha256'])
          PY
          node --check worker-live/worker_hotfix.js
          node scripts/test-mercadopago-status-mapping.mjs
          node scripts/test-account-security-contract.mjs
          node scripts/test-sensitive-test-endpoints.mjs
          node scripts/test-live-email-cron-isolation.mjs worker-live/worker_hotfix.js
          node scripts/test-live-email-observability.mjs worker-live/worker_hotfix.js
          node scripts/test-live-manual-email-dedupe.mjs worker-live/worker_hotfix.js
          node scripts/test-live-offer-identity-bundle.mjs worker-live/worker_hotfix.js
      - name: Commit lifecycle fix and remove materializer
        run: |
          set -euo pipefail
          git config user.name 'apdocentepba-hub'
          git config user.email 'apdocentepba@gmail.com'
          git rm .github/workflows/materialize-mercadopago-status-fix.yml
          git add worker-live/worker_hotfix.js worker-live/manifest.json
          git diff --cached --check
          git commit -m 'Fix Mercado Pago cancellation and expiry mapping'
          git push origin HEAD:fix/mercadopago-status-contract-2026-09-16
