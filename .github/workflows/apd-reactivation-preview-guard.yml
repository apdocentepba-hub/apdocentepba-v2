name: APDocente reactivation preview guard (no send)

on:
  pull_request:
    paths:
      - 'docs/sql/APD_REACTIVACION_PREVIEW_SOLO_LECTURA.sql'
      - 'docs/APD_REACTIVACION_SEGMENTOS_20261022.md'
      - 'docs/APD_REACTIVACION_EMAIL_BORRADOR_20261022.md'
      - 'scripts/test-reactivation-preview-guard.mjs'
      - '.github/workflows/apd-reactivation-preview-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-no-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preview does not send or mutate production
        run: node --test scripts/test-reactivation-preview-guard.mjs
