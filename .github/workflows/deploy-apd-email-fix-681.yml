name: Deploy APD email PID parity 685

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-apd-email-fix-681.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Promote candidate 685 with automatic rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_NAME: ancient-wildflower-cd37
          CANDIDATE_VERSION_ID: 539432f5-9013-4cc3-9202-1dd6bbd483f9
          EXPECTED_OLD_VERSION_ID: a3b3dad2-a50b-4dd2-b7fc-a61560b89df7
          TARGET_USER_ID: 3a300893-a552-43c2-9189-071ab4a23198
          EXPECTED_OFFER_ID: "4294581"
          WORKER_URL: https://ancient-wildflower-cd37.apdocentepba.workers.dev
          SITE_URL: https://alertasapd.com.ar
        run: |
          set -euo pipefail
          mkdir -p out

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=50" > out/accounts.json
          ACCOUNT_ID=$(node -e "const j=require('./out/accounts.json');if(!j.success||!j.result?.length)process.exit(2);process.stdout.write(j.result[0].id)")

          rollback() {
            echo "Post-deploy verification failed; rolling back to #683"
            cat > out/rollback.json <<JSON
          {"strategy":"percentage","versions":[{"version_id":"${EXPECTED_OLD_VERSION_ID}","percentage":100}],"annotations":{"workers/message":"Automatic rollback after APD email PID parity smoke failure"}}
          JSON
            curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data @out/rollback.json > out/rollback-response.json || true
          }

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" > out/before.json
          ACTIVE_BEFORE=$(node -e "const j=require('./out/before.json');const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];if(!v?.version_id)process.exit(3);process.stdout.write(v.version_id)")
          echo "Active before: ${ACTIVE_BEFORE}"
          test "${ACTIVE_BEFORE}" = "${EXPECTED_OLD_VERSION_ID}"

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${CANDIDATE_VERSION_ID}?include=modules" > out/candidate.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('out/candidate.json','utf8'));
          const r=j.result;
          if(!j.success||!r?.id) throw new Error('Candidate version unavailable');
          if(r.id!==process.env.CANDIDATE_VERSION_ID) throw new Error('Candidate ID mismatch');
          const bindings=(r.bindings||[]).map(x=>`${x.name}:${x.type}`).sort();
          if(bindings.length!==27) throw new Error(`Unexpected candidate bindings: ${bindings.length}`);
          const mods=Object.fromEntries((r.modules||[]).map(m=>[m.name,Buffer.from(m.content_base64||'','base64').toString('utf8')]));
          for(const required of ['worker_hotfix.js','worker_email_queue_hotfix.js','email_queue_hotfix.js']) if(!(required in mods)) throw new Error(`Missing module ${required}`);
          if(r.main_module!=='worker_hotfix.js') throw new Error(`Unexpected main module: ${r.main_module}`);
          const main=mods['worker_hotfix.js'];
          for(const forbidden of [
            'first_emailed_at=is.null',
            'if (item.first_emailed_at) return false;',
            'item.offer_id = item.offer_id || item.source_offer_key || "";'
          ]) if(main.includes(forbidden)) throw new Error(`Candidate contains forbidden marker: ${forbidden}`);
          for(const marker of [
            'const pidData = await obtenerUltimaPidGuardada(userId).catch(() => null);',
            'const pidRows = normalizePidRows(pidData);',
            'const districtIndex = buildDistrictIndex(shared.catalogos);',
            'buildAlertItem(oferta, evaluacion, pidInfo)',
            'item.offer_id = String(item.idoferta || item.offer_id || item.source_offer_key || "").trim();',
            'state_offer_id: String(item?.offer_id || p.offer_id || "").trim()',
            'pid_compatible: !!p.pid_compatible',
            'pid_puntaje_total_base: p.pid_puntaje_total_base',
            'pid_listado: p.pid_listado || ""',
            '&is_active=eq.true&select=id,offer_id,offer_payload,last_seen_at,first_emailed_at,last_emailed_at',
            '`email:slot:${slotKey}:user:${userId}:sent`',
            'DATOS DE LA OFERTA',
            'SUPLENCIA',
            'Resumen APD compatible con tus preferencias'
          ]) if(!main.includes(marker)) throw new Error(`Candidate missing marker: ${marker}`);
          console.log(`Candidate #${r.number}: PID-parity contract OK; bindings=${bindings.length}`);
          NODE

          cat > out/deploy.json <<JSON
          {"strategy":"percentage","versions":[{"version_id":"${CANDIDATE_VERSION_ID}","percentage":100}],"annotations":{"workers/message":"APDocentePBA: email refresh reuses web PID evaluation and canonical ABC offer identity"}}
          JSON

          trap rollback ERR

          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @out/deploy.json > out/deploy-response.json
          node - <<'NODE'
          const j=require('./out/deploy-response.json');
          if(!j.success||!j.result?.id) throw new Error(JSON.stringify(j.errors||[]));
          console.log(`Deployment accepted: ${j.result.id}`);
          NODE

          deployment_visible=0
          for attempt in 1 2 3 4 5 6; do
            sleep 3
            curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" > out/after.json
            ACTIVE_AFTER=$(node -e "const j=require('./out/after.json');const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];process.stdout.write(v?.version_id||'')")
            echo "Deployment visibility ${attempt}/6: ${ACTIVE_AFTER}"
            if [ "${ACTIVE_AFTER}" = "${CANDIDATE_VERSION_ID}" ]; then
              deployment_visible=1
              break
            fi
          done
          test "$deployment_visible" = "1"

          VERSION_CODE=$(curl -sS -o out/version.json -w "%{http_code}" "${WORKER_URL}/api/version")
          test "${VERSION_CODE}" = "200"
          node -e "const j=require('./out/version.json');if(j.ok!==true)throw new Error('api/version not ok');console.log('api/version OK')"

          pid_ok=0
          for attempt in 1 2 3 4; do
            echo "Targeted PID parity smoke ${attempt}/4"
            if [ "$attempt" -gt 1 ]; then sleep 8; else sleep 12; fi
            DRY_CODE=$(curl -sS -o out/dry-run.json -w "%{http_code}" \
              "${WORKER_URL}/test-email-sweep?dry_run=1&debug=1&limit=1&target_user_id=${TARGET_USER_ID}")
            test "${DRY_CODE}" = "200"
            if node - <<'NODE'
          const j=require('./out/dry-run.json');
          if(j.ok!==true||j.dry_run!==true) process.exit(2);
          if(Number(j.failed_count||0)!==0) process.exit(3);
          const rows=Array.isArray(j.debug_users)?j.debug_users:[];
          const eligible=rows.find(x=>String(x.user_id||'')===process.env.TARGET_USER_ID && x.stage==='dry_run');
          if(!eligible || Number(eligible.total_alerts||0)<1 || Number(eligible.shown_alerts||0)<1) process.exit(4);
          if(eligible.pid_visible!==true) process.exit(5);
          const samples=Array.isArray(eligible.enriched_samples)?eligible.enriched_samples:[];
          const sample=samples.find(x=>String(x.state_offer_id||'')===process.env.EXPECTED_OFFER_ID);
          console.log(JSON.stringify({subject:eligible.subject,pid_visible:eligible.pid_visible,sample:sample||null}));
          if(!sample) process.exit(6);
          if(String(sample.idoferta||'')!==process.env.EXPECTED_OFFER_ID) process.exit(7);
          if(sample.pid_compatible!==true) process.exit(8);
          if(String(sample.pid_area||'').trim()!=='/PR') process.exit(9);
          if(String(sample.pid_bloque||'').trim()!=='SECUNDARIA (E)') process.exit(10);
          const base=Number(sample.pid_puntaje_total_base);
          const final=Number(sample.pid_puntaje_total_final);
          if(!Number.isFinite(base)||Math.abs(base-38.10)>0.001) process.exit(11);
          if(!Number.isFinite(final)||Math.abs(final-38.10)>0.001) process.exit(12);
          if(String(sample.pid_listado||'').trim().toLowerCase()!=='oficial') process.exit(13);
          if(String(sample.pid_anio||'').trim()!=='2026') process.exit(14);
          NODE
            then
              pid_ok=1
              break
            fi
          done
          test "$pid_ok" = "1"

          SITE_CODE=$(curl -L -sS -o /dev/null -w "%{http_code}" "${SITE_URL}/")
          echo "Public site HTTP: ${SITE_CODE}"
          test "${SITE_CODE}" = "200"

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" > out/final.json
          ACTIVE_FINAL=$(node -e "const j=require('./out/final.json');const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];if(!v?.version_id)process.exit(5);process.stdout.write(v.version_id)")
          test "${ACTIVE_FINAL}" = "${CANDIDATE_VERSION_ID}"

          trap - ERR
          node - <<'NODE'
          const fs=require('fs');
          const dry=JSON.parse(fs.readFileSync('out/dry-run.json','utf8'));
          const eligible=(dry.debug_users||[]).find(x=>String(x.user_id||'')===process.env.TARGET_USER_ID && x.stage==='dry_run');
          const sample=(eligible?.enriched_samples||[]).find(x=>String(x.state_offer_id||'')===process.env.EXPECTED_OFFER_ID)||null;
          const summary={
            deployed:true,
            candidate_version_id:process.env.CANDIDATE_VERSION_ID,
            old_version_id:process.env.EXPECTED_OLD_VERSION_ID,
            active_final:process.env.CANDIDATE_VERSION_ID,
            target_total_alerts:Number(eligible?.total_alerts||0),
            target_shown_alerts:Number(eligible?.shown_alerts||0),
            pid_visible:eligible?.pid_visible===true,
            pid_sample:sample,
            pid_parity_verified:true,
            worker_version_endpoint_ok:true,
            public_site_ok:true,
            rollback_triggered:false
          };
          fs.writeFileSync('out/summary.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          NODE

      - name: Upload deployment verification summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd-email-pid-parity-685-deploy-verification
          path: |
            out/summary.json
            out/rollback-response.json
          if-no-files-found: ignore
