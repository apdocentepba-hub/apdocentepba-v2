name: Materialize duplicate plan_code cleanup

on:
  push:
    branches:
      - fix/remove-duplicate-plan-code-2026-09-16
    paths:
      - .github/workflows/materialize-plan-code-cleanup.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-duplicate-plan-code-2026-09-16
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remove only the duplicate plan_code key and refresh canonical hash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');

          const workerPath = 'worker-live/worker_hotfix.js';
          const manifestPath = 'worker-live/manifest.json';
          const worker = fs.readFileSync(workerPath, 'utf8');
          const duplicateBlock = `      plan_code: entitlement?.plan_code || null,\n      channel_mode: "query_only",\n            enriched_postulantes: true,\n      enriched_limit: Math.min(safeLimit, 30),\n      plan_code: entitlement?.plan_code || null,\n`;
          const replacement = `      plan_code: entitlement?.plan_code || null,\n      channel_mode: "query_only",\n            enriched_postulantes: true,\n      enriched_limit: Math.min(safeLimit, 30),\n`;

          const occurrences = worker.split(duplicateBlock).length - 1;
          if (occurrences !== 1) {
            throw new Error(`Expected exactly one known duplicate plan_code block; found ${occurrences}`);
          }
          const nextWorker = worker.replace(duplicateBlock, replacement);
          const keyLine = '      plan_code: entitlement?.plan_code || null,';
          const remainingKeyLines = nextWorker.split(keyLine).length - 1;
          if (remainingKeyLines < 1) {
            throw new Error('Cleanup unexpectedly removed every plan_code field');
          }
          fs.writeFileSync(workerPath, nextWorker);

          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const entry = (manifest.modules || []).find(module => module.name === 'worker_hotfix.js');
          if (!entry) throw new Error('worker_hotfix.js hash entry missing from manifest');
          entry.module_sha256 = crypto.createHash('sha256').update(Buffer.from(nextWorker)).digest('hex');
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(`Updated worker_hotfix.js SHA-256: ${entry.module_sha256}`);
          NODE

          node --check worker-live/worker_hotfix.js
          node scripts/test-live-email-cron-isolation.mjs worker-live/worker_hotfix.js
          node scripts/test-live-email-observability.mjs worker-live/worker_hotfix.js
          node scripts/test-live-manual-email-dedupe.mjs worker-live/worker_hotfix.js
          node scripts/test-live-offer-identity-bundle.mjs worker-live/worker_hotfix.js
          node scripts/test-live-source-equivalence.mjs

      - name: Prove duplicate warning source is gone
        run: |
          set -euo pipefail
          COUNT=$(grep -nF 'plan_code: entitlement?.plan_code || null,' worker-live/worker_hotfix.js | wc -l | tr -d ' ')
          echo "Matching plan_code lines remaining: ${COUNT}"
          test "$COUNT" -ge 1
          ! awk 'NR>=12908 && NR<=12920 {print}' worker-live/worker_hotfix.js | grep -F -A4 'plan_code: entitlement?.plan_code || null,' | grep -F 'plan_code: entitlement?.plan_code || null,' | tail -n +2 | grep -q .

      - name: Remove one-time materializer and commit candidate source
        run: |
          set -euo pipefail
          git config user.name 'apdocentepba-hub'
          git config user.email 'apdocentepba@gmail.com'
          git rm .github/workflows/materialize-plan-code-cleanup.yml
          git add worker-live/worker_hotfix.js worker-live/manifest.json
          git diff --cached --check
          git commit -m 'Remove duplicate plan_code from canonical Worker'
          git push origin HEAD:fix/remove-duplicate-plan-code-2026-09-16
