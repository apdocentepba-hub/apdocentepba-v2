name: APD favorites live preflight - read only
on:
  pull_request:
    paths:
      - '.github/workflows/apd-account-favorites-live-preflight.yml'
      - 'scripts/inspect-account-favorites-live.mjs'
      - 'scripts/build-account-favorites-worker-candidate.mjs'
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/account-favorites-contract-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read live source without modifying traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/inspect-account-favorites-live.mjs
      - name: Prove insertion and synthetic integration on exact live source
        run: |
          APD_ACCOUNT_FAVORITES_LIVE_SOURCE=tmp/apd-account-favorites/active-worker.mjs node scripts/build-account-favorites-worker-candidate.mjs
          node --check tmp/apd-account-favorites/worker-favorites-candidate.mjs
          node scripts/test-apd-account-favorites-full-worker.mjs
      - name: Remove transient source
        if: always()
        run: rm -rf tmp/apd-account-favorites
