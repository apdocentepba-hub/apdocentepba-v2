name: Cleanup incident workflows 2026-09-18

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-incident-workflows-20260918.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary incident workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "apdocentepba-hub"
          git config user.email "apdocentepba@gmail.com"
          rm -f .github/workflows/*20260917.yml
          rm -f .github/workflows/sync-live-worker-source-20260918.yml
          rm -f .github/workflows/cleanup-incident-workflows-20260918.yml
          git add -A .github/workflows
          echo "Files staged for cleanup:"
          git diff --cached --name-status
          git commit -m "chore: remove incident diagnostic workflows"
          git push origin HEAD:main
