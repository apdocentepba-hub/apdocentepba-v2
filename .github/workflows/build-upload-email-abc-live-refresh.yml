name: Build and upload APD email fix candidate

on:
  push:
    branches:
      - fix/email-abc-live-refresh-20260909
    paths:
      - scripts/apply-email-abc-live-refresh.py
      - scripts/test-email-abc-live-refresh.py
      - .github/workflows/build-upload-email-abc-live-refresh.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild candidate from exact active Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_NAME: ancient-wildflower-cd37
        run: |
          set -euo pipefail
          mkdir -p tmp/modules tmp/candidate

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=50" > tmp/accounts.json
          ACCOUNT_ID=$(node -e "const j=require('./tmp/accounts.json');if(!j.success||!j.result?.length)process.exit(2);process.stdout.write(j.result[0].id)")
          echo "ACCOUNT_ID=${ACCOUNT_ID}" >> "$GITHUB_ENV"

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" > tmp/deployments-before.json
          ACTIVE_VERSION_ID=$(node -e "const j=require('./tmp/deployments-before.json');const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];if(!v?.version_id)process.exit(3);process.stdout.write(v.version_id)")
          echo "ACTIVE_VERSION_ID=${ACTIVE_VERSION_ID}" >> "$GITHUB_ENV"

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${ACTIVE_VERSION_ID}?include=modules" > tmp/active.json

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const envelope=JSON.parse(fs.readFileSync('tmp/active.json','utf8'));
          if(!envelope.success || !envelope.result?.id) throw new Error('active version unavailable');
          const active=envelope.result;
          const shape=(active.bindings||[]).map(b=>`${b.name}:${b.type}`).sort();
          for(const m of active.modules||[]) fs.writeFileSync(path.join('tmp/modules',m.name),Buffer.from(m.content_base64||'','base64'));
          for(const name of ['worker_hotfix.js','email_queue_hotfix.js','worker_email_queue_hotfix.js']) if(!fs.existsSync(`tmp/modules/${name}`)) throw new Error(`${name} missing`);
          const metadata={
            main_module:active.main_module,
            compatibility_date:active.compatibility_date,
            annotations:{'workers/message':'APDocentePBA active offers per slot candidate','workers/tag':'email-active-per-slot-20260911'},
            bindings:(active.bindings||[]).map(b=>({name:b.name,type:'inherit',version_id:'latest'}))
          };
          if(Array.isArray(active.compatibility_flags)&&active.compatibility_flags.length) metadata.compatibility_flags=active.compatibility_flags;
          fs.writeFileSync('tmp/candidate/metadata.json',JSON.stringify(metadata));
          fs.writeFileSync('tmp/binding-check.json',JSON.stringify({active_version:{id:active.id,number:active.number},binding_count:shape.length},null,2));
          console.log(`Active source safety OK: #${active.number}; bindings=${shape.length}; modules=${(active.modules||[]).length}`);
          NODE

          python scripts/apply-email-abc-live-refresh.py tmp/modules/worker_hotfix.js tmp/candidate/worker_hotfix.js
          python scripts/test-email-abc-live-refresh.py tmp/candidate/worker_hotfix.js
          node --check tmp/candidate/worker_hotfix.js
          cp tmp/modules/email_queue_hotfix.js tmp/candidate/
          cp tmp/modules/worker_email_queue_hotfix.js tmp/candidate/

      - name: Live ABC Publicada smoke
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const API='https://servicios3.abc.gob.ar/valoracion.docente/api/apd.oferta.encabezado/select';
          const districts=['AVELLANEDA','GENERAL SAN MARTIN','NECOCHEA','PARTIDO DE LA COSTA'];
          const result=[];
          for(const district of districts){
            const u=new URL(API); u.searchParams.set('q',`descdistrito:"${district}" AND estado:"Publicada"`); u.searchParams.set('rows','1'); u.searchParams.set('wt','json');
            const r=await fetch(u); if(!r.ok) throw new Error(`${district} HTTP ${r.status}`);
            const j=JSON.parse(new TextDecoder('latin1').decode(await r.arrayBuffer())||'{}');
            result.push({district,numFound:Number(j?.response?.numFound??-1)});
          }
          if(result.some(x=>x.numFound<0)) throw new Error('ABC response invalid');
          console.log(result);
          NODE

      - name: Upload candidate version without deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_NAME: ancient-wildflower-cd37
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o tmp/upload-response.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/versions?bindings_inherit=strict" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F "metadata=<tmp/candidate/metadata.json;type=application/json" \
            -F "worker_hotfix.js=@tmp/candidate/worker_hotfix.js;filename=worker_hotfix.js;type=application/javascript+module" \
            -F "email_queue_hotfix.js=@tmp/candidate/email_queue_hotfix.js;filename=email_queue_hotfix.js;type=application/javascript+module" \
            -F "worker_email_queue_hotfix.js=@tmp/candidate/worker_email_queue_hotfix.js;filename=worker_email_queue_hotfix.js;type=application/javascript+module")
          echo "Cloudflare HTTP ${HTTP_CODE}"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const j=JSON.parse(fs.readFileSync('tmp/upload-response.json','utf8'));
          if(!j.success || !j.result?.id) throw new Error(JSON.stringify(j.errors||j));
          fs.writeFileSync('tmp/upload-summary.partial.json',JSON.stringify({candidate_version_id:j.result.id,candidate_number:j.result.number||null},null,2));
          console.log(JSON.stringify({id:j.result.id,number:j.result.number},null,2));
          NODE

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" > tmp/deployments-after.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const before=JSON.parse(fs.readFileSync('tmp/deployments-before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('tmp/deployments-after.json','utf8'));
          const partial=JSON.parse(fs.readFileSync('tmp/upload-summary.partial.json','utf8'));
          const deployed=(j)=>{const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];return v?.version_id||null};
          const beforeId=deployed(before), afterId=deployed(after);
          if(!beforeId || beforeId!==afterId) throw new Error(`Production changed unexpectedly: ${beforeId} -> ${afterId}`);
          fs.writeFileSync('tmp/upload-summary.json',JSON.stringify({...partial,active_version_id:beforeId,deployed:false,traffic_changed:false,binding_safety:JSON.parse(fs.readFileSync('tmp/binding-check.json','utf8'))},null,2));
          console.log(fs.readFileSync('tmp/upload-summary.json','utf8'));
          NODE

      - name: Upload safe summary
        uses: actions/upload-artifact@v4
        with:
          name: apd-email-fix-candidate-validation
          path: tmp/upload-summary.json
          if-no-files-found: error
