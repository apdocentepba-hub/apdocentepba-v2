name: Finalize bounded email sweep 2026-09-17

on:
  push:
    paths:
      - '.github/workflows/finalize-bounded-email-sweep-20260917.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: ancient-wildflower-cd37
      EXPECTED_ACTIVE_VERSION: 99ab2d80-cb13-4fb9-92a2-d7c0fb360344
      CONTINUATION_CRON: 1-59/2 * * * *
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: RED patch GREEN deploy and replace recovery cron
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts?per_page=50" > tmp/accounts.json
          ACCOUNT_ID=$(jq -r '.result[0].id' tmp/accounts.json)
          DEPLOYMENTS_URL="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments"
          SCHEDULES_URL="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/schedules"

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$DEPLOYMENTS_URL" > tmp/before-deployments.json
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$SCHEDULES_URL" > tmp/before-schedules.json
          ACTIVE=$(node -e "const j=require('./tmp/before-deployments.json');const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];process.stdout.write(v?.version_id||'')")
          echo "active_before=${ACTIVE}"
          test "$ACTIVE" = "$EXPECTED_ACTIVE_VERSION"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${ACTIVE}?include=modules" > tmp/active.json

          node - <<'NODE'
          const fs=require('fs'); const r=require('./tmp/active.json').result;
          if(!r?.id) throw new Error('active version missing');
          const m=(r.modules||[]).find(x=>x.name==='worker_hotfix.js');
          let s=Buffer.from(m?.content_base64||'','base64').toString('utf8');
          fs.writeFileSync('tmp/before.js',s);
          fs.writeFileSync('tmp/binding-shape.json',JSON.stringify((r.bindings||[]).map(b=>`${b.name}:${b.type}`).sort()));
          const md={main_module:r.main_module,compatibility_date:r.compatibility_date,annotations:{'workers/message':'APDocentePBA: bounded email sweep with continuation cron','workers/tag':'bounded-email-sweep-final-20260917'},bindings:(r.bindings||[]).map(b=>({name:b.name,type:'inherit',version_id:'latest'}))};
          if(Array.isArray(r.compatibility_flags)&&r.compatibility_flags.length) md.compatibility_flags=r.compatibility_flags;
          fs.writeFileSync('tmp/metadata.json',JSON.stringify(md));
          NODE

          # RED: current live code still lets env override batch=2 and lacks a continuation-only no-slot guard.
          if node - <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync('tmp/before.js','utf8');
          const good=s.includes('const isContinuationCron = String(event?.cron || "").trim() === "1-59/2 * * * *";') &&
                     s.includes('if (isContinuationCron && !activeSlotKey) return;') &&
                     /max_users:\s*2\s*[,}]/.test(s);
          process.exit(good?0:1);
          NODE
          then echo 'RED unexpectedly passed'; exit 1; else echo 'RED confirmed: live code is not yet permanently bounded'; fi

          node - <<'NODE'
          const fs=require('fs'); let s=fs.readFileSync('tmp/before.js','utf8');
          const activeLine='    let activeSlotKey = String(await kv.get(ACTIVE_SLOT_KEY).catch(() => "") || "").trim();';
          if((s.split(activeLine).length-1)!==1) throw new Error('activeSlotKey marker drift');
          s=s.replace(activeLine, activeLine+'\n    const isContinuationCron = String(event?.cron || "").trim() === "1-59/2 * * * *";\n    if (isContinuationCron && !activeSlotKey) return;');

          const envMax='max_users: env.EMAIL_DIGEST_BATCH_USERS_PER_RUN || env.EMAIL_DIGEST_MAX_USERS_PER_RUN || 2';
          const envCount=s.split(envMax).length-1;
          if(envCount!==1) throw new Error(`scheduled max_users marker drift count=${envCount}`);
          s=s.replace(envMax,'max_users: 2');

          fs.writeFileSync('tmp/worker_hotfix.js',s);
          NODE

          node --check tmp/worker_hotfix.js
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert'); const s=fs.readFileSync('tmp/worker_hotfix.js','utf8');
          assert(s.includes('const isContinuationCron = String(event?.cron || "").trim() === "1-59/2 * * * *";'));
          assert(s.includes('if (isContinuationCron && !activeSlotKey) return;'));
          assert(/max_users:\s*2\s*[,}]/.test(s));
          assert(!s.includes('max_users: env.EMAIL_DIGEST_BATCH_USERS_PER_RUN || env.EMAIL_DIGEST_MAX_USERS_PER_RUN || 2'));
          assert(s.includes('const DEFAULT_BATCH_SIZE = 2;'));
          assert(s.includes('cursor_user_id'));
          assert(s.includes('reserved_before_brevo_send'));
          console.log('GREEN bounded continuation contract passed');
          NODE

          CODE=$(curl -sS -o tmp/upload.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/versions?bindings_inherit=strict" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F "metadata=<tmp/metadata.json;type=application/json" \
            -F "worker_hotfix.js=@tmp/worker_hotfix.js;filename=worker_hotfix.js;type=application/javascript+module")
          echo "upload_http=${CODE}"
          test "$CODE" = "200"
          CANDIDATE=$(jq -r '.result.id' tmp/upload.json)
          test -n "$CANDIDATE" -a "$CANDIDATE" != "null"
          echo "candidate=${CANDIDATE}"

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${CANDIDATE}?include=modules" > tmp/candidate.json
          node - <<'NODE'
          const expected=require('./tmp/binding-shape.json'); const r=require('./tmp/candidate.json').result;
          const actual=(r.bindings||[]).map(b=>`${b.name}:${b.type}`).sort();
          if(JSON.stringify(expected)!==JSON.stringify(actual)) throw new Error('binding shape changed');
          const m=(r.modules||[]).find(x=>x.name==='worker_hotfix.js'); const s=Buffer.from(m?.content_base64||'','base64').toString('utf8');
          if(!s.includes('if (isContinuationCron && !activeSlotKey) return;')) throw new Error('continuation guard missing');
          if(!/max_users:\s*2\s*[,}]/.test(s)) throw new Error('max_users not fixed to 2');
          console.log(`candidate verified=${r.id}; bindings=${actual.length}`);
          NODE

          rollback() {
            echo ROLLBACK
            printf '{"strategy":"percentage","versions":[{"version_id":"%s","percentage":100}]}' "$ACTIVE" > tmp/rollback-deploy.json
            curl -sS -X POST "$DEPLOYMENTS_URL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data @tmp/rollback-deploy.json >/dev/null || true
            node -e "const j=require('./tmp/before-schedules.json');process.stdout.write(JSON.stringify((j.result?.schedules||j.result||[]).map(x=>({cron:x.cron}))))" > tmp/rollback-schedules.json || true
            curl -sS -X PUT "$SCHEDULES_URL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data @tmp/rollback-schedules.json >/dev/null || true
          }
          trap rollback ERR

          printf '{"strategy":"percentage","versions":[{"version_id":"%s","percentage":100}],"annotations":{"workers/message":"Bound email sweep to 2 users and add continuation guard"}}' "$CANDIDATE" > tmp/deploy.json
          CODE=$(curl -sS -o tmp/deploy-response.json -w "%{http_code}" -X POST "$DEPLOYMENTS_URL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data @tmp/deploy.json)
          echo "deploy_http=${CODE}"
          test "$CODE" = "200"
          sleep 3
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$DEPLOYMENTS_URL" > tmp/probe.json
          FINAL=$(node -e "const j=require('./tmp/probe.json');const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];process.stdout.write(v?.version_id||'')")
          echo "active_after_deploy=${FINAL}"
          test "$FINAL" = "$CANDIDATE"

          node - <<'NODE'
          const fs=require('fs'); const j=require('./tmp/before-schedules.json');
          const existing=(j.result?.schedules||j.result||[]).map(x=>x.cron).filter(Boolean);
          const base=existing.filter(x=>x!=='* * 17 9 *' && x!=='1-59/2 * * * *');
          const wanted=[...new Set([...base,'1-59/2 * * * *'])];
          const required=['0 01 * * *','0 17 * * *','0 21 * * *','1-59/2 * * * *'];
          for(const x of required) if(!wanted.includes(x)) throw new Error(`missing wanted schedule ${x}`);
          if(wanted.length!==4) throw new Error(`unexpected wanted schedule count ${wanted.length}: ${wanted.join(' | ')}`);
          fs.writeFileSync('tmp/schedules.json',JSON.stringify(wanted.map(cron=>({cron}))));
          console.log('wanted_schedules='+wanted.join(' | '));
          NODE
          CODE=$(curl -sS -o tmp/schedules-response.json -w "%{http_code}" -X PUT "$SCHEDULES_URL" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data @tmp/schedules.json)
          echo "schedules_http=${CODE}"
          if [ "$CODE" != "200" ]; then cat tmp/schedules-response.json; exit 1; fi
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$SCHEDULES_URL" > tmp/schedules-final.json
          node - <<'NODE'
          const j=require('./tmp/schedules-final.json'); const got=(j.result?.schedules||j.result||[]).map(x=>x.cron).sort();
          const expected=['0 01 * * *','0 17 * * *','0 21 * * *','1-59/2 * * * *'].sort();
          if(JSON.stringify(got)!==JSON.stringify(expected)) throw new Error(`schedule mismatch ${got.join(' | ')}`);
          console.log('verified_schedules='+got.join(' | '));
          NODE
          trap - ERR
          echo "FINAL_BOUNDED_SWEEP_OK version=${FINAL}"
