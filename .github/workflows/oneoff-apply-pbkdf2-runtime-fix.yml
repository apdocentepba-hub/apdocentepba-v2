name: One-off apply PBKDF2 runtime fix

on:
  push:
    branches:
      - fix/login-pbkdf2-runtime-limit-20260916
    paths:
      - scripts/apply-pbkdf2-runtime-fix.mjs
      - .github/workflows/oneoff-apply-pbkdf2-runtime-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/login-pbkdf2-runtime-limit-20260916
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact canonical Worker patch
        run: node scripts/apply-pbkdf2-runtime-fix.mjs
      - name: Verify regression contract locally
        run: node scripts/test-account-security-contract.mjs
      - name: Commit patched Worker and remove one-off tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-pbkdf2-runtime-fix.mjs .github/workflows/oneoff-apply-pbkdf2-runtime-fix.yml
          git add worker-live/worker_hotfix.js scripts/test-account-security-contract.mjs
          git commit -m "Fix PBKDF2 runtime limit in canonical Worker"
          git push origin HEAD:fix/login-pbkdf2-runtime-limit-20260916
