name: APD application diary private storage candidate
on:
  pull_request:
    paths:
      - 'docs/sql/APD_APPLICATION_DIARY*'
      - 'scripts/*account-diary*'
      - 'apd_comparador_panel.mjs'
      - 'index.html'
      - 'scripts/test-apd-comparador-browser.mjs'
      - 'scripts/*application-diary*'
      - 'tests/sql/*application_diary*'
      - '.github/workflows/apd-application-diary-storage-candidate.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PostgreSQL ACL, malformed inputs and concurrent CAS
        env:
          PGPASSWORD: fixture-only
        run: |
          psql -h localhost -U postgres -d fixture -v ON_ERROR_STOP=1 -f tests/sql/apd_account_schedule_pg17.sql
          psql -h localhost -U postgres -d fixture -v ON_ERROR_STOP=1 -f tests/sql/apd_account_favorites_default_acl.sql
          psql -h localhost -U postgres -d fixture -v ON_ERROR_STOP=1 -f docs/sql/APD_APPLICATION_DIARY_CANDIDATE.sql
          psql -h localhost -U postgres -d fixture -v ON_ERROR_STOP=1 -f tests/sql/apd_application_diary_assert.sql
          bash tests/sql/test_apd_application_diary_race.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-apd-application-diary.mjs scripts/test-apd-account-diary-client.mjs
      - run: |
          node scripts/build-account-diary-worker-candidate.mjs
          node --check tmp/apd-account-diary/worker-diary-candidate.mjs
          node scripts/test-apd-account-diary-full-worker.mjs
      - run: node scripts/test-apd-comparador-browser.mjs
