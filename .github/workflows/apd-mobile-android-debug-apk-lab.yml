name: APD Android debug APK lab (no production deploy)
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/apd-mobile-android-debug-apk-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37 for Expo SDK 58
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - name: Install isolated demo dependencies
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npm ci --no-audit --no-fund
      - name: Prohibit production endpoints, credentials and push in this binary
        run: |
          node --test mobile/src/*.test.cjs
          node --test scripts/test-mobile-push-candidate-contract.mjs
      - name: Generate disposable native Android project from Expo
        working-directory: mobile
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          npx expo prebuild --platform android --no-install --non-interactive
          test -f android/gradlew
      - name: Build native debug APK locally on GitHub runner
        working-directory: mobile/android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Publish LAB debug APK as workflow artifact (not Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: APDocentePBA-Android-LAB-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
      - name: Ensure production files remain untouched
        run: |
          git diff --exit-code -- index.html app_v2.js worker.js auth_session_patch.js
