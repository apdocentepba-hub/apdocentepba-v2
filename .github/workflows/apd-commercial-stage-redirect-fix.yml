name: APD stage verified native redirect correction (zero traffic)
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/apd-commercial-stage-redirect-fix.yml'
permissions:
  contents: read
concurrency:
  group: apd-native-redirect-stage
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'apdocentepba-hub/apdocentepba-v2' && github.event.pull_request.number == 343 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/scoped-checkout-pilot-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund miniflare@4.20260515.0
      - run: node --check scripts/apd-commercial-native-redirect-fix.mjs && node --check scripts/apd-commercial-stage-redirect-fix.mjs
      - run: node --experimental-vm-modules scripts/apd-commercial-native-redirect-fix.mjs --stage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APD_STAGE_REDIRECT_ZERO_TRAFFIC: '1'
