name: APD ABC two full passes - Worker key stability (read-only)
on:
  pull_request:
    paths:
      - 'scripts/apd-abc-worker-key-two-pass-readonly.mjs'
      - 'scripts/audit-apd-abc-worker-key-twopass.mjs'
      - 'scripts/test-apd-abc-worker-key-twopass.mjs'
      - '.github/workflows/apd-abc-worker-key-twopass.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-index-key-stability:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: la-matanza
            district: "LA MATANZA"
          - id: avellaneda
            district: "AVELLANEDA"
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source read-only cursor and canonical Worker key integration
        run: |
          node --check scripts/apd-abc-worker-key-two-pass-readonly.mjs
          node --check scripts/audit-apd-abc-worker-key-twopass.mjs
          node --test scripts/test-apd-abc-worker-key-twopass.mjs
          node --test scripts/test-apd-worker-source-key-readonly.mjs
      - name: Compare two full public ABC cursor passes (GET, 3 projected ID fields)
        env:
          APD_AUDIT_DISTRICT: ${{ matrix.district }}
        run: node scripts/audit-apd-abc-worker-key-twopass.mjs
      - name: Store only aggregate report without any identifiers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd-abc-worker-key-twopass-${{ matrix.id }}
          path: tmp/apd-abc-key-twopass/summary-${{ matrix.id }}.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Worker source, frontend and database are not changed
        run: git diff --exit-code origin/main -- worker-live/worker_hotfix.js index.html app_v2.js sql supabase
