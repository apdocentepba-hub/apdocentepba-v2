name: Fingerprint approved APDocente live release

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fingerprint-approved-worker.mjs'
      - '.github/workflows/fingerprint-approved-worker.yml'

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/fingerprint-approved-worker.mjs
      - name: Verify immutable production version source digest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/fingerprint-approved-worker.mjs
