name: APD alert panel performance candidate (no deploy)
on:
  pull_request:
    paths:
      - 'scripts/build-apd-alert-panel-performance-candidate.mjs'
      - 'scripts/test-apd-alert-panel-performance-candidate.mjs'
      - 'scripts/benchmark-apd-alert-panel-performance-synthetic.mjs'
      - 'scripts/probe-apd-public-abc-latency-readonly.mjs'
      - 'scripts/probe-apd-published-full-cursor-shape-readonly.mjs'
      - 'scripts/apd-abc-published-projected-cursor-readonly.mjs'
      - 'scripts/test-apd-abc-published-projected-cursor-readonly.mjs'
      - 'scripts/test-apd-projected-alert-pid-parity.mjs'
      - 'scripts/apd-public-observation-risk-readonly.mjs'
      - 'scripts/probe-apd-public-observations-readonly.mjs'
      - 'scripts/test-apd-public-observation-risk-readonly.mjs'
      - 'scripts/apd-alert-payload-minimization.mjs'
      - 'scripts/build-apd-alert-privacy-candidate.mjs'
      - 'scripts/test-apd-alert-privacy-candidate.mjs'
      - 'scripts/probe-apd-projected-published-complete-readonly.mjs'
      - 'scripts/audit-apd-panel-static-assets.mjs'
      - '.github/workflows/apd-alert-panel-performance-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-offline-performance-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build candidate in ignored tmp directory only
        run: |
          node --check scripts/build-apd-alert-panel-performance-candidate.mjs
          node scripts/build-apd-alert-panel-performance-candidate.mjs
          node --check tmp/apd-alerts-performance/worker_hotfix.js
      - name: Verify original-vs-candidate results and max-two ABC concurrency
        run: |
          node --check scripts/test-apd-alert-panel-performance-candidate.mjs
          node --test scripts/test-apd-alert-panel-performance-candidate.mjs
      - name: Compare p50 and p95 against fixed synthetic upstream latency (not real production)
        run: |
          node --check scripts/benchmark-apd-alert-panel-performance-synthetic.mjs
          node scripts/benchmark-apd-alert-panel-performance-synthetic.mjs
      - name: Optional four-GET public ABC latency observation (not a real user dashboard)
        run: |
          node --check scripts/probe-apd-public-abc-latency-readonly.mjs
          node scripts/probe-apd-public-abc-latency-readonly.mjs
      - name: Inspect full published-only cursor source fields without logging offers
        run: |
          node --check scripts/probe-apd-published-full-cursor-shape-readonly.mjs
          node scripts/probe-apd-published-full-cursor-shape-readonly.mjs
      - name: Validate fail-closed Published-only projected cursor with fake ABC pages
        run: |
          node --check scripts/apd-abc-published-projected-cursor-readonly.mjs
          node --check scripts/test-apd-abc-published-projected-cursor-readonly.mjs
          node --test scripts/test-apd-abc-published-projected-cursor-readonly.mjs
      - name: Compare canonical Worker filters, PID results and rendered alert fields with projected fake offers
        run: |
          node --check scripts/test-apd-projected-alert-pid-parity.mjs
          node --test scripts/test-apd-projected-alert-pid-parity.mjs
      - name: Check complete published-only public ABC coverage without personal fields
        run: |
          node --check scripts/probe-apd-projected-published-complete-readonly.mjs
          node scripts/probe-apd-projected-published-complete-readonly.mjs
      - name: Check free-text observation privacy using aggregate-only synthetic tests
        run: |
          node --check scripts/apd-public-observation-risk-readonly.mjs
          node --test scripts/test-apd-public-observation-risk-readonly.mjs
      - name: Read privacy-risk counts from public Published-only observations without logging values
        run: |
          node --check scripts/probe-apd-public-observations-readonly.mjs
          node scripts/probe-apd-public-observations-readonly.mjs
      - name: Build strict privacy-minimized alert variant in disposable tmp only
        run: |
          node --check scripts/apd-alert-payload-minimization.mjs
          node --check scripts/build-apd-alert-privacy-candidate.mjs
          node scripts/build-apd-alert-privacy-candidate.mjs
          node --check tmp/apd-alerts-performance/worker_privacy_candidate.js
      - name: Check complete alert/PID field parity while withholding raw private data
        run: |
          node --check scripts/test-apd-alert-privacy-candidate.mjs
          node --test scripts/test-apd-alert-privacy-candidate.mjs
      - name: Inventory synchronous panel assets without network requests
        run: |
          node --check scripts/audit-apd-panel-static-assets.mjs
          node scripts/audit-apd-panel-static-assets.mjs
      - name: Explicitly verify production Worker, UI and Supabase unchanged
        run: |
          git diff --exit-code origin/main -- worker-live worker.js app_v2.js index.html supabase sql
          test -z "$(git status --porcelain -- worker-live worker.js app_v2.js index.html supabase sql)"
