name: Diagnose ABC email district response times

on:
  push:
    branches:
      - audit/live-offer-identity-2026-09-15
    paths:
      - .github/workflows/diagnose-abc-email-districts-2026-09-15.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Measure full pagination used by live email refresh
        run: |
          set -u
          python - <<'PY'
          import json, subprocess, urllib.parse, time
          rows=150
          max_pages=6
          for district in ['NECOCHEA','AVELLANEDA','GENERAL SAN MARTIN','PARTIDO DE LA COSTA']:
              district_started=time.time()
              total_requests=0
              num_found=None
              for page in range(max_pages):
                  start=page*rows
                  q=f'descdistrito:"{district}" AND estado:"Publicada"'
                  url='https://servicios3.abc.gob.ar/valoracion.docente/api/apd.oferta.encabezado/select?'+urllib.parse.urlencode({
                      'q':q,'rows':str(rows),'start':str(start),'wt':'json','sort':'ult_movimiento desc'
                  })
                  out=f'/tmp/probe.json'
                  p=subprocess.run(['curl','-sS','--max-time','12','-o',out,'-w','%{http_code} %{time_total}',url],text=True,capture_output=True)
                  total_requests += 1
                  print(f'{district} page={page+1} start={start}: rc={p.returncode} http_time={p.stdout.strip()} stderr={p.stderr.strip()[:180]}')
                  if p.returncode != 0:
                      break
                  try:
                      raw=open(out,'rb').read().decode('latin1')
                      data=json.loads(raw)
                      docs=data.get('response',{}).get('docs',[]) or []
                      num_found=int(data.get('response',{}).get('numFound') or 0)
                      print(f'{district} page={page+1}: numFound={num_found} docs={len(docs)}')
                      if len(docs) < rows or start + len(docs) >= num_found:
                          break
                  except Exception as e:
                      print(f'{district}: parse_error={e}')
                      break
              print(f'{district}: total_requests={total_requests} numFound={num_found} elapsed={time.time()-district_started:.3f}s')
          PY
