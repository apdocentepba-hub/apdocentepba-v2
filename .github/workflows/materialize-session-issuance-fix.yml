name: Materialize account session issuance fix

on:
  push:
    branches:
      - fix/account-security-session-api-2026-09-16
    paths:
      - .github/workflows/materialize-session-issuance-fix.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/account-security-session-api-2026-09-16
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add server-side session issuance
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          worker_path = Path('worker-live/worker_hotfix.js')
          manifest_path = Path('worker-live/manifest.json')
          text = worker_path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              assert count == 1, f'{label}: expected exactly one occurrence, found {count}'
              text = text.replace(old, new, 1)

          marker = 'async function handleLoginHotfix(request, env) {'
          helper = '''async function accountCreateSessionV1(env, userId, metodo = "password") {
            const token = accountRandomHexV1(32);
            const createdAt = new Date().toISOString();
            const expiresAt = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString();
            await supabaseInsertReturning2(env, "sessions", {
              token,
              user_id: userId,
              metodo,
              created_at: createdAt,
              expires_at: expiresAt,
              activo: true
            });
            return { token, created_at: createdAt, expires_at: expiresAt };
          }
          __name(accountCreateSessionV1, "accountCreateSessionV1");
          '''
          assert text.count(marker) == 1, f'login marker count={text.count(marker)}'
          text = text.replace(marker, helper + marker, 1)

          replace_once(
              '      await ensureTrialIfNoSubscriptions2(env, user.id, user.email, "trial_auto_login_hotfix");\n      await touchUltimoLogin2(env, user.id);\n      return json2({ ok: true, token: String(user.id), user: { id: user.id, nombre: user.nombre || "", apellido: user.apellido || "", email: user.email || "" } });',
              '      await ensureTrialIfNoSubscriptions2(env, user.id, user.email, "trial_auto_login_hotfix");\n      const session = await accountCreateSessionV1(env, user.id, "password");\n      await touchUltimoLogin2(env, user.id);\n      return json2({ ok: true, token: String(user.id), session_token: session.token, user: { id: user.id, nombre: user.nombre || "", apellido: user.apellido || "", email: user.email || "" } });',
              'password session issuance'
          )
          replace_once(
              '    await ensureTrialIfNoSubscriptions2(env, user.id, user.email, "trial_auto_login_legacy");\n    await touchUltimoLogin2(env, user.id);\n    return json2({ ok: true, migrated_legacy: true, token: String(user.id), user: { id: user.id, nombre: user.nombre || "", apellido: user.apellido || "", email: user.email || "" } });',
              '    await ensureTrialIfNoSubscriptions2(env, user.id, user.email, "trial_auto_login_legacy");\n    const session = await accountCreateSessionV1(env, user.id, "password_legacy");\n    await touchUltimoLogin2(env, user.id);\n    return json2({ ok: true, migrated_legacy: true, token: String(user.id), session_token: session.token, user: { id: user.id, nombre: user.nombre || "", apellido: user.apellido || "", email: user.email || "" } });',
              'legacy password session issuance'
          )
          replace_once(
              '  await ensureTrialIfNoSubscriptions2(env, user.id, user.email, "trial_auto_google_hotfix");\n  await touchUltimoLogin2(env, user.id);\n  return json2({ ok: true, mode: "login", token: String(user.id), user: { id: user.id, nombre: user.nombre || googleUser.nombre || "", apellido: user.apellido || googleUser.apellido || "", email: user.email || googleUser.email || "" } });',
              '  await ensureTrialIfNoSubscriptions2(env, user.id, user.email, "trial_auto_google_hotfix");\n  const session = await accountCreateSessionV1(env, user.id, "google");\n  await touchUltimoLogin2(env, user.id);\n  return json2({ ok: true, mode: "login", token: String(user.id), session_token: session.token, user: { id: user.id, nombre: user.nombre || googleUser.nombre || "", apellido: user.apellido || googleUser.apellido || "", email: user.email || googleUser.email || "" } });',
              'Google session issuance'
          )

          worker_path.write_text(text)
          manifest = json.loads(manifest_path.read_text())
          entry = next((m for m in manifest.get('modules', []) if m.get('name') == 'worker_hotfix.js'), None)
          assert entry is not None, 'worker_hotfix.js missing from manifest'
          entry['module_sha256'] = hashlib.sha256(text.encode()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          print(entry['module_sha256'])
          PY
          node --check worker-live/worker_hotfix.js
          node scripts/test-account-security-contract.mjs
          node scripts/test-live-email-cron-isolation.mjs worker-live/worker_hotfix.js
          node scripts/test-live-email-observability.mjs worker-live/worker_hotfix.js
          node scripts/test-live-manual-email-dedupe.mjs worker-live/worker_hotfix.js
          node scripts/test-live-offer-identity-bundle.mjs worker-live/worker_hotfix.js
      - name: Commit session issuance fix and remove materializer
        run: |
          set -euo pipefail
          git config user.name 'apdocentepba-hub'
          git config user.email 'apdocentepba@gmail.com'
          git rm .github/workflows/materialize-session-issuance-fix.yml
          git add worker-live/worker_hotfix.js worker-live/manifest.json
          git diff --cached --check
          git commit -m 'Issue secure sessions from hotfix login handlers'
          git push origin HEAD:fix/account-security-session-api-2026-09-16
