name: Release authenticated messaging status safely

on:
  pull_request:
    paths:
      - 'scripts/release-live-messaging-auth.mjs'
      - 'scripts/test-release-live-messaging-auth.mjs'
      - '.github/workflows/release-live-messaging-auth.yml'
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Confirm manual production release"
        required: true
        type: choice
        default: "NO"
        options: ["NO", "RELEASE"]
      real_session_qa:
        description: "Confirm approved real-session QA"
        required: true
        type: choice
        default: "NOT_VERIFIED"
        options: ["NOT_VERIFIED", "VERIFIED"]

permissions:
  contents: read

concurrency:
  group: apd-canonical-worker-baseline
  cancel-in-progress: false

jobs:
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/release-live-messaging-auth.mjs
      - run: node --test scripts/test-release-live-messaging-auth.mjs
  production:
    needs: release-tests
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_release == 'RELEASE' && inputs.real_session_qa == 'VERIFIED'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote only verified two-function patch; rollback on failed smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/release-live-messaging-auth.mjs
