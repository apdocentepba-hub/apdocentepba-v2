name: Release authenticated messaging status safely

on:
  pull_request:
    paths:
      - 'scripts/release-live-messaging-auth.mjs'
      - 'scripts/test-release-live-messaging-auth.mjs'
      - '.github/workflows/release-live-messaging-auth.yml'
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Confirm manual production release"
        required: true
        type: choice
        default: "NO"
        options: ["NO", "RELEASE"]
      real_session_qa:
        description: "Confirm approved real-session QA"
        required: true
        type: choice
        default: "NOT_VERIFIED"
        options: ["NOT_VERIFIED", "VERIFIED"]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('apd-pr-{0}-{1}', github.workflow, github.event.pull_request.number) || 'apd-canonical-worker-baseline' }}
  cancel-in-progress: false

jobs:
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/release-live-messaging-auth.mjs
      # The old patch-builder test expects two *vulnerable* handlers; the
      # canonical Worker already has the fix. Test the actual source instead.
      - run: node --test scripts/test-live-messaging-status-auth-current.mjs
  production:
    needs: release-tests
    # Permanently fail closed: legacy release script still requires a push event
    # and is obsolete on already-hardened canonical source.
    # A future release must use a new reviewed workflow, not this job.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_release == 'RELEASE' && inputs.real_session_qa == 'VERIFIED' && false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote only verified two-function patch; rollback on failed smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/release-live-messaging-auth.mjs
