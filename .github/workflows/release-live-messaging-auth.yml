name: Release authenticated messaging status safely

on:
  pull_request:
    paths:
      - 'scripts/release-live-messaging-auth.mjs'
      - 'scripts/test-release-live-messaging-auth.mjs'
      - '.github/workflows/release-live-messaging-auth.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/release-live-messaging-auth.mjs'
      - 'scripts/test-release-live-messaging-auth.mjs'
      - '.github/workflows/release-live-messaging-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apd-canonical-worker-baseline
  cancel-in-progress: false

jobs:
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/release-live-messaging-auth.mjs
      - run: node --test scripts/test-release-live-messaging-auth.mjs
  production:
    needs: release-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote only verified two-function patch; rollback on failed smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/release-live-messaging-auth.mjs
