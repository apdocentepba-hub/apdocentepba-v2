name: Diagnose live email sweep 2026-09-17

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diag-live-email-sweep-20260917.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: ancient-wildflower-cd37
    steps:
      - uses: actions/checkout@v4
      - name: Fetch active Worker and extract safe sweep skeleton
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .diag artifacts
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts?per_page=50" > .diag/accounts.json
          ACCOUNT_ID=$(node -e "const j=require('./.diag/accounts.json');if(!j.success||!j.result?.length)process.exit(2);process.stdout.write(j.result[0].id)")
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" > .diag/deployments.json
          ACTIVE=$(node -e "const j=require('./.diag/deployments.json');const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];if(!v?.version_id)process.exit(3);process.stdout.write(v.version_id)")
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${ACTIVE}?include=modules" > .diag/version.json
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const j=JSON.parse(fs.readFileSync('.diag/version.json','utf8')); const r=j.result;
          const mods=Object.fromEntries((r.modules||[]).map(m=>[m.name,Buffer.from(m.content_base64||'','base64').toString('utf8')])); const main=mods[r.main_module]||'';
          const start=main.indexOf('async function runEmailAlertsSweep('); if(start<0)throw new Error('sweep missing');
          const candidates=['async function handleTestMail(','async function runWhatsAppAlertsSweep(','function buildDigestHtml(','var worker_hotfix_default ='].map(x=>main.indexOf(x,start+40)).filter(x=>x>start); const end=candidates.length?Math.min(...candidates):Math.min(main.length,start+120000); const sweep=main.slice(start,end);
          const lines=sweep.split('\n');
          const safe=[];
          for(let i=0;i<lines.length;i++){
            const l=lines[i];
            if(/BATCH_SIZE|target_user_id|rowsToProcess|prefRows|user_preferences|processedUsers|sentCount|skippedCount|failedCount|for \(const row of rowsToProcess\)|construirAlertasParaUsuario|resolverPlanUsuario|dedupe|reservation|first_emailed_at|last_emailed_at|newCursor|return \{|cursor|dry_run|debugUsers/.test(l)){
              const clean=l.replace(/[A-Za-z0-9_-]{20,}/g,'<redacted>');
              safe.push({n:i+1,text:clean.slice(0,500)});
            }
          }
          const scheduledStart=main.indexOf('async scheduled('); const scheduled=scheduledStart>=0?main.slice(scheduledStart,Math.min(main.length,scheduledStart+16000)):'';
          const scheduledLines=scheduled.split('\n').filter(x=>/runEmailAlertsSweep|waitUntil|recordObservedEmailCron|email/i.test(x)).slice(0,80).map(x=>x.replace(/[A-Za-z0-9_-]{20,}/g,'<redacted>').slice(0,500));
          const out={active_version_id:r.id,version_number:r.number,main_sha256:crypto.createHash('sha256').update(main).digest('hex'),sweep_safe_lines:safe.slice(0,220),scheduled_safe_lines:scheduledLines};
          fs.writeFileSync('artifacts/diag-live-email-sweep-20260917.json',JSON.stringify(out,null,2));
          NODE
      - name: Commit sanitized diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/diag-live-email-sweep-20260917.json
          git commit -m "diag: capture safe live sweep skeleton 2026-09-17" || exit 0
          git push
