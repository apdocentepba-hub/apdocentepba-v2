name: APD commercial consolidation policy (offline only)
on:
  pull_request:
    paths:
      - 'scripts/apd-commercial-policy.mjs'
      - 'scripts/apd-commercial-checkout.mjs'
      - 'scripts/test-apd-commercial-checkout.mjs'
      - 'scripts/test-apd-commercial-policy.mjs'
      - '.github/workflows/apd-commercial-consolidation.yml'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/apd-commercial-policy.mjs
      - run: node --test scripts/test-apd-commercial-policy.mjs scripts/test-apd-commercial-checkout.mjs
