name: APD ABC minimal scanner sample contract (read only)
on:
  pull_request:
    paths:
      - 'scripts/audit-apd-scanner-minimal-samples.mjs'
      - 'scripts/test-apd-scanner-minimal-samples.mjs'
      - '.github/workflows/apd-abc-scanner-minimal-samples.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-production-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test projected sample constraints
        run: |
          node --check scripts/audit-apd-scanner-minimal-samples.mjs
          node --test scripts/test-apd-scanner-minimal-samples.mjs
      - name: Verify ABC public sample fields in seven GET requests
        run: node scripts/audit-apd-scanner-minimal-samples.mjs
      - name: Keep aggregated booleans, never raw documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd-scanner-sample-contract
          path: tmp/apd-scanner-sample-contract/report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve production Worker and frontend
        run: git diff --exit-code origin/main -- worker-live/worker_hotfix.js index.html app_v2.js
