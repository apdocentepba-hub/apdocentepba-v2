name: Smoke active production Worker contracts

on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'
  pull_request:
    paths:
      - package.json
      - wrangler.toml
      - worker-live/**
      - scripts/test-production-worker-source-guard.mjs
      - scripts/test-live-capture-contract.mjs
      - scripts/test-live-resource-binding-capture.mjs
      - scripts/test-live-source-equivalence.mjs
      - scripts/test-live-manual-email-dedupe.mjs
      - scripts/test-live-offer-identity-bundle.mjs
      - scripts/test-live-email-observability.mjs
      - scripts/test-live-email-cron-isolation.mjs
      - .github/workflows/deploy-worker-manual.yml
      - .github/workflows/smoke-live-worker-contracts.yml
  push:
    branches:
      - main
    paths:
      - package.json
      - wrangler.toml
      - worker-live/**
      - scripts/test-production-worker-source-guard.mjs
      - scripts/test-live-capture-contract.mjs
      - scripts/test-live-resource-binding-capture.mjs
      - scripts/test-live-source-equivalence.mjs
      - scripts/test-live-manual-email-dedupe.mjs
      - scripts/test-live-offer-identity-bundle.mjs
      - scripts/test-live-email-observability.mjs
      - scripts/test-live-email-cron-isolation.mjs
      - .github/workflows/deploy-worker-manual.yml
      - .github/workflows/smoke-live-worker-contracts.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: ancient-wildflower-cd37
      WORKER_URL: https://ancient-wildflower-cd37.apdocentepba.workers.dev
      SITE_URL: https://alertasapd.com.ar
    steps:
      - uses: actions/checkout@v4

      - name: Verify repository production-source guard
        run: node scripts/test-production-worker-source-guard.mjs

      - name: Verify live capture contract
        run: node scripts/test-live-capture-contract.mjs

      - name: Verify live resource binding capture contract
        run: node scripts/test-live-resource-binding-capture.mjs

      - name: Download current active Worker bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p tmp/live-worker-contract-smoke
          ROOT=tmp/live-worker-contract-smoke

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=50" > "$ROOT/accounts.json"

          ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-}"
          if [ -n "$ACCOUNT_ID" ]; then
            ROOT="$ROOT" ACCOUNT_ID="$ACCOUNT_ID" node - <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync(`${process.env.ROOT}/accounts.json`, 'utf8'));
          const accounts = Array.isArray(j.result) ? j.result : [];
          if (!j.success || !accounts.some(account => account.id === process.env.ACCOUNT_ID)) {
            throw new Error('Configured CLOUDFLARE_ACCOUNT_ID is not accessible with this token');
          }
          NODE
          else
            ACCOUNT_COUNT=$(ROOT="$ROOT" node -e "const j=require('./'+process.env.ROOT+'/accounts.json');const a=Array.isArray(j.result)?j.result:[];if(!j.success)process.exit(2);process.stdout.write(String(a.length))")
            if [ "$ACCOUNT_COUNT" -ne 1 ]; then
              echo "Expected exactly one accessible Cloudflare account when CLOUDFLARE_ACCOUNT_ID is unset; found ${ACCOUNT_COUNT}."
              echo "Set repository secret CLOUDFLARE_ACCOUNT_ID to remove account ambiguity."
              exit 2
            fi
            ACCOUNT_ID=$(ROOT="$ROOT" node -e "const j=require('./'+process.env.ROOT+'/accounts.json');const [account]=j.result||[];if(!account?.id)process.exit(2);process.stdout.write(account.id)")
          fi
          echo "Cloudflare account selected explicitly/unambiguously."

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" > "$ROOT/deployments.json"

          ACTIVE=$(ROOT="$ROOT" node -e "const j=require('./'+process.env.ROOT+'/deployments.json');const d=j.result?.deployments?.[0];const traffic=(d?.versions||[]).filter(x=>Number(x.percentage)>0);if(traffic.length!==1||Number(traffic[0].percentage)!==100||!traffic[0].version_id){console.error('Expected one 100% traffic version; got '+JSON.stringify(traffic));process.exit(3)};process.stdout.write(traffic[0].version_id)")
          echo "ACTIVE_VERSION=${ACTIVE}" >> "$GITHUB_ENV"
          echo "Active production version: ${ACTIVE}"

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${ACTIVE}?include=modules" > "$ROOT/active.json"

          ROOT="$ROOT" WORKER_NAME="$WORKER_NAME" ACCOUNT_ID="$ACCOUNT_ID" ACTIVE_VERSION="$ACTIVE" node --input-type=module - <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';

          const root = process.env.ROOT;
          const j = JSON.parse(fs.readFileSync(`${root}/active.json`, 'utf8'));
          const r = j.result;
          if (!j.success || !r?.id) throw new Error('active version detail missing');
          if (r.main_module !== 'worker_hotfix.js') throw new Error(`main module drift: ${r.main_module}`);

          const requiredModules = ['email_queue_hotfix.js', 'worker_email_queue_hotfix.js', 'worker_hotfix.js'];
          const modules = r.modules || [];
          const names = modules.map(m => m.name);
          for (const name of requiredModules) {
            if (!names.includes(name)) throw new Error(`required production module missing: ${name}`);
          }

          const bindings = r.bindings || [];
          if (bindings.length < 27) throw new Error(`binding shape lost required entries: ${bindings.length}`);

          const manifestModules = [];
          for (const m of modules) {
            const content = Buffer.from(m.content_base64 || '', 'base64');
            fs.writeFileSync(path.join(root, m.name), content);
            manifestModules.push({
              name: m.name,
              module_sha256: crypto.createHash('sha256').update(content).digest('hex')
            });
          }

          const safeBindings = bindings.map(binding => {
            const safe = { name: binding.name || '', type: binding.type || '' };
            if (safe.type === 'kv_namespace') {
              safe.namespace_id = String(binding.namespace_id || binding.id || '').trim();
            }
            return safe;
          });
          const sweepStateBinding = safeBindings.find(binding => binding.name === 'EMAIL_SWEEP_STATE');
          if (!sweepStateBinding || sweepStateBinding.type !== 'kv_namespace' || !sweepStateBinding.namespace_id) {
            throw new Error('EMAIL_SWEEP_STATE KV namespace_id missing from active Worker metadata');
          }

          const manifest = {
            schema_version: 1,
            worker_name: process.env.WORKER_NAME,
            account_id: process.env.ACCOUNT_ID,
            version_id: process.env.ACTIVE_VERSION,
            main_module: r.main_module,
            captured_at: new Date().toISOString(),
            modules: manifestModules.sort((a, b) => a.name.localeCompare(b.name)),
            bindings: safeBindings
              .sort((a, b) => `${a.name}:${a.type}`.localeCompare(`${b.name}:${b.type}`))
          };
          fs.writeFileSync(path.join(root, 'manifest.json'), `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(`Bundle shape OK: ${names.length} modules / ${bindings.length} bindings`);
          console.log(`EMAIL_SWEEP_STATE namespace_id: ${sweepStateBinding.namespace_id}`);
          console.log(`Sanitized manifest written for ${manifest.version_id}`);
          NODE

      - name: Verify active Worker matches canonical repository snapshot
        run: |
          set -euo pipefail
          ROOT=tmp/live-worker-contract-smoke
          node scripts/test-live-source-equivalence.mjs "$ROOT"

      - name: Upload sanitized active Worker capture
        uses: actions/upload-artifact@v4
        with:
          name: live-worker-canonical-capture
          path: |
            tmp/live-worker-contract-smoke/manifest.json
            tmp/live-worker-contract-smoke/*.js
          if-no-files-found: error
          retention-days: 7

      - name: Run production bundle contracts
        run: |
          set -euo pipefail
          ROOT=tmp/live-worker-contract-smoke
          for file in "$ROOT"/*.js; do
            node --check "$file"
          done
          node scripts/test-live-email-cron-isolation.mjs "$ROOT/worker_hotfix.js"
          node scripts/test-live-email-observability.mjs "$ROOT/worker_hotfix.js"
          node scripts/test-live-manual-email-dedupe.mjs "$ROOT/worker_hotfix.js"
          node scripts/test-live-offer-identity-bundle.mjs "$ROOT/worker_hotfix.js"

      - name: Run read-only production HTTP smoke
        run: |
          set -euo pipefail
          DUMMY=00000000-0000-4000-8000-000000000000
          curl_code() {
            curl --retry 2 --retry-delay 2 -sS -o /dev/null -w '%{http_code}' "$@"
          }
          for path in \
            "/api/mis-alertas?user_id=${DUMMY}" \
            "/api/mi-plan?user_id=${DUMMY}" \
            "/api/historico-resumen?user_id=${DUMMY}" \
            "/api/guardar-preferencias" \
            "/api/capturar-historico-apd" \
            "/api/mercadopago/create-checkout-link" \
            "/api/whatsapp/test-send"; do
            code=$(curl_code "${WORKER_URL}${path}")
            echo "${path} -> ${code}"
            test "$code" = "401"
          done
          test "$(curl_code -H "Authorization: Bearer ${DUMMY}" "${WORKER_URL}/api/mis-alertas?user_id=${DUMMY}")" = "401"
          test "$(curl_code "${WORKER_URL}/api/version")" = "200"
          test "$(curl_code "${WORKER_URL}/api/planes")" = "200"
          test "$(curl_code -X OPTIONS "${WORKER_URL}/api/mis-alertas")" = "200"
          test "$(curl_code -L "${SITE_URL}/")" = "200"
          echo "Production HTTP smoke OK for ${ACTIVE_VERSION}"
