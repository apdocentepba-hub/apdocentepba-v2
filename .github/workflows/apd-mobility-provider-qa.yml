name: APD mobility providers — anonymous CORS probe (informational)
on:
  pull_request:
    paths:
      - '.github/workflows/apd-mobility-provider-qa.yml'
      - 'scripts/audit-apd-mobility-demo-cors.mjs'
      - 'scripts/apd-amba-bus-routes.mjs'
permissions:
  contents: read
jobs:
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check access constraints of volunteer routing services without user coordinates
        run: |
          node --check scripts/audit-apd-mobility-demo-cors.mjs
          node scripts/audit-apd-mobility-demo-cors.mjs
