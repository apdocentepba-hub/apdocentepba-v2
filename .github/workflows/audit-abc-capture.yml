name: Audit ABC capture coverage

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-abc-capture.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compare district capture vs cargo-prefilter capture
        run: |
          mkdir -p artifacts
          cat > /tmp/audit.mjs <<'NODE'
          const API = 'https://servicios3.abc.gob.ar/valoracion.docente/api/apd.oferta.encabezado/select';
          const district = 'AVELLANEDA';
          const cargos = [
            { query: 'MATEMATICA', code: 'MTM' },
            { query: 'PRECEPTOR', code: 'PR' },
            { query: 'NTICX', code: 'NTI' },
            { query: 'ENCARGADO MEDIOS APOYO TEC-PED.INF/COMP/E INF.APL.', code: 'ELI' }
          ];
          const rows = 150;
          const workerMaxPages = 25;
          const auditMaxPages = 120;
          const now = Date.now();

          const norm = (v='') => String(v).toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
          const escapeSolr = (v='') => String(v).replace(/(["\\])/g, '\\$1');
          const keyOf = (d) => String(d?.iddetalle || d?.id || d?.idoferta || JSON.stringify(d));
          const isActive = (d) => {
            const end = Date.parse(d?.finoferta || '');
            if (Number.isFinite(end)) return end >= now;
            const estado = norm(d?.estado || '');
            return !/(ANUL|CERR|FINAL|DESIGN|DESIER)/.test(estado);
          };

          function codesInDoc(doc) {
            const text = [doc?.descripcioncargo, doc?.descripcionarea, doc?.cargo, doc?.materia, doc?.asignatura, doc?.area]
              .filter(Boolean).join(' ');
            const codes = new Set();
            for (const m of text.matchAll(/\(([^)]+)\)/g)) {
              const c = norm(m[1]).replace(/[^A-Z0-9]/g, '');
              if (c) codes.add(c);
            }
            return codes;
          }

          async function fetchQuery(q, maxPages) {
            const docs = [];
            let numFound = null;
            for (let page=0; page<maxPages; page++) {
              const u = new URL(API);
              u.searchParams.set('q', q);
              u.searchParams.set('rows', String(rows));
              u.searchParams.set('start', String(page*rows));
              u.searchParams.set('wt','json');
              u.searchParams.set('sort','ult_movimiento desc');
              const r = await fetch(u);
              if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
              const j = await r.json();
              if (numFound == null) numFound = Number(j?.response?.numFound ?? 0);
              const batch = Array.isArray(j?.response?.docs) ? j.response.docs : [];
              docs.push(...batch);
              if (batch.length < rows || docs.length >= numFound) break;
            }
            return { docs, numFound };
          }

          const districtQ = `descdistrito:"${escapeSolr(district)}"`;
          const districtAll = await fetchQuery(districtQ, auditMaxPages);
          const districtWorkerWindow = districtAll.docs.slice(0, workerMaxPages * rows);
          const districtDocs = districtAll.docs.filter(d => norm(d?.descdistrito) === norm(district));
          const workerWindowDocs = districtWorkerWindow.filter(d => norm(d?.descdistrito) === norm(district));
          const activeAll = districtDocs.filter(isActive);
          const activeWorkerWindow = workerWindowDocs.filter(isActive);

          const report = {
            generated_at: new Date().toISOString(),
            district,
            abc_num_found: districtAll.numFound,
            audit_fetched: districtDocs.length,
            worker_window_limit: workerMaxPages * rows,
            active_all: activeAll.length,
            active_inside_worker_window: activeWorkerWindow.length,
            active_missed_by_worker_page_cap: activeAll.filter(d => !new Set(workerWindowDocs.map(keyOf)).has(keyOf(d))).length,
            cargos: []
          };

          for (const cargo of cargos) {
            const exactQ = [
              `descdistrito:"${escapeSolr(district)}"`,
              `(${[`descripcioncargo:"${escapeSolr(cargo.query)}"`,`descripcionarea:"${escapeSolr(cargo.query)}"`,`cargo:"${escapeSolr(cargo.query)}"`].join(' OR ')})`
            ].join(' AND ');
            const exact = await fetchQuery(exactQ, auditMaxPages);
            const exactActiveByCode = exact.docs.filter(d => norm(d?.descdistrito) === norm(district) && isActive(d) && codesInDoc(d).has(cargo.code));
            const districtActiveByCode = activeAll.filter(d => codesInDoc(d).has(cargo.code));
            const exactKeys = new Set(exactActiveByCode.map(keyOf));
            const missed = districtActiveByCode.filter(d => !exactKeys.has(keyOf(d)));
            report.cargos.push({
              query: cargo.query,
              code: cargo.code,
              exact_num_found: exact.numFound,
              exact_active_code_matches: exactActiveByCode.length,
              district_active_code_matches: districtActiveByCode.length,
              active_missed_by_exact_prefilter: missed.length,
              missed_preview: missed.slice(0,12).map(d => ({
                iddetalle:d?.iddetalle||d?.id||null,
                idoferta:d?.idoferta||null,
                cargo:d?.descripcioncargo||d?.cargo||'',
                area:d?.descripcionarea||'',
                escuela:d?.escuela||d?.nombreestablecimiento||'',
                finoferta:d?.finoferta||'',
                estado:d?.estado||''
              }))
            });
          }

          console.log(JSON.stringify(report,null,2));
          await import('node:fs').then(fs => fs.writeFileSync('artifacts/abc-capture-audit.json', JSON.stringify(report,null,2)));
          NODE
          node /tmp/audit.mjs

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: abc-capture-audit
          path: artifacts/abc-capture-audit.json
          if-no-files-found: error
