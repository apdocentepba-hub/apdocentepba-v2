name: Production Worker source guard

on:
  pull_request:
    paths:
      - package.json
      - wrangler.toml
      - worker-live/**
      - scripts/test-production-worker-source-guard.mjs
      - scripts/test-live-capture-contract.mjs
      - scripts/test-live-resource-binding-capture.mjs
      - scripts/test-reproducible-worker-binding-config.mjs
      - scripts/test-live-source-equivalence.mjs
      - scripts/test-canonical-worker-package.mjs
      - scripts/test-worker-zero-traffic-preview.mjs
      - .github/workflows/deploy-worker-manual.yml
      - .github/workflows/smoke-live-worker-contracts.yml
      - .github/workflows/worker-zero-traffic-preview.yml
      - .github/workflows/production-source-guard.yml
  push:
    branches: [main]
    paths:
      - package.json
      - wrangler.toml
      - worker-live/**
      - scripts/test-production-worker-source-guard.mjs
      - scripts/test-live-capture-contract.mjs
      - scripts/test-live-resource-binding-capture.mjs
      - scripts/test-reproducible-worker-binding-config.mjs
      - scripts/test-live-source-equivalence.mjs
      - scripts/test-canonical-worker-package.mjs
      - scripts/test-worker-zero-traffic-preview.mjs
      - .github/workflows/deploy-worker-manual.yml
      - .github/workflows/smoke-live-worker-contracts.yml
      - .github/workflows/worker-zero-traffic-preview.yml
      - .github/workflows/production-source-guard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production source guard contract
        run: node scripts/test-production-worker-source-guard.mjs
      - name: Verify live capture contract
        run: node scripts/test-live-capture-contract.mjs
      - name: Verify live resource binding capture contract
        run: node scripts/test-live-resource-binding-capture.mjs
      - name: Verify reproducible Worker binding config contract
        run: node scripts/test-reproducible-worker-binding-config.mjs
      - name: Verify canonical live source snapshot
        run: node scripts/test-live-source-equivalence.mjs
      - name: Verify canonical Worker packaging contract
        run: node scripts/test-canonical-worker-package.mjs
      - name: Verify zero-traffic preview workflow contract
        run: node scripts/test-worker-zero-traffic-preview.mjs
      - name: Install Wrangler dependencies
        run: npm install
      - name: Package canonical Worker without deploying
        run: npm run package:worker
