name: Apply email cron stale-slot fix
on:
  push:
    branches:
      - fix/email-cron-stale-slot-20260916
    paths:
      - .github/workflows/apply-email-cron-stale-slot-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/email-cron-stale-slot-20260916
      - name: Patch canonical Worker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker-live/worker_hotfix.js')
          s=p.read_text()
          old='''  if (activeFinished) {\n    await kv.delete(ACTIVE_SLOT_KEY).catch(() => null);\n    console.log("CRON EMAIL ACTIVE SLOT CLEANED", activeSlotKey);\n    return;\n  }\n\n  let result = null;'''
          new='''  if (activeFinished) {\n    const cleanedSlotKey = activeSlotKey;\n    await kv.delete(ACTIVE_SLOT_KEY).catch(() => null);\n    console.log("CRON EMAIL ACTIVE SLOT CLEANED", cleanedSlotKey);\n    activeSlotKey = "";\n\n    if (slot.slot_hour && slot.slot_key && cleanedSlotKey !== slot.slot_key) {\n      const currentFinishedKey = `email:slot:${slot.slot_key}:finished`;\n      const currentFinished = await kv.get(currentFinishedKey).catch(() => null);\n\n      if (!currentFinished) {\n        activeSlotKey = slot.slot_key;\n        await kv.put(ACTIVE_SLOT_KEY, activeSlotKey, {\n          expirationTtl: 60 * 60 * 36\n        }).catch(() => null);\n        await kv.put(`email:slot:${activeSlotKey}:started_at`, new Date().toISOString(), {\n          expirationTtl: 60 * 60 * 36\n        }).catch(() => null);\n        console.log("CRON EMAIL SLOT START AFTER STALE CLEANUP", activeSlotKey);\n      }\n    }\n\n    if (!activeSlotKey) return;\n  }\n\n  let result = null;'''
          if old not in s:
              raise SystemExit('expected stale-slot block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node scripts/test-email-cron-stale-slot.mjs
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker-live/worker_hotfix.js
          git commit -m 'Fix stale email cron slot rollover'
          git push origin HEAD:fix/email-cron-stale-slot-20260916
