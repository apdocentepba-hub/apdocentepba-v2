name: APD one-shot dedicated diary QA
on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/apd-diary-live-qa-once.yml'
permissions:
  contents: read
concurrency:
  group: apd-diary-live-qa-once
  cancel-in-progress: false
jobs:
  qa:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'qa/application-diary-live-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/run-apd-diary-live-qa-once.mjs
      - run: node scripts/run-apd-diary-live-qa-once.mjs
