name: Sync live Worker source 2026-09-18

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-live-worker-source-20260918.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_NAME: ancient-wildflower-cd37
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export active Cloudflare Worker into worker-live
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp worker-live
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts?per_page=50" > tmp/accounts.json
          ACCOUNT_ID=$(jq -r '.result[0].id' tmp/accounts.json)
          test -n "$ACCOUNT_ID" -a "$ACCOUNT_ID" != "null"

          DEPLOYMENTS_URL="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments"
          SCHEDULES_URL="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/schedules"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$DEPLOYMENTS_URL" > tmp/deployments.json
          ACTIVE=$(node -e "const j=require('./tmp/deployments.json');const d=j.result?.deployments?.[0];const v=d?.versions?.find(x=>Number(x.percentage)===100)||d?.versions?.[0];process.stdout.write(v?.version_id||'')")
          test -n "$ACTIVE"
          echo "active_version=$ACTIVE"

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${ACTIVE}?include=modules" > tmp/version.json
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$SCHEDULES_URL" > tmp/schedules.json

          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const v=require('./tmp/version.json');
          const s=require('./tmp/schedules.json');
          const r=v.result;
          if(!v.success || !r?.id) throw new Error('active version detail missing');
          const modules=Array.isArray(r.modules)?r.modules:[];
          if(!modules.length) throw new Error('no modules returned');
          const wanted=new Set(['worker_hotfix.js','email_queue_hotfix.js','worker_email_queue_hotfix.js']);
          const manifestModules=[];
          for(const m of modules){
            if(!wanted.has(m.name)) continue;
            const buf=Buffer.from(m.content_base64||'','base64');
            if(!buf.length) throw new Error('empty module '+m.name);
            fs.writeFileSync('worker-live/'+m.name,buf);
            manifestModules.push({
              name:m.name,
              sha256:crypto.createHash('sha256').update(buf).digest('hex'),
              bytes:buf.length
            });
          }
          if(!manifestModules.some(x=>x.name==='worker_hotfix.js')) throw new Error('worker_hotfix.js missing');
          const bindings=(r.bindings||[]).map(b=>{
            const out={name:b.name,type:b.type};
            if(b.namespace_id) out.namespace_id=b.namespace_id;
            return out;
          }).sort((a,b)=>a.name.localeCompare(b.name));
          const schedules=(s.result?.schedules||s.result||[]).map(x=>x.cron).filter(Boolean).sort();
          const manifest={
            schema_version:2,
            worker_name:process.env.WORKER_NAME,
            account_id:process.env.ACCOUNT_ID_FOR_MANIFEST || undefined,
            version_id:r.id,
            version_number:r.number ?? null,
            main_module:r.main_module,
            compatibility_date:r.compatibility_date||null,
            captured_at:new Date().toISOString(),
            modules:manifestModules.sort((a,b)=>a.name.localeCompare(b.name)),
            bindings,
            schedules
          };
          if(!manifest.account_id) delete manifest.account_id;
          fs.writeFileSync('worker-live/manifest.json',JSON.stringify(manifest,null,2)+'\n');
          console.log(JSON.stringify({version_id:r.id,main_module:r.main_module,modules:manifestModules,bindings:bindings.length,schedules},null,2));
          NODE

          node --check worker-live/worker_hotfix.js
          git config user.name "apdocentepba-hub"
          git config user.email "apdocentepba@gmail.com"
          git add worker-live/worker_hotfix.js worker-live/email_queue_hotfix.js worker-live/worker_email_queue_hotfix.js worker-live/manifest.json
          if git diff --cached --quiet; then
            echo "No source drift: repo already matches production"
          else
            git commit -m "chore: sync canonical live Worker source"
            git push origin HEAD:main
          fi
