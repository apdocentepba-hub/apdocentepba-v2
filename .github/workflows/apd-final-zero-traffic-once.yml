name: APD FINAL ABC/PID/close/bulk/morning Worker - one-time 0-percent upload
# Runs ONLY when the explicit approval marker is created in the dedicated staging branch.
# No deploy and no production traffic allocation.
on:
  push:
    branches:
      - staging/apd-final-offline-reviewed-20261104
    paths:
      - .release/approve-apd-final-upload-20261104.txt
permissions:
  contents: read
concurrency:
  group: apd-final-zero-traffic-20261104
  cancel-in-progress: false
jobs:
  upload-exact-candidate:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/staging/apd-final-offline-reviewed-20261104' &&
      github.event.head_commit.message == 'approve(apd): one-time 0-percent final version upload'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate approval marker, generate final pinned Worker and check source SHA
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        run: |
          set -euo pipefail
          test "$(cat .release/approve-apd-final-upload-20261104.txt)" = "AUTHORIZED_ONE_SHOT_ZERO_TRAFFIC_FINAL_20261104"
          node scripts/build-apd-bounded-abc-worker-release.mjs
          node scripts/build-apd-published-filter-research-candidate.mjs
          node scripts/build-apd-pid-bounded-research-candidate.mjs
          node scripts/build-apd-close-safe-research-candidate.mjs
          node scripts/build-apd-final-combined-worker-candidate.mjs
          node scripts/build-apd-morning-sweep-candidate.mjs
          test -f tmp/apd-morning-worker/attestation.json
          node -e "const a=require('./tmp/apd-morning-worker/attestation.json');if(a.candidate_sha256!=='c748dc0f1b9ba070c806620947037acc528822f64d404d1d6efa85bd8fb58d85'||a.cron_triggers_unchanged!==4)process.exit(1)"

          printf '%s  %s\n' 'c748dc0f1b9ba070c806620947037acc528822f64d404d1d6efa85bd8fb58d85' 'tmp/apd-morning-worker/worker_hotfix.js' | sha256sum --check
          node --check tmp/apd-morning-worker/worker_hotfix.js
          node --check scripts/upload-apd-final-zero-traffic-once.mjs
      - name: Run full regression: ABC, account isolation, closures, queue, morning, bulk (no writes)
        env:
          CLOUDFLARE_API_TOKEN: ''
          CLOUDFLARE_ACCOUNT_ID: ''
        run: |
          set -euo pipefail
          node --test scripts/test-apd-bounded-abc-worker-release.mjs
          node --test scripts/test-apd-generated-filter-candidate-differential.mjs
          node --test scripts/test-apd-bounded-pid-fallback.mjs
          node --test scripts/test-apd-offer-close-guard.mjs
          node --test scripts/test-apd-morning-sweep-candidate.mjs
          APD_TEST_FINAL_WORKER=1 node --test scripts/test-apd-bulk-sync-research.mjs
          APD_TEST_MORNING_WORKER=1 node --test scripts/test-apd-close-email-queue.mjs
          APD_TEST_WORKER_VARIANT=morning node --test scripts/test-apd-generated-worker-auth-router.mjs
          APD_TEST_WORKER_VARIANT=morning node --test scripts/test-apd-generated-worker-full-alert-flow.mjs

          APD_TEST_WORKER_VARIANT=pid node --test scripts/test-apd-generated-worker-auth-router.mjs
          APD_TEST_WORKER_VARIANT=pid node --test scripts/test-apd-worker-to-carousel-contract.mjs
          APD_TEST_WORKER_VARIANT=pid node --test scripts/test-apd-generated-worker-full-alert-flow.mjs
          node --test scripts/test-apd-worker-zero-traffic-config.mjs
      - name: Check Cloudflare active version, 29 bindings and 4 crons read-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/check-apd-worker-live-version-readonly.mjs
      - name: Recheck original 100-percent Worker and final candidate before upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/check-apd-pid-candidate-readiness-readonly.mjs
      - name: Authorized versions upload only - no deploy or traffic change
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APD_FINAL_ZERO_TRAFFIC_UPLOAD_APPROVED: yes_final_20261104
        run: |
          set -euo pipefail
          node scripts/upload-apd-final-zero-traffic-once.mjs
      - name: Archive sanitized receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apd-final-zero-traffic-upload-receipt
          path: tmp/apd-morning-worker/zero-traffic-upload-receipt.json
          if-no-files-found: error
          retention-days: 30
