name: Audit Cloudflare cron invocations 2026-09-17

on:
  push:
    paths:
      - '.github/workflows/audit-cloudflare-cron-invocations-20260917.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: ancient-wildflower-cd37
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Query Cloudflare scheduled invocation history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=50" > tmp/accounts.json
          ACCOUNT_ID=$(node -e "const j=require('./tmp/accounts.json');if(!j.success||!j.result?.length)process.exit(2);process.stdout.write(j.result[0].id)")
          NOW_MS=$(node -e 'process.stdout.write(String(Date.now()))')
          FROM_MS=$(node -e 'process.stdout.write(String(Date.now()-2*60*60*1000))')
          FROM_ISO=$(node -e 'process.stdout.write(new Date(Date.now()-2*60*60*1000).toISOString())')
          TO_ISO=$(node -e 'process.stdout.write(new Date().toISOString())')

          node - <<'NODE'
          const fs=require('fs');
          const now=Date.now();
          const body={
            queryId:'alertsapd-cron-audit-'+now,
            timeframe:{from:now-2*60*60*1000,to:now},
            view:'events',
            chart:false,
            parameters:{
              datasets:['cloudflare-workers'],
              filterCombination:'and',
              filters:[
                {key:'$metadata.service',operation:'eq',type:'string',value:process.env.WORKER_NAME},
                {key:'$metadata.origin',operation:'eq',type:'string',value:'scheduled'}
              ],
              limit:100
            }
          };
          fs.writeFileSync('tmp/obs-body.json',JSON.stringify(body));
          NODE
          OBS_CODE=$(curl -sS -o tmp/obs.json -w "%{http_code}" \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/observability/telemetry/query" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @tmp/obs-body.json || true)
          echo "observability_http=${OBS_CODE}"
          if [ -s tmp/obs.json ]; then
            node - <<'NODE'
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('tmp/obs.json','utf8'));
            console.log('observability_success='+String(j.success));
            if(j.errors?.length) console.log('observability_errors='+JSON.stringify(j.errors));
            const ev=j.result?.events?.events||[];
            console.log('observability_event_count='+ev.length);
            for(const e of ev.slice(0,100)){
              console.log(JSON.stringify({
                timestamp:e.timestamp,
                message:e.$metadata?.message,
                origin:e.$metadata?.origin,
                trigger:e.$metadata?.trigger,
                error:e.$metadata?.error,
                service:e.$metadata?.service,
                eventType:e.$workers?.eventType,
                outcome:e.$workers?.outcome,
                requestId:e.$workers?.requestId,
                version:e.$workers?.scriptVersion?.id
              }));
            }
            NODE
          fi

          node - <<'NODE'
          const fs=require('fs');
          const q=`query GetWorkersAnalytics($accountTag: string, $datetimeStart: string, $datetimeEnd: string, $scriptName: string) {
            viewer { accounts(filter: {accountTag: $accountTag}) {
              workersInvocationsAdaptive(limit: 500, filter: {scriptName: $scriptName, datetime_geq: $datetimeStart, datetime_leq: $datetimeEnd}) {
                sum { requests errors subrequests }
                dimensions { datetime scriptName status }
              }
            }}
          }`;
          fs.writeFileSync('tmp/gql.json',JSON.stringify({query:q,variables:{accountTag:process.env.ACCOUNT_ID_FOR_NODE,datetimeStart:process.env.FROM_ISO_FOR_NODE,datetimeEnd:process.env.TO_ISO_FOR_NODE,scriptName:process.env.WORKER_NAME}}));
          NODE
        env:
          ACCOUNT_ID_FOR_NODE: ${{ env.ACCOUNT_ID_PLACEHOLDER }}
