name: APD composed Worker snapshot (offline only)
on:
  pull_request:
    paths:
      - 'scripts/apd-worker-composition.mjs'
      - 'scripts/test-apd-worker-composition.mjs'
      - 'scripts/build-apd-career-worker-candidate.mjs'
      - 'scripts/apd-*-audit-stage.mjs'
      - '.github/workflows/apd-worker-composition.yml'
permissions:
  contents: read
jobs:
  composition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-apd-worker-composition.mjs scripts/test-apd-session-admin-audit.mjs scripts/test-apd-abc-expiry-audit.mjs scripts/test-apd-email-delivery-audit.mjs scripts/test-apd-channel-query-audit.mjs scripts/test-apd-channel-entitlement-audit.mjs scripts/test-apd-career-account.mjs
      - run: node scripts/apd-worker-composition.mjs --snapshot-only
      - run: git diff --exit-code origin/main -- worker-live worker.js auth_session_patch.js
