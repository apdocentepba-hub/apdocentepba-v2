name: Audit Cloudflare cron GraphQL 2026-09-17

on:
  push:
    paths:
      - '.github/workflows/audit-cloudflare-cron-graphql-20260917.yml'

# rerun: 2026-09-17T12:37Z recovery-v2
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: ancient-wildflower-cd37
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Query Workers invocation metrics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts?per_page=50" > tmp/accounts.json
          ACCOUNT_ID=$(jq -r '.result[0].id' tmp/accounts.json)
          FROM_ISO=$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          TO_ISO=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          QUERY='query GetWorkersAnalytics($accountTag: string, $datetimeStart: string, $datetimeEnd: string, $scriptName: string) { viewer { accounts(filter: {accountTag: $accountTag}) { workersInvocationsAdaptive(limit: 500, filter: {scriptName: $scriptName, datetime_geq: $datetimeStart, datetime_leq: $datetimeEnd}) { sum { requests errors subrequests } dimensions { datetime scriptName status } } } } }'
          jq -n --arg q "$QUERY" --arg a "$ACCOUNT_ID" --arg f "$FROM_ISO" --arg t "$TO_ISO" --arg s "$WORKER_NAME" '{query:$q,variables:{accountTag:$a,datetimeStart:$f,datetimeEnd:$t,scriptName:$s}}' > tmp/gql.json
          CODE=$(curl -sS -o tmp/result.json -w "%{http_code}" https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data @tmp/gql.json || true)
          echo "graphql_http=${CODE} from=${FROM_ISO} to=${TO_ISO}"
          node -e "const j=require('./tmp/result.json'); const a=j.data?.viewer?.accounts?.[0]?.workersInvocationsAdaptive||[]; console.log('rows='+a.length); for(const x of a.sort((x,y)=>String(x.dimensions?.datetime).localeCompare(String(y.dimensions?.datetime)))){console.log(JSON.stringify({datetime:x.dimensions?.datetime,status:x.dimensions?.status,requests:x.sum?.requests,errors:x.sum?.errors,subrequests:x.sum?.subrequests,script:x.dimensions?.scriptName}))}"
