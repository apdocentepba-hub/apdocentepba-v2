name: Audit live user offer state reactivation 2026-09-17

on:
  push:
    paths:
      - '.github/workflows/audit-live-user-offer-state-reactivation-20260917.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: ancient-wildflower-cd37
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect live state writes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts?per_page=50" > tmp/a.json
          A=$(jq -r '.result[0].id' tmp/a.json)
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${A}/workers/scripts/${WORKER_NAME}/deployments" > tmp/d.json
          V=$(node -e "const j=require('./tmp/d.json');const d=j.result.deployments[0];process.stdout.write((d.versions.find(x=>Number(x.percentage)===100)||d.versions[0]).version_id)")
          echo active=$V
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${A}/workers/workers/${WORKER_NAME}/versions/${V}?include=modules" > tmp/v.json
          node - <<'NODE'
          const r=require('./tmp/v.json').result; const m=(r.modules||[]).find(x=>x.name==='worker_hotfix.js'); const s=Buffer.from(m.content_base64,'base64').toString('utf8');
          const terms=['is_active: false','is_active: true','user_offer_state','last_seen_at: now','last_seen_at: scanStartedAt','loadStoredOffersForUser','syncUserOffer'];
          for(const term of terms){
            let from=0,n=0;
            while(true){ const i=s.indexOf(term,from); if(i<0) break; n++; console.log(`\n=== ${term} #${n} @${i} ===`); console.log(s.slice(Math.max(0,i-1800),Math.min(s.length,i+2800))); from=i+term.length; if(n>=8) break; }
          }
          NODE
