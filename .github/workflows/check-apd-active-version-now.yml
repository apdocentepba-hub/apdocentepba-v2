name: Check APD active version now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-apd-active-version-now.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read current deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_NAME: ancient-wildflower-cd37
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts?per_page=50" > accounts.json
          ACCOUNT_ID=$(node -e "const j=require('./accounts.json');process.stdout.write(j.result[0].id)")
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" > deployments.json
          node - <<'NODE'
          const j=require('./deployments.json');
          const d=j.result?.deployments?.[0];
          console.log(JSON.stringify({deployment_id:d?.id||null,source:d?.source||null,versions:(d?.versions||[]).map(v=>({version_id:v.version_id,percentage:v.percentage}))},null,2));
          if(!d?.versions?.length) process.exit(2);
          NODE
