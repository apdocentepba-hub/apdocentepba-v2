name: Materialize account security hardening

on:
  push:
    branches:
      - fix/account-security-session-api-2026-09-16
    paths:
      - .github/workflows/materialize-account-security.yml
      - scripts/materialize-account-security.mjs
      - scripts/account-security-worker-snippet.txt

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/account-security-session-api-2026-09-16
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize hardened account source
        run: node scripts/materialize-account-security.mjs

      - name: Verify hardened account contracts
        run: |
          set -euo pipefail
          node --check account_profile_patch.js
          node --check account_profile_hotfix.js
          node --check worker-live/worker_hotfix.js
          node scripts/test-account-security-contract.mjs
          node scripts/test-live-email-cron-isolation.mjs worker-live/worker_hotfix.js
          node scripts/test-live-email-observability.mjs worker-live/worker_hotfix.js
          node scripts/test-live-manual-email-dedupe.mjs worker-live/worker_hotfix.js
          node scripts/test-live-offer-identity-bundle.mjs worker-live/worker_hotfix.js
          node scripts/test-live-source-equivalence.mjs

      - name: Remove materializer and commit hardened source
        run: |
          set -euo pipefail
          git config user.name 'apdocentepba-hub'
          git config user.email 'apdocentepba@gmail.com'
          git rm .github/workflows/materialize-account-security.yml scripts/materialize-account-security.mjs scripts/account-security-worker-snippet.txt
          git add worker-live/worker_hotfix.js worker-live/manifest.json account_profile_patch.js account_profile_hotfix.js index.html scripts/test-account-security-contract.mjs .github/workflows/production-source-guard.yml
          git diff --cached --check
          git commit -m 'Harden account profile and password flows'
          git push origin HEAD:fix/account-security-session-api-2026-09-16
