name: APD career core on current main (offline only)
on:
  pull_request:
    paths:
      - 'scripts/apd-career-*.mjs'
      - 'scripts/test-apd-career-account.mjs'
      - 'scripts/test-apd-career-editor-browser.mjs'
      - 'scripts/build-apd-career-worker-candidate.mjs'
      - 'docs/sql/APD_CAREER_PROFILE_CANDIDATE.sql'
      - 'tests/sql/apd_career_profile_assert.sql'
      - '.github/workflows/apd-career-core-integration.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: apd_career_fixture
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and actual gate source regressions
        run: node --test scripts/test-apd-career-account.mjs
      - name: Disposable database ACL and CAS
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: test_only
          PGDATABASE: apd_career_fixture
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon;
          CREATE ROLE authenticated;
          CREATE ROLE service_role BYPASSRLS;
          CREATE TABLE public.users(id uuid PRIMARY KEY);
          INSERT INTO public.users VALUES ('11111111-1111-4111-8111-111111111111'),('22222222-2222-4222-8222-222222222222');
          SQL
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/APD_CAREER_PROFILE_CANDIDATE.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/apd_career_profile_assert.sql
          for i in 1 2; do
            psql -At -v ON_ERROR_STOP=1 -c "SET ROLE service_role; SELECT count(*) FROM public.apd_career_profile_cas('11111111-1111-4111-8111-111111111111','{\"schema\":1,\"seniorityYears\":11,\"positions\":[]}',2)" > "/tmp/career-writer-$i" &
          done
          wait
          test "$(cat /tmp/career-writer-1 /tmp/career-writer-2 | grep -E '^[01]$' | sort | tr '\n' ' ')" = '0 1 '
          test "$(psql -Atc 'SELECT revision FROM public.user_career_profile')" = 3
          echo APD_CAREER_CURRENT_MAIN_CAS_PASS
      - name: Chromium isolated editor (synthetic accounts and school)
        run: node scripts/test-apd-career-editor-browser.mjs
      - name: Preserve public entry point and backend
        run: git diff --exit-code origin/main -- index.html app_v2.js apd_comparador_panel.mjs apd_comparador_panel.css worker-live worker.js auth_session_patch.js
