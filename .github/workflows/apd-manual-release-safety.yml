name: APD manual-release safety gate (offline only)
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/test-apd-manual-release-guards.mjs'
      - 'scripts/test-live-messaging-status-auth-current.mjs'
      - 'scripts/audit-apd-workflow-triggers.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-no-automatic-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check and negative-control tests (never deploy)
        run: |
          node --check scripts/test-apd-manual-release-guards.mjs
          node --test scripts/test-apd-manual-release-guards.mjs
          node --test scripts/test-live-messaging-status-auth-current.mjs
      - name: Report other auto-triggered workflows with write-capable steps (read only)
        run: |
          node --check scripts/audit-apd-workflow-triggers.mjs
          node scripts/audit-apd-workflow-triggers.mjs
