name: Promote canonical live Worker safely

on:
  push:
    branches:
      - ops/promote-live-worker-b506502-20260916
    paths:
      - .github/workflows/promote-live-worker-safe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: ancient-wildflower-cd37
      WORKER_URL: https://ancient-wildflower-cd37.apdocentepba.workers.dev
      EXPECTED_OLD_VERSION_ID: 39b52f3c-faf6-4a15-8e93-7bbd2884b95d
      EXPECTED_BINDING_COUNT: '27'

    steps:
      - name: Checkout approved promotion branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify promotion and canonical contracts
        run: |
          set -euo pipefail
          node scripts/test-safe-production-promotion-workflow.mjs
          node --check worker-live/worker_hotfix.js
          node --check worker-live/email_queue_hotfix.js
          node --check worker-live/worker_email_queue_hotfix.js
          node scripts/test-sensitive-test-endpoints.mjs
          node scripts/test-mercadopago-status-mapping.mjs
          node scripts/test-account-security-contract.mjs
          node scripts/test-production-worker-source-guard.mjs

      - name: Capture production baseline and validate latest binding source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p tmp/promotion
          ROOT=tmp/promotion

          curl -fsS --retry 4 --retry-delay 2 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=50" > "$ROOT/accounts.json"
          ACCOUNT_ID="${CONFIGURED_ACCOUNT_ID:-}"
          if [ -n "$ACCOUNT_ID" ]; then
            ROOT="$ROOT" ACCOUNT_ID="$ACCOUNT_ID" node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync(`${process.env.ROOT}/accounts.json`,'utf8'));
          const rows=Array.isArray(j.result)?j.result:[];
          if(!j.success||!rows.some(x=>x.id===process.env.ACCOUNT_ID)) throw new Error('Configured Cloudflare account is unavailable');
          NODE
          else
            ACCOUNT_ID=$(ROOT="$ROOT" node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync(`${process.env.ROOT}/accounts.json`,'utf8'));
          const rows=Array.isArray(j.result)?j.result:[];
          if(!j.success||rows.length!==1||!rows[0]?.id) throw new Error(`Expected one Cloudflare account; found ${rows.length}`);
          process.stdout.write(rows[0].id);
          NODE
            )
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=${ACCOUNT_ID}" >> "$GITHUB_ENV"

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" > "$ROOT/deployments-before.json"
          ACTIVE_BEFORE=$(ROOT="$ROOT" node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync(`${process.env.ROOT}/deployments-before.json`,'utf8'));
          const d=j.result?.deployments?.[0];
          const traffic=(d?.versions||[]).filter(x=>Number(x.percentage)>0);
          if(!j.success||traffic.length!==1||Number(traffic[0].percentage)!==100||!traffic[0].version_id) throw new Error(`Unexpected production traffic ${JSON.stringify(traffic)}`);
          process.stdout.write(traffic[0].version_id);
          NODE
          )
          echo "Production active before promotion: ${ACTIVE_BEFORE}"
          test "$ACTIVE_BEFORE" = "$EXPECTED_OLD_VERSION_ID"

          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${EXPECTED_OLD_VERSION_ID}?include=modules" > "$ROOT/active.json"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions?per_page=25" > "$ROOT/versions.json"
          LATEST_VERSION_ID=$(ROOT="$ROOT" node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync(`${process.env.ROOT}/versions.json`,'utf8'));
          const rows=Array.isArray(j.result)?j.result:(j.result?.versions||[]);
          const latest=[...rows].sort((a,b)=>Number(b.number||0)-Number(a.number||0))[0];
          if(!j.success||!latest?.id) throw new Error('Latest Worker version not found');
          process.stdout.write(latest.id);
          NODE
          )
          echo "Latest version used only as binding source: ${LATEST_VERSION_ID}"
          echo "LATEST_VERSION_ID=${LATEST_VERSION_ID}" >> "$GITHUB_ENV"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${LATEST_VERSION_ID}?include=modules" > "$ROOT/latest.json"

          ROOT="$ROOT" EXPECTED_BINDING_COUNT="$EXPECTED_BINDING_COUNT" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const active=JSON.parse(fs.readFileSync(`${process.env.ROOT}/active.json`,'utf8')).result;
          const latest=JSON.parse(fs.readFileSync(`${process.env.ROOT}/latest.json`,'utf8')).result;
          if(!active?.id||!latest?.id) throw new Error('Version metadata missing');
          const shape=r=>(r.bindings||[]).map(b=>`${b.name}:${b.type}`).sort();
          const a=shape(active), l=shape(latest);
          const n=Number(process.env.EXPECTED_BINDING_COUNT);
          if(a.length!==n||l.length!==n) throw new Error(`Binding count drift active=${a.length} latest=${l.length}`);
          if(JSON.stringify(a)!==JSON.stringify(l)) throw new Error('Latest binding shape differs from active production');
          const activeKv=(active.bindings||[]).find(b=>b.name==='EMAIL_SWEEP_STATE');
          const latestKv=(latest.bindings||[]).find(b=>b.name==='EMAIL_SWEEP_STATE');
          const aid=String(activeKv?.namespace_id||activeKv?.id||'');
          const lid=String(latestKv?.namespace_id||latestKv?.id||'');
          if(!aid||aid!==lid) throw new Error('Latest EMAIL_SWEEP_STATE binding differs from active production');
          const metadata={
            main_module:'worker_hotfix.js',
            compatibility_date:active.compatibility_date,
            annotations:{
              'workers/message':'Guarded APDocentePBA canonical production candidate',
              'workers/tag':`prod-promote-${process.env.GITHUB_SHA?.slice(0,8)||'manual'}`
            },
            bindings:(latest.bindings||[]).map(b=>({name:b.name,type:'inherit',version_id:'latest'}))
          };
          if(Array.isArray(active.compatibility_flags)&&active.compatibility_flags.length) metadata.compatibility_flags=active.compatibility_flags;
          fs.writeFileSync(`${process.env.ROOT}/metadata.json`,JSON.stringify(metadata));
          console.log(`Latest bindings validated against active: ${l.length}/${n}; metadata uses literal latest`);
          NODE

      - name: Upload exact three-module zero-traffic candidate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ROOT=tmp/promotion
          HTTP_CODE=$(curl -sS -o "$ROOT/upload.json" -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/versions?bindings_inherit=strict" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F "metadata=<${ROOT}/metadata.json;type=application/json" \
            -F "worker_hotfix.js=@worker-live/worker_hotfix.js;filename=worker_hotfix.js;type=application/javascript+module" \
            -F "email_queue_hotfix.js=@worker-live/email_queue_hotfix.js;filename=email_queue_hotfix.js;type=application/javascript+module" \
            -F "worker_email_queue_hotfix.js=@worker-live/worker_email_queue_hotfix.js;filename=worker_email_queue_hotfix.js;type=application/javascript+module")
          echo "Cloudflare candidate upload HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" != "200" ]; then cat "$ROOT/upload.json"; exit 1; fi
          CANDIDATE_VERSION_ID=$(ROOT="$ROOT" node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync(`${process.env.ROOT}/upload.json`,'utf8'));
          if(!j.success||!j.result?.id) throw new Error(JSON.stringify(j.errors||j));
          process.stdout.write(j.result.id);
          NODE
          )
          echo "CANDIDATE_VERSION_ID=${CANDIDATE_VERSION_ID}" >> "$GITHUB_ENV"
          echo "Candidate version: ${CANDIDATE_VERSION_ID}"

      - name: Verify candidate hashes bindings and immutable preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ROOT=tmp/promotion
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/workers/${WORKER_NAME}/versions/${CANDIDATE_VERSION_ID}?include=modules" > "$ROOT/candidate.json"
          CANDIDATE_PREVIEW_URL=$(ROOT="$ROOT" CANDIDATE_VERSION_ID="$CANDIDATE_VERSION_ID" WORKER_NAME="$WORKER_NAME" EXPECTED_BINDING_COUNT="$EXPECTED_BINDING_COUNT" node --input-type=module - <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const j=JSON.parse(fs.readFileSync(`${process.env.ROOT}/candidate.json`,'utf8'));
          const r=j.result;
          const canonical=JSON.parse(fs.readFileSync('worker-live/manifest.json','utf8'));
          if(!j.success||!r?.id) throw new Error('Candidate detail missing');
          const hashes=new Map((r.modules||[]).map(m=>[m.name,crypto.createHash('sha256').update(Buffer.from(m.content_base64||'','base64')).digest('hex')]));
          for(const expected of canonical.modules||[]){
            const actual=hashes.get(expected.name);
            if(!actual) throw new Error(`candidate module missing: ${expected.name}`);
            if(actual!==expected.module_sha256) throw new Error(`module hash mismatch: ${expected.name}`);
          }
          const bindings=r.bindings||[];
          const n=Number(process.env.EXPECTED_BINDING_COUNT);
          if(bindings.length!==n) throw new Error(`bindings count mismatch ${bindings.length}/${n}`);
          const byKey=new Map(bindings.map(b=>[`${b.name}:${b.type}`,b]));
          for(const expected of canonical.bindings||[]){
            const actual=byKey.get(`${expected.name}:${expected.type}`);
            if(!actual) throw new Error(`candidate binding missing ${expected.name}:${expected.type}`);
            if(expected.name==='EMAIL_SWEEP_STATE'){
              const id=String(actual.namespace_id||actual.id||'');
              if(id!==expected.namespace_id) throw new Error('EMAIL_SWEEP_STATE namespace mismatch');
            }
          }
          const prefix=process.env.CANDIDATE_VERSION_ID.split('-')[0];
          const fallback=`https://${prefix}-${process.env.WORKER_NAME}.apdocentepba.workers.dev`;
          const url=(r.urls||[]).find(u=>String(u).includes('.workers.dev'))||fallback;
          console.error(`Candidate module hashes OK; bindings ${bindings.length}/${n} OK`);
          process.stdout.write(String(url).replace(/\/$/,''));
          NODE
          )
          echo "CANDIDATE_PREVIEW_URL=${CANDIDATE_PREVIEW_URL}" >> "$GITHUB_ENV"
          DUMMY=00000000-0000-4000-8000-000000000000
          curl_code(){ curl --retry 8 --retry-delay 2 -sS -o /dev/null -w '%{http_code}' "$@"; }
          test "$(curl_code "${CANDIDATE_PREVIEW_URL}/api/version")" = "200"
          test "$(curl_code "${CANDIDATE_PREVIEW_URL}/api/planes")" = "200"
          test "$(curl_code "${CANDIDATE_PREVIEW_URL}/api/mis-alertas?user_id=${DUMMY}")" = "401"
          test "$(curl_code "${CANDIDATE_PREVIEW_URL}/api/mi-plan?user_id=${DUMMY}")" = "401"
          test "$(curl_code "${CANDIDATE_PREVIEW_URL}/api/historico-resumen?user_id=${DUMMY}")" = "401"
          echo "Candidate preview smoke passed with production traffic unchanged."

      - name: Promote candidate to 100 percent and smoke production with rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ROOT=tmp/promotion
          PROMOTED=0
          rollback(){
            trap - ERR
            set +e
            if [ "${PROMOTED:-0}" != "1" ]; then return 0; fi
            echo "Production verification failed; rolling back to ${EXPECTED_OLD_VERSION_ID}"
            cat > "$ROOT/rollback.json" <<JSON
          {"strategy":"percentage","versions":[{"version_id":"${EXPECTED_OLD_VERSION_ID}","percentage":100}],"annotations":{"workers/message":"Automatic rollback after guarded canonical promotion failure"}}
          JSON
            curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data @"$ROOT/rollback.json" > "$ROOT/rollback-response.json"
            sleep 3
            curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" > "$ROOT/rollback-after.json"
            ROOT="$ROOT" EXPECTED_OLD_VERSION_ID="$EXPECTED_OLD_VERSION_ID" node - <<'NODE'
          const fs=require('fs'); const j=JSON.parse(fs.readFileSync(`${process.env.ROOT}/rollback-after.json`,'utf8')); const d=j.result?.deployments?.[0]; const v=(d?.versions||[]).find(x=>Number(x.percentage)===100); if(v?.version_id!==process.env.EXPECTED_OLD_VERSION_ID) process.exit(2); console.log(`Rollback verified: ${v.version_id}`);
          NODE
          }
          cat > "$ROOT/deploy.json" <<JSON
          {"strategy":"percentage","versions":[{"version_id":"${CANDIDATE_VERSION_ID}","percentage":100}],"annotations":{"workers/message":"Guarded canonical APDocentePBA promotion from ${GITHUB_SHA}"}}
          JSON
          trap rollback ERR
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" --data @"$ROOT/deploy.json" > "$ROOT/deploy-response.json"
          ROOT="$ROOT" node - <<'NODE'
          const fs=require('fs'); const j=JSON.parse(fs.readFileSync(`${process.env.ROOT}/deploy-response.json`,'utf8')); if(!j.success||!j.result?.id) throw new Error(JSON.stringify(j.errors||j)); console.log(`Deployment accepted ${j.result.id}`);
          NODE
          PROMOTED=1
          sleep 3
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments" > "$ROOT/deployments-after.json"
          ROOT="$ROOT" CANDIDATE_VERSION_ID="$CANDIDATE_VERSION_ID" node - <<'NODE'
          const fs=require('fs'); const j=JSON.parse(fs.readFileSync(`${process.env.ROOT}/deployments-after.json`,'utf8')); const d=j.result?.deployments?.[0]; const t=(d?.versions||[]).filter(x=>Number(x.percentage)>0); if(t.length!==1||Number(t[0].percentage)!==100||t[0].version_id!==process.env.CANDIDATE_VERSION_ID) throw new Error(JSON.stringify(t)); console.log(`Candidate active at 100% ${t[0].version_id}`);
          NODE
          curl_code(){ curl --retry 8 --retry-delay 2 -sS -o /dev/null -w '%{http_code}' "$@"; }
          DUMMY=00000000-0000-4000-8000-000000000000
          test "$(curl_code "${WORKER_URL}/api/version")" = "200"
          test "$(curl_code "${WORKER_URL}/api/planes")" = "200"
          test "$(curl_code "${WORKER_URL}/api/mis-alertas?user_id=${DUMMY}")" = "401"
          test "$(curl_code "${WORKER_URL}/api/mi-plan?user_id=${DUMMY}")" = "401"
          test "$(curl_code "${WORKER_URL}/api/historico-resumen?user_id=${DUMMY}")" = "401"
          cat > "$ROOT/summary.json" <<JSON
          {"ok":true,"old_version_id":"${EXPECTED_OLD_VERSION_ID}","candidate_version_id":"${CANDIDATE_VERSION_ID}","active_final":"${CANDIDATE_VERSION_ID}","bindings_verified":27,"module_hashes_verified":true,"preview_smoke":true,"production_smoke":true,"rollback_triggered":false}
          JSON
          trap - ERR
          echo "Production promotion and post-deploy smoke passed."

      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-production-promotion-evidence
          path: |
            tmp/promotion/summary.json
            tmp/promotion/deployments-before.json
            tmp/promotion/active.json
            tmp/promotion/latest.json
            tmp/promotion/upload.json
            tmp/promotion/candidate.json
            tmp/promotion/deployments-after.json
            tmp/promotion/rollback-response.json
            tmp/promotion/rollback-after.json
          if-no-files-found: ignore
