name: APD ABC expiry audit (offline only)
on:
  pull_request:
    paths:
      - 'scripts/apd-abc-expiry-audit-stage.mjs'
      - 'scripts/test-apd-abc-expiry-audit.mjs'
      - '.github/workflows/apd-abc-expiry-audit.yml'
  push:
    branches: ['fix/apd-abc-expiry-audit-20261127']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-apd-abc-expiry-audit.mjs
