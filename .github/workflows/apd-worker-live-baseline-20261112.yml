name: APD Worker live baseline audit 20261112 (read-only)
on:
  push:
    branches:
      - audit/apd-worker-live-baseline-20261112
    paths:
      - 'scripts/audit-apd-active-worker-20261112.mjs'
      - '.github/workflows/apd-worker-live-baseline-20261112.yml'
permissions:
  contents: read
jobs:
  verify-active:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact known production Worker without writing or deploying
        run: |
          set -euo pipefail
          node --check scripts/audit-apd-active-worker-20261112.mjs
          node scripts/audit-apd-active-worker-20261112.mjs
      - name: Save metadata-only attestation (never Worker source)
        uses: actions/upload-artifact@v4
        with:
          name: apd-live-worker-metadata-20261112
          path: tmp/apd-worker-baseline-audit/baseline.json
          retention-days: 30
          if-no-files-found: error
