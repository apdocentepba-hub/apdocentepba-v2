name: "APD ABC Solr cursor capability - read-only, projected IDs"
on:
  pull_request:
    paths:
      - 'scripts/audit-apd-abc-solr-cursor.mjs'
      - 'scripts/test-apd-abc-solr-cursor.mjs'
      - '.github/workflows/apd-abc-solr-cursor-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-readonly-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify no private records, secrets or modifications
        run: |
          node --check scripts/audit-apd-abc-solr-cursor.mjs
          node --test scripts/test-apd-abc-solr-cursor.mjs
      - name: Query real public ABC minimal projections (at most 6 GETs)
        run: node scripts/audit-apd-abc-solr-cursor.mjs
      - name: Retain ONLY aggregate cursor compatibility results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd-abc-cursor-capability
          path: tmp/apd-abc-solr-cursor/audit.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Ensure production sources unchanged
        run: git diff --exit-code origin/main -- worker-live/worker_hotfix.js index.html app_v2.js sql supabase
