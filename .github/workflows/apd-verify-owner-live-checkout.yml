name: APD owner live Complete checkout verification
on:
  pull_request:
    paths:
      - '.github/workflows/apd-verify-owner-live-checkout.yml'
      - 'scripts/apd-verify-owner-live-checkout.mjs'
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'apdocentepba-hub/apdocentepba-v2' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/complete-payment-live-verification-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apd-verify-owner-live-checkout.mjs
        env:
          APD_SUPABASE_DB_URL: ${{ secrets.APD_SUPABASE_DB_URL }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
