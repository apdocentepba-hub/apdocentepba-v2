name: Verify secure frontend propagated live

on:
  push:
    branches: [audit/full-project-2026-09-15]
    paths: [.github/workflows/verify-live-secure-frontend.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Compare live site with main and validate auth contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for attempt in 1 2 3 4 5 6; do
            curl -fsS -H 'Cache-Control: no-cache' "https://alertasapd.com.ar/?audit=${GITHUB_RUN_ID}-${attempt}" > /tmp/live-index.html
            curl -fsS -H 'Cache-Control: no-cache' "https://alertasapd.com.ar/auth_session_patch.js?v=2&audit=${GITHUB_RUN_ID}-${attempt}" > /tmp/live-auth.js
            curl -fsS "https://raw.githubusercontent.com/apdocentepba-hub/apdocentepba-v2/main/index.html" > /tmp/main-index.html
            curl -fsS "https://raw.githubusercontent.com/apdocentepba-hub/apdocentepba-v2/main/auth_session_patch.js" > /tmp/main-auth.js
            if cmp -s /tmp/live-index.html /tmp/main-index.html && cmp -s /tmp/live-auth.js /tmp/main-auth.js; then
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo 'Live frontend still differs from main after retries' >&2
              exit 1
            fi
            sleep 5
          done
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const index=fs.readFileSync('/tmp/live-index.html','utf8');
          const auth=fs.readFileSync('/tmp/live-auth.js','utf8');
          const app=index.indexOf('src="app_v2.js?v=17"');
          const session=index.indexOf('src="auth_session_patch.js?v=2"');
          if(app<0||session<0||session<app) throw new Error('secure auth patch is not loaded after app_v2.js');
          const between=index.slice(app,session);
          if((between.match(/<script src=/g)||[]).length!==1) throw new Error('another external application script loads before secure auth patch');
          if(!auth.includes("const SESSION_TOKEN_KEY = 'apd_session_token_v1'")) throw new Error('session token key missing');
          if(!/function getAuthBearer\(\) \{\s*return getSessionToken\(\);/m.test(auth)) throw new Error('Bearer still falls back to user UUID');
          if(!auth.includes('clearLegacyAuthIfNeeded')) throw new Error('legacy auth cleanup missing');
          if(!auth.includes('session_token')) throw new Error('session_token handling missing');
          if(/getSessionToken\(\)\s*\|\|\s*getUserToken\(\)/.test(auth)) throw new Error('unsafe UUID Bearer fallback remains');
          const sha=x=>crypto.createHash('sha256').update(x).digest('hex');
          const summary={ok:true,index_sha256:sha(index),auth_sha256:sha(auth),session_patch_loaded:true,session_only_bearer:true};
          fs.writeFileSync('out/summary.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: live-secure-frontend-verification
          path: out/summary.json
