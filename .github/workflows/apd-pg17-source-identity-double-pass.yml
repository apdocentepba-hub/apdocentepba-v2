name: "APD PG17 exact ABC identity double-pass before atomic commit"
on:
  pull_request:
    paths:
      - 'tests/sql/apd_identity_double_pass_pg17.sql'
      - 'scripts/test-apd-identity-double-pass-http.mjs'
      - '.github/workflows/apd-pg17-source-identity-double-pass.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-identity-in-disposable-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: apd_ci
          POSTGRES_PASSWORD: disposable_identity_only
          POSTGRES_DB: apd_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apd_ci -d apd_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: apd_ci
      PGPASSWORD: disposable_identity_only
      PGDATABASE: apd_ci
      APD_CI_FAKE_JWT_SECRET: "CI-only-identity-test-key-0123456789-very-long"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PG client and isolated pilot SQL only
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          fi
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/apd_atomic_district_pilot_pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/apd_atomic_stage_pages_pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/apd_atomic_full_24col_pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/apd_private_rpc_gateway_pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/apd_atomic_concurrency_fence_pg17.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/apd_identity_double_pass_pg17.sql
      - name: Serve only scanner RPC schema, private tables not exposed
        run: |
          docker run -d --rm --name apd-id-postgrest --network host \
            -e PGRST_DB_URI="postgres://apd_ci:disposable_identity_only@127.0.0.1:5432/apd_ci" \
            -e PGRST_DB_SCHEMAS="apd_scanner_api" \
            -e PGRST_DB_ANON_ROLE="apd_api_anon" \
            -e PGRST_JWT_SECRET="$APD_CI_FAKE_JWT_SECRET" \
            -e PGRST_SERVER_PORT="3300" \
            postgrest/postgrest:v16.3
          for i in $(seq 1 35); do
            if curl --silent --fail http://127.0.0.1:3300/ >/dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:3300/ >/dev/null
      - name: HTTP reject changed ID-set with identical numFound; accept exact recheck
        run: |
          node --check scripts/test-apd-identity-double-pass-http.mjs
          node scripts/test-apd-identity-double-pass-http.mjs
      - name: SQL check 24-field commit and verified identity with no pruning
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM apd_scanner_pilot.current_offers_full) <> 2
              OR (SELECT count(*) FROM apd_scanner_pilot.current_offers) <> 2
              OR (SELECT count(*) FROM apd_scanner_pilot.source_identity_manifests) <> 1
              OR NOT EXISTS (
                SELECT 1 FROM apd_scanner_pilot.source_identity_manifests m
                WHERE m.run_id='00000000-0000-0000-0000-000000000951'
                  AND m.verified_at IS NOT NULL
                  AND m.source_keys='["TEST_AAA","TEST_BBB"]'::jsonb
              )
              OR NOT EXISTS (SELECT 1 FROM apd_scanner_pilot.current_offers_full
                  WHERE source_offer_key='TEST_AAA' AND
                        raw->>'identity'='TEST_AAA' AND times_seen=1)
              OR EXISTS (SELECT 1 FROM apd_scanner_pilot.current_offers_full
                  WHERE source_offer_key='TEST_CCC')
              OR (SELECT count(*) FROM apd_scanner_pilot.district_commit_fence)<>1
            THEN RAISE EXCEPTION 'Double-pass identity contract failed'; END IF;
          END$$;
          SELECT 'PASS: exact source ID set, different IDs rejected at same count, 2 full rows, zero deletes' AS result;
          SQL
      - name: Ensure no Supabase, live Worker or public HTML changed
        run: git diff --exit-code origin/main -- worker-live/worker_hotfix.js index.html app_v2.js sql supabase
      - name: Remove disposable PostgREST container
        if: always()
        run: docker rm -f apd-id-postgrest || true
