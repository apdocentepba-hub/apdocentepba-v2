name: Observatorio SAD — cambios públicos

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

concurrency:
  group: observatorio-sad-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore last successful page state
        uses: actions/cache/restore@v4
        with:
          path: tmp/observatorio-sad/state.json
          key: ${{ runner.os }}-observatorio-sad-state-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-observatorio-sad-state-
      - name: Check official ABC central and district pages
        run: node scripts/observatorio-sad/scan-notices.mjs
      - name: Save state for the next hourly check
        if: success()
        uses: actions/cache/save@v4
        with:
          path: tmp/observatorio-sad/state.json
          key: ${{ runner.os }}-observatorio-sad-state-${{ github.run_id }}
      - name: Retain this scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-sad-${{ github.run_id }}
          path: tmp/observatorio-sad/report.json
          if-no-files-found: ignore
          retention-days: 30
