name: APD daily history — PostgreSQL isolation tests
on:
  push:
    branches:
      - 'feature/apd-lightweight-daily-history-20261102'
  pull_request:
    paths:
      - 'sql/apd_daily_province_summary_20261102.sql'
      - 'scripts/test-apd-daily-summary.sql'
      - 'scripts/apd-daily-history-preflight.sql'
      - 'scripts/test-apd-daily-worker-gate.mjs'
      - 'worker-live/apd_daily_summary_hook.mjs'
      - '.github/workflows/apd-daily-summary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql-acceptance:
    name: PostgreSQL ${{ matrix.postgres }} — schema and role acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: tests_only
          POSTGRES_USER: postgres
          POSTGRES_DB: apd_history_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apd_history_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar cliente PostgreSQL
        run: psql --version
      - name: Ejecutar migración y pruebas en base efímera de CI
        env:
          PGPASSWORD: tests_only
        run: |
          psql --host=127.0.0.1 --port=5432 --username=postgres --dbname=apd_history_test --no-psqlrc --set=ON_ERROR_STOP=1 --file=scripts/test-apd-daily-summary.sql
      - name: Preflight de solo lectura con datos de prueba y verificación de resultado
        env:
          PGPASSWORD: tests_only
        run: |
          output=$(psql --host=127.0.0.1 --port=5432 --username=postgres --dbname=apd_history_test --no-psqlrc --set=ON_ERROR_STOP=1 --no-align --tuples-only --file=scripts/apd-daily-history-preflight.sql)
          echo "$output"
          readiness=$(printf '%s' "$output" | tail -n 1 | awk -F '|' '{print $NF}')
          if [ "$readiness" != "t" ]; then
            echo "Preflight isolated expected ready_to_review_migration=true, got: $readiness" >&2
            exit 1
          fi
      - name: Validar adaptador opt-in en aislamiento
        run: |
          node --check worker-live/apd_daily_summary_hook.mjs
          node --test scripts/test-apd-daily-worker-gate.mjs
      - name: Confirmar que el Worker principal no fue modificado
        run: git diff --exit-code origin/main -- worker-live/worker_hotfix.js
