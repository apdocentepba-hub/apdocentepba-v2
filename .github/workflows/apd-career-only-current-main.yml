name: APD career only current main (isolated)
on:
  pull_request:
    paths:
      - 'scripts/apd-career-*.mjs'
      - 'scripts/test-apd-career-*.mjs'
      - 'scripts/build-apd-career-worker-candidate.mjs'
      - 'docs/sql/APD_CAREER_PROFILE_CANDIDATE.sql'
      - 'tests/sql/apd_career_profile_assert.sql'
      - '.github/workflows/apd-career-only-current-main.yml'
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Career contracts and packaged Worker baseline
        run: |
          node --check scripts/apd-career-editor-ui.mjs
          node --test scripts/test-apd-career-account.mjs
          node scripts/build-apd-career-worker-candidate.mjs
          node --check tmp/apd-career/worker-career-candidate.mjs
          node scripts/test-apd-career-full-worker.mjs
      - name: Disposable PostgreSQL 17 ownership and CAS
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: test_only
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon;
          CREATE ROLE authenticated;
          CREATE ROLE service_role BYPASSRLS;
          CREATE TABLE public.users(id uuid PRIMARY KEY);
          INSERT INTO public.users VALUES ('11111111-1111-4111-8111-111111111111'),('22222222-2222-4222-8222-222222222222');
          SQL
          psql -v ON_ERROR_STOP=1 -f docs/sql/APD_CAREER_PROFILE_CANDIDATE.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/apd_career_profile_assert.sql
          for i in 1 2; do
            psql -At -v ON_ERROR_STOP=1 -c "SET ROLE service_role; SELECT count(*) FROM public.apd_career_profile_cas('11111111-1111-4111-8111-111111111111','{\"schema\":1,\"seniorityYears\":11,\"positions\":[]}',2)" > "/tmp/career-writer-$i" &
          done
          wait
          test "$(cat /tmp/career-writer-1 /tmp/career-writer-2 | grep -E '^[01]$' | sort | tr '\n' ' ')" = '0 1 '
          test "$(psql -Atc 'SELECT revision FROM public.user_career_profile')" = 3
          echo APD_CAREER_CONCURRENT_CAS_PASS
