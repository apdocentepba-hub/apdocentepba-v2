name: APD pre-migration backup helper — offline tests
on:
  pull_request:
    paths:
      - 'scripts/APDocentePBA_respaldo_pre_migracion.ps1'
      - 'scripts/test-apd-backup-helper.sh'
      - '.github/workflows/apd-backup-helper-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-backup-script:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Test PowerShell preflight, fake export and SHA-256 tamper detection
        run: bash scripts/test-apd-backup-helper.sh
