name: APD career account persistence candidate (no deploy)
on:
  pull_request:
    paths:
      - 'scripts/apd-career-*.mjs'
      - 'scripts/apd-application-diary*.mjs'
      - 'docs/sql/APD_APPLICATION_DIARY_CANDIDATE.sql'
      - 'scripts/apd_school_catalog_import.py'
      - 'scripts/test_apd_school_catalog_import.py'
      - 'scripts/test-apd-career-account.mjs'
      - 'scripts/test-apd-career-editor-browser.mjs'
      - 'scripts/test-apd-career-full-worker.mjs'
      - 'scripts/test-apd-career-http.mjs'
      - 'scripts/inspect-account-schedule-live.mjs'
      - 'tests/sql/apd_career_http_fixture.sql'
      - 'scripts/build-apd-career-worker-candidate.mjs'
      - 'docs/sql/APD_CAREER_PROFILE_CANDIDATE.sql'
      - 'tests/sql/apd_career_profile_assert.sql'
      - '.github/workflows/apd-career-account-candidate.yml'
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: School catalog importer regression (synthetic CSV)
        run: python3 -m unittest discover -s scripts -p 'test_apd_school_catalog_import.py' -v
      - name: Validate JS and account isolation
        run: |
          node --check scripts/apd-career-editor-ui.mjs
          node --test scripts/test-apd-career-account.mjs scripts/test-apd-week-simulator.mjs
      - name: Read active Cloudflare source for the isolated runtime test
        id: capture
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 330 && github.event.pull_request.head.ref == 'feat/career-account-persistence-20261124'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/inspect-account-schedule-live.mjs career
      - name: Build isolated Worker and verify routing
        env:
          APD_CAREER_LIVE_SOURCE: ${{ steps.capture.outcome == 'success' && 'tmp/apd-career/active-worker.mjs' || '' }}
        run: |
          node scripts/build-apd-career-worker-candidate.mjs
          node --check tmp/apd-career/worker-career-candidate.mjs
          node scripts/test-apd-career-full-worker.mjs
      - name: PostgreSQL isolated CAS and grants
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: test_only
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon;
          CREATE ROLE authenticated;
          CREATE ROLE service_role BYPASSRLS;
          CREATE TABLE public.users(id uuid PRIMARY KEY);
          INSERT INTO public.users VALUES ('11111111-1111-4111-8111-111111111111'),('22222222-2222-4222-8222-222222222222');
          SQL
          psql -v ON_ERROR_STOP=1 -f docs/sql/APD_CAREER_PROFILE_CANDIDATE.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/apd_career_profile_assert.sql
          # Two distinct writers race against exactly the same revision.
          for i in 1 2; do
            psql -At -v ON_ERROR_STOP=1 -c "SET ROLE service_role; SELECT count(*) FROM public.apd_career_profile_cas('11111111-1111-4111-8111-111111111111','{\"schema\":1,\"seniorityYears\":11,\"positions\":[]}',2)" > "/tmp/career-writer-$i" &
          done
          wait
          test "$(cat /tmp/career-writer-1 /tmp/career-writer-2 | grep -E '^[01]$' | sort | tr '\n' ' ')" = '0 1 '
          test "$(psql -Atc 'SELECT revision FROM public.user_career_profile')" = 3
          echo APD_CAREER_CONCURRENT_CAS_PASS
      - name: Authenticate two fixture accounts in workerd with real PostgREST
        env:
          APD_CAREER_LIVE_SOURCE: ${{ steps.capture.outcome == 'success' && 'tmp/apd-career/active-worker.mjs' || '' }}
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: test_only
          PGDATABASE: postgres
        run: |
          createdb apd_career_http
          psql -d apd_career_http -X -v ON_ERROR_STOP=1 -f tests/sql/apd_career_http_fixture.sql
          psql -d apd_career_http -X -v ON_ERROR_STOP=1 -f docs/sql/APD_CAREER_PROFILE_CANDIDATE.sql
          psql -d apd_career_http -X -v ON_ERROR_STOP=1 -f docs/sql/APD_APPLICATION_DIARY_CANDIDATE.sql
          docker run -d --rm --name apd-career-http --network host \
            -e PGRST_DB_URI=postgres://postgres:test_only@127.0.0.1:5432/apd_career_http \
            -e PGRST_DB_ANON_ROLE=service_role -e PGRST_DB_SCHEMAS=public \
            -e PGRST_SERVER_HOST=127.0.0.1 -e PGRST_SERVER_PORT=3301 \
            postgrest/postgrest:v16.3
          trap 'docker rm -f apd-career-http >/dev/null 2>&1 || true' EXIT
          curl --silent --show-error --fail --retry 15 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:3301/ >/dev/null
          npm install --prefix tmp/apd-career-runtime --no-package-lock --no-audit --no-fund miniflare@4.20251118.0
          node scripts/test-apd-career-http.mjs
          test "$(psql -d apd_career_http -Atc 'SELECT count(*) FROM public.sessions')" = 3
          test "$(psql -d apd_career_http -Atc 'SELECT count(*) FROM public.user_career_profile WHERE revision=1')" = 2
      - name: Real Chromium editor regression (synthetic accounts)
        if: ${{ !cancelled() }}
        run: node scripts/test-apd-career-editor-browser.mjs
      - name: Remove captured source and isolated builds
        if: always()
        run: rm -rf tmp/apd-career
