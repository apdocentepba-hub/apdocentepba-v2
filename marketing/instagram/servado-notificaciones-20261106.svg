<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#092C40"/><circle cx="1020" cy="160" r="330" fill="#126579" opacity=".45"/><rect x="58" y="52" width="964" height="80" rx="20" fill="#16485A"/><text x="90" y="105" font-size="35" font-family="Arial, sans-serif" font-weight="bold" fill="#F0FFFF">APDocentePBA  ·  GUÍA DOCENTE</text><text x="60" y="246" font-size="68" font-family="Arial, sans-serif" font-weight="bold" fill="#FFFFFF">¿No viste un aviso</text><text x="60" y="332" font-size="68" font-family="Arial, sans-serif" font-weight="bold" fill="#91F1D6">de SerVaDo?</text><text x="64" y="398" font-size="32" font-family="Arial, sans-serif" fill="#D9F3F4">Revisá las notificaciones oficiales.</text><rect x="55" y="464" width="970" height="654" rx="32" fill="#F6FBFA"/><g font-family="Arial, sans-serif" fill="#123B4C"><text x="98" y="540" font-size="28" font-weight="bold" fill="#176878">PASO 01</text><text x="98" y="592" font-size="41" font-weight="bold">Entrá a SerVaDo</text><text x="98" y="635" font-size="27">servado.abc.gob.ar</text><line x1="98" y1="672" x2="980" y2="672" stroke="#CEE1E3" stroke-width="3"/><text x="98" y="735" font-size="28" font-weight="bold" fill="#176878">PASO 02</text><text x="98" y="786" font-size="39" font-weight="bold">Abrí Notificaciones</text><text x="98" y="832" font-size="26">El círculo rojo indica avisos sin leer.</text><line x1="98" y1="868" x2="980" y2="868" stroke="#CEE1E3" stroke-width="3"/><text x="98" y="930" font-size="28" font-weight="bold" fill="#176878">PASO 03</text><text x="98" y="980" font-size="37" font-weight="bold">Revisá la novedad</text><text x="98" y="1025" font-size="26">Y el calendario del servicio.</text><text x="98" y="1081" font-size="24" fill="#3A6770">La campanita señala actividad importante.</text></g><text x="62" y="1190" font-size="28" font-family="Arial, sans-serif" font-weight="bold" fill="#96F5D8">Guardá esta guía y compartila.</text><text x="62" y="1240" font-size="22" font-family="Arial, sans-serif" fill="#D8EDF0">Fuente: servido.abc.gob.ar/ayuda</text><text x="62" y="1280" font-size="19" font-family="Arial, sans-serif" fill="#D8EDF0">APDocentePBA es independiente de ABC / DGCyE.</text></svg>