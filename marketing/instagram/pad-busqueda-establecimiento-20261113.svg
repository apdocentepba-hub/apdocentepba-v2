<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#101b35"/><rect x="60" y="62" width="960" height="1226" rx="35" fill="#f7fafc"/><rect x="60" y="62" width="960" height="225" rx="35" fill="#164e8a"/><text x="105" y="128" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#b9e6ff">APDOCENTEPBA · GUÍA DOCENTE</text><text x="105" y="194" font-family="Arial,sans-serif" font-size="54" font-weight="bold" fill="white">¿Buscás el PAD</text><text x="105" y="253" font-family="Arial,sans-serif" font-size="54" font-weight="bold" fill="white">de una escuela?</text><text x="106" y="353" font-family="Arial,sans-serif" font-size="37" fill="#183354">En SerVaDo podés consultar por</text><text x="106" y="398" font-family="Arial,sans-serif" font-size="37" font-weight="bold" fill="#183354">establecimiento, no solo por DNI.</text><g font-family="Arial,sans-serif"><rect x="100" y="450" width="880" height="175" rx="22" fill="#e4f1fb"/><circle cx="161" cy="510" r="37" fill="#164e8a"/><text x="150" y="523" font-size="39" fill="white" font-weight="bold">1</text><text x="218" y="508" font-size="39" font-weight="bold" fill="#183354">Abrí PAD en SerVaDo</text><text x="218" y="556" font-size="31" fill="#334d68">servado.abc.gob.ar</text><rect x="100" y="648" width="880" height="200" rx="22" fill="#e4f1fb"/><circle cx="161" cy="709" r="37" fill="#164e8a"/><text x="150" y="722" font-size="39" fill="white" font-weight="bold">2</text><text x="218" y="709" font-size="37" font-weight="bold" fill="#183354">Elegí establecimiento</text><text x="218" y="760" font-size="30" fill="#334d68">Completá dependencia, distrito,</text><text x="218" y="801" font-size="30" fill="#334d68">tipo de escuela y número.</text><rect x="100" y="872" width="880" height="175" rx="22" fill="#e4f1fb"/><circle cx="161" cy="933" r="37" fill="#164e8a"/><text x="150" y="946" font-size="39" fill="white" font-weight="bold">3</text><text x="218" y="933" font-size="37" font-weight="bold" fill="#183354">Revisá los resultados</text><text x="218" y="986" font-size="30" fill="#334d68">Verificá el año y la información</text><text x="218" y="1026" font-size="30" fill="#334d68">mostrada antes de usarla.</text></g><line x1="100" y1="1092" x2="980" y2="1092" stroke="#ccd7e2" stroke-width="3"/><text x="105" y="1143" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#164e8a">Fuente: ayuda oficial SerVaDo (DGCyE)</text><text x="105" y="1188" font-family="Arial,sans-serif" font-size="25" fill="#42546c">Guía ilustrativa · Sin datos personales</text><text x="105" y="1234" font-family="Arial,sans-serif" font-size="24" fill="#42546c">APDocentePBA es independiente de ABC/DGCyE.</text></svg>