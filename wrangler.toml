name = "ancient-wildflower-cd37"
main = "worker-live/worker_hotfix.js"
compatibility_date = "2026-04-01"
workers_dev = true
keep_vars = true

# PRODUCTION_SOURCE_GUARD_V1
# The active production Worker source is now snapshotted under worker-live/ and
# hash-verified against the active Cloudflare version. Real repository deploys
# remain intentionally blocked until the complete deployment configuration,
# including binding identifiers, is proven reproducible end-to-end.

[observability]
enabled = true

[triggers]
crons = ["0 01 * * *", "0 17 * * *", "0 21 * * *"]

# Binding confirmado en Cloudflare:
# EMAIL_SWEEP_STATE (KV namespace)
#
# Para dejar el deploy 100% reproducible desde GitHub falta agregar el id real
# del namespace en un bloque kv_namespaces. Mientras eso no este verificado,
# solo se permite empaquetado dry-run y el deploy real sigue bloqueado.
