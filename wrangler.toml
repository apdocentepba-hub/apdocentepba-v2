name = "ancient-wildflower-cd37"
main = "worker-live/worker_hotfix.js"
compatibility_date = "2026-04-01"
workers_dev = true
keep_vars = true

# PRODUCTION_SOURCE_GUARD_V1
# The active production Worker source is snapshotted under worker-live/ and
# hash-verified against the active Cloudflare version. Scalar vars remain
# preserved by keep_vars=true and secrets remain managed in Cloudflare.
# Real repository deploys stay blocked until the end-to-end deployment path is
# explicitly validated against production metadata and post-deploy smoke gates.

[observability]
enabled = true

[triggers]
crons = ["0 01 * * *", "0 17 * * *", "0 21 * * *"]

[[kv_namespaces]]
binding = "EMAIL_SWEEP_STATE"
id = "1f2f957e8fb44b76a09a53d63979633c"
