name = "ancient-wildflower-cd37"
main = "worker_hotfix.js"
compatibility_date = "2026-04-01"
workers_dev = true
keep_vars = true

# PRODUCTION_SOURCE_GUARD_V1
# The active production Worker is currently maintained from the verified live bundle.
# Do not deploy this modular repository source directly until it is source-identical
# to production. The manual GitHub deploy workflow and package deploy script are
# intentionally blocked to prevent regression to stale Worker logic.

[observability]
enabled = true

[triggers]
crons = ["0 01 * * *", "0 17 * * *", "0 21 * * *"]

# Binding confirmado en Cloudflare:
# EMAIL_SWEEP_STATE (KV namespace)
#
# Para dejar el deploy 100% reproducible desde GitHub falta agregar el id real
# del namespace en un bloque kv_namespaces. Eso todavia no se cargo aca porque
# en el dashboard vimos el nombre del binding pero no el namespace id.
